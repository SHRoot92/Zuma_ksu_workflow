name: Auto Clean Actions & Caches

on:
  schedule:
    # Run daily at 20:00 UTC (04:00 AM Beijing Time)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      keep_success_count:
        description: 'Number of recent SUCCESSFUL workflow runs to keep'
        required: false
        type: number
        default: 5
      clean_stale_cache:
        description: 'Prune stale GitHub Actions caches (older than 7 days)'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Prune Old Runs & Caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prune Workflow Runs (Option B)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_SUCCESS_COUNT: ${{ github.event.inputs.keep_success_count || 5 }}
        run: |
          set -e
          echo "🧹 Starting automated cleanup of GitHub Actions workflow runs (Strategy: Option B)..."
          NOW=$(date +%s)
          
          # Fetch all workflows in the repo
          WORKFLOWS=$(gh workflow list --json id,name,path -q '.[] | @base64')
          
          TOTAL_SUCCESS_DELETED=0
          TOTAL_FAILED_DELETED=0
          
          for wf_b64 in $WORKFLOWS; do
            wf_json=$(echo "$wf_b64" | base64 -d)
            wf_name=$(echo "$wf_json" | jq -r .name)
            wf_path=$(echo "$wf_json" | jq -r .path)
            wf_file=$(basename "$wf_path")
            
            echo "🔍 Inspecting runs for workflow: $wf_name ($wf_file)..."
            
            # 1. Prune Successful Runs beyond keep limit
            if [ "$wf_file" = "check-upstream-updates.yml" ]; then
              LIMIT_KEEP=5
            else
              LIMIT_KEEP=$KEEP_SUCCESS_COUNT
            fi
            
            OLD_SUCCESS_RUNS=$(gh run list --workflow="$wf_file" --json databaseId,status,conclusion -q               ".[] | select(.status==\"completed\" and .conclusion==\"success\") | .databaseId" | tail -n +$((LIMIT_KEEP + 1)) || true)
            
            if [ -n "$OLD_SUCCESS_RUNS" ]; then
              echo "   🗑️ Deleting older successful runs (> $LIMIT_KEEP):"
              for run_id in $OLD_SUCCESS_RUNS; do
                echo "      - Deleting success run: $run_id"
                gh run delete "$run_id" || echo "      ⚠️ Failed to delete $run_id, skipping"
                TOTAL_SUCCESS_DELETED=$((TOTAL_SUCCESS_DELETED + 1))
              done
            else
              echo "   ✅ Successful runs count is within threshold (keeping latest $LIMIT_KEEP)."
            fi
            
            # 2. Prune Failed / Cancelled / Timed_out runs older than 24 hours (86400s)
            FAILED_RUNS_JSON=$(gh run list --workflow="$wf_file" --json databaseId,status,conclusion,createdAt --limit 100               -q ".[] | select(.status==\"completed\" and .conclusion!=\"success\")" || echo "")
            
            if [ -n "$FAILED_RUNS_JSON" ]; then
              echo "$FAILED_RUNS_JSON" | jq -c '.' | while read -r item; do
                [ -z "$item" ] && continue
                f_id=$(echo "$item" | jq -r .databaseId)
                f_concl=$(echo "$item" | jq -r .conclusion)
                f_date=$(echo "$item" | jq -r .createdAt)
                
                f_ts=$(date -d "$f_date" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$f_date" +%s 2>/dev/null || echo "$NOW")
                age_hours=$(( (NOW - f_ts) / 3600 ))
                
                if [ "$age_hours" -ge 24 ]; then
                  echo "   🗑️ Deleting $f_concl run (age: ${age_hours}h >= 24h): ID $f_id"
                  gh run delete "$f_id" || echo "   ⚠️ Failed to delete $f_id, skipping"
                  TOTAL_FAILED_DELETED=$((TOTAL_FAILED_DELETED + 1))
                else
                  echo "   🛡️ Preserving recent $f_concl run (age: ${age_hours}h < 24h for inspection): ID $f_id"
                fi
              done
            fi
          done
          
          echo "total_success_deleted=$TOTAL_SUCCESS_DELETED" >> "$GITHUB_ENV"
          echo "total_failed_deleted=$TOTAL_FAILED_DELETED" >> "$GITHUB_ENV"

      - name: Prune Stale Actions Caches
        if: github.event.inputs.clean_stale_cache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          echo "🧹 Inspecting GitHub Actions caches..."
          
          # List all caches and find any older than 7 days (604800 seconds)
          CACHES=$(gh cache list --json id,key,createdAt,sizeInBytes -q '.[]' 2>/dev/null || echo "")
          
          CACHE_DELETED=0
          if [ -n "$CACHES" ]; then
            NOW=$(date +%s)
            
            gh cache list --json id,key,createdAt --limit 100 | jq -c '.[]' | while read -r cache_item; do
              [ -z "$cache_item" ] && continue
              cache_id=$(echo "$cache_item" | jq -r .id)
              cache_key=$(echo "$cache_item" | jq -r .key)
              created_at=$(echo "$cache_item" | jq -r .createdAt)
              
              created_ts=$(date -d "$created_at" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$created_at" +%s 2>/dev/null || echo "$NOW")
              age_days=$(( (NOW - created_ts) / 86400 ))
              
              if [ "$age_days" -ge 7 ]; then
                echo "🗑️ Deleting stale cache ($age_days days old): $cache_key (ID: $cache_id)"
                gh cache delete "$cache_id" || echo "⚠️ Failed to delete cache $cache_id"
                CACHE_DELETED=$((CACHE_DELETED + 1))
              fi
            done
          else
            echo "✅ No stale caches found."
          fi
          
          echo "total_caches_deleted=$CACHE_DELETED" >> "$GITHUB_ENV"

      - name: Generate Cleanup Report
        run: |
          echo "### 🧹 Automated Actions Cleanup Report (Strategy: Option B)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time**: \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Successful Runs Pruned (> 5)**: \`${{ env.total_success_deleted || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed/Cancelled Runs Pruned (> 24h)**: \`${{ env.total_failed_deleted || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stale Caches Cleaned (> 7d)**: \`${{ env.total_caches_deleted || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Protected Artifacts**: Releases & Tags are 100% preserved." >> $GITHUB_STEP_SUMMARY
