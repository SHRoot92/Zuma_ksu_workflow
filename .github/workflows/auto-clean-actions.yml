name: Auto Clean Actions & Caches

on:
  schedule:
    # Run daily at 20:00 UTC (04:00 AM Beijing Time)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      keep_runs_count:
        description: 'Number of recent workflow runs to keep per workflow'
        required: false
        type: number
        default: 5
      clean_stale_cache:
        description: 'Prune stale GitHub Actions caches'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Prune Old Runs & Caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prune Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_COUNT: ${{ github.event.inputs.keep_runs_count || 5 }}
        run: |
          set -e
          echo "🧹 Starting automated cleanup of GitHub Actions workflow runs..."
          
          # Fetch all workflows in the repo
          WORKFLOWS=$(gh workflow list --json id,name,path -q '.[] | @base64')
          
          TOTAL_DELETED=0
          
          for wf_b64 in $WORKFLOWS; do
            wf_json=$(echo "$wf_b64" | base64 -d)
            wf_name=$(echo "$wf_json" | jq -r .name)
            wf_path=$(echo "$wf_json" | jq -r .path)
            wf_file=$(basename "$wf_path")
            
            echo "🔍 Inspecting runs for workflow: $wf_name ($wf_file)..."
            
            # If check-upstream, keep at most 5 runs; for builds, use KEEP_COUNT
            if [ "$wf_file" = "check-upstream-updates.yml" ]; then
              LIMIT_KEEP=5
            else
              LIMIT_KEEP=$KEEP_COUNT
            fi
            
            # Find run IDs beyond the keep limit
            OLD_RUNS=$(gh run list --workflow="$wf_file" --json databaseId,status -q               ".[] | select(.status==\"completed\") | .databaseId" | tail -n +$((LIMIT_KEEP + 1)) || true)
            
            if [ -n "$OLD_RUNS" ]; then
              echo "🗑️ Deleting older completed runs for $wf_name:"
              for run_id in $OLD_RUNS; do
                echo "   - Deleting run ID: $run_id"
                gh run delete "$run_id" || echo "   ⚠️ Failed to delete $run_id, skipping"
                TOTAL_DELETED=$((TOTAL_DELETED + 1))
              done
            else
              echo "   ✅ Runs count is within threshold (keeping latest $LIMIT_KEEP runs)."
            fi
          done
          
          echo "total_runs_deleted=$TOTAL_DELETED" >> "$GITHUB_ENV"

      - name: Prune Stale Actions Caches
        if: github.event.inputs.clean_stale_cache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          echo "🧹 Inspecting GitHub Actions caches..."
          
          # List all caches and find any older than 7 days (or duplicated keys)
          CACHES=$(gh cache list --json id,key,createdAt,sizeInBytes -q '.[]' 2>/dev/null || echo "")
          
          CACHE_DELETED=0
          if [ -n "$CACHES" ]; then
            # Delete caches older than 7 days (604800 seconds)
            NOW=$(date +%s)
            
            gh cache list --json id,key,createdAt --limit 100 | jq -c '.[]' | while read -r cache_item; do
              cache_id=$(echo "$cache_item" | jq -r .id)
              cache_key=$(echo "$cache_item" | jq -r .key)
              created_at=$(echo "$cache_item" | jq -r .createdAt)
              
              created_ts=$(date -d "$created_at" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$created_at" +%s 2>/dev/null || echo "$NOW")
              age_days=$(( (NOW - created_ts) / 86400 ))
              
              if [ "$age_days" -ge 7 ]; then
                echo "🗑️ Deleting stale cache ($age_days days old): $cache_key (ID: $cache_id)"
                gh cache delete "$cache_id" || echo "⚠️ Failed to delete cache $cache_id"
                CACHE_DELETED=$((CACHE_DELETED + 1))
              fi
            done
          else
            echo "✅ No stale caches found."
          fi
          
          echo "total_caches_deleted=$CACHE_DELETED" >> "$GITHUB_ENV"

      - name: Generate Cleanup Report
        run: |
          echo "### 🧹 Automated Actions Cleanup Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time**: \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Runs Pruned**: \`${{ env.total_runs_deleted || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stale Caches Cleaned**: \`${{ env.total_caches_deleted || 0 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Protected Artifacts**: Releases & Tags are 100% preserved." >> $GITHUB_STEP_SUMMARY
