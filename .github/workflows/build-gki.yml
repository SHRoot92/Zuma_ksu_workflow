name: Build GKI Kernel with xxKSU Staging

on:
  workflow_dispatch:
    inputs:
      force_clean_build:
        default: false
        type: boolean
      create_release:
        default: true
        type: boolean
      debug:
        default: false
        type: boolean

permissions:
  contents: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ✅ Checkout
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ✅ 依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential binutils-aarch64-linux-gnu \
            python3 rsync ccache curl zip unzip git \
            libncurses-dev gawk openssl dwarves zstd pahole

      # ✅ ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.ref_name }}
          restore-keys: |
            ccache-

      - name: Setup ccache
        run: |
          ccache --max-size=5G
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> $GITHUB_ENV

      # ✅ Clang
      - name: Setup Clang
        run: |
          mkdir clang && cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz
          tar -xzf *.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      # ✅ 下载 kernel
      - name: Download Kernel Source
        run: |
          wget -q https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-03_r13/common-android14-6.1-2026-03_r13.tar.gz
          mkdir kernel
          tar -xzf *.tar.gz -C kernel

      # ✅ KernelSU
      - name: Setup KernelSU
        run: |
          cd kernel
          git clone --depth=1 --branch=staging https://github.com/backslashxx/KernelSU.git KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      # ✅ Sultan patches
      - name: Apply Sultan Patches
        run: |
          cd kernel
          git clone --depth=1 https://github.com/yapixel/kernel_patches.git
          patch -p1 < kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < kernel_patches/sultan/62_init_Makefile.patch

      # ✅ ✅ CRC PATCH（你要的重点）
      - name: Apply Vendor Module CRC Patch
        run: |
          cd kernel

          PATCH_FILE="../.github/patches/dirty_allow_vendor_module_crcs.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "Patch not found!"
            exit 1
          fi

          if patch -p1 --dry-run < "$PATCH_FILE" >/dev/null 2>&1; then
            patch -p1 < "$PATCH_FILE"
            echo "Patch applied (-p1)"
          elif patch -p0 --dry-run < "$PATCH_FILE" >/dev/null 2>&1; then
            patch -p0 < "$PATCH_FILE"
            echo "Patch applied (-p0)"
          else
            echo "Patch skipped"
          fi

      # ✅ config
      - name: Configure Kernel
        run: |
          cd kernel
          export ARCH=arm64
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

          cat >> out/.config <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODVERSIONS=n
          EOF

          yes "" | make O=out ARCH=arm64 LLVM=1 olddefconfig

      # ✅ build
      - name: Build Kernel
        run: |
          cd kernel
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

      # ✅ verify
      - name: Verify Image
        run: |
          ls -lh kernel/out/arch/arm64/boot/Image

      # ✅ AnyKernel3
      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

          cd AnyKernel3
          zip -r9 ../kernel.zip * -x '*.git*'

      # ✅ artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip

      # ✅ release
      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: kernel.zip
