name: Build Sultan + KSU (Matrix)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'master'
          - 'staging'
        default: 'master'
      hook_mode:
        description: 'Hook Mode to Build'
        required: true
        type: choice
        options:
          - 'all'
          - 'manual'
          - 'lsm'
        default: 'all'
      enable_susfs:
        description: 'SuSFS Integration'
        required: true
        type: choice
        options:
          - 'all'
          - 'true'
          - 'false'
        default: 'all'
      use_ccache:
        description: 'Enable Ccache Acceleration'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.ksu_branch }}
  cancel-in-progress: false

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_REPO_BRANCH: sultan-shiba-susfs-minimal
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_COMPILERCHECK: "content"
  CCACHE_NOHASHDIR: "true"
  CCACHE_TEMPDIR: "/dev/shm/ccache-temp"

jobs:
  matrix_prep:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      susfs_matrix: ${{ steps.set-matrix.outputs.susfs_matrix }}
    steps:
      - id: set-matrix
        run: |
          SUSFS_INPUT="${{ github.event.inputs.enable_susfs }}"
          if [ -z "$SUSFS_INPUT" ] || [ "$SUSFS_INPUT" = "all" ]; then
            echo "susfs_matrix=[\"true\", \"false\"]" >> "$GITHUB_OUTPUT"
          else
            echo "susfs_matrix=[\"$SUSFS_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build_manual:
    name: Manual Hook (SUSFS=${{ matrix.enable_susfs }})
    if: github.event.inputs.hook_mode == 'all' || github.event.inputs.hook_mode == 'manual' || github.event_name != 'workflow_dispatch'
    needs: matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable_susfs: ${{ fromJson(needs.matrix_prep.outputs.susfs_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Fast Git Protocol
        run: |
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/2
          git config --global core.compression 0

      - name: Free Disk Space & Install Fast Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true &
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bison flex bc aria2 ccache zip zstd

      - name: Cache Ccache Data
        if: github.event.inputs.use_ccache != 'false'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gs201-manual-${{ matrix.enable_susfs }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.sha }}
          restore-keys: |
            ccache-gs201-manual-${{ matrix.enable_susfs }}-${{ github.event.inputs.ksu_branch || 'master' }}-
            ccache-gs201-manual-${{ matrix.enable_susfs }}-
            ccache-gs201-${{ matrix.enable_susfs }}-
            ccache-gs201-

      - name: Setup Ccache Configurations & Wrappers
        if: github.event.inputs.use_ccache != 'false'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p /dev/shm/ccache-temp

          CCACHE_BIN="${{ github.workspace }}/.ccache-bin"
          mkdir -p "$CCACHE_BIN"
          ln -sf "$(which ccache)" "$CCACHE_BIN/aarch64-none-linux-gnu-gcc"
          ln -sf "$(which ccache)" "$CCACHE_BIN/aarch64-none-linux-gnu-g++"
          ln -sf "$(which ccache)" "$CCACHE_BIN/gcc"
          ln -sf "$(which ccache)" "$CCACHE_BIN/g++"
          echo "$CCACHE_BIN" >> "$GITHUB_PATH"

          ccache -M 5G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o "cache_dir=${{ env.CCACHE_DIR }}" \
            -o "base_dir=${{ github.workspace }}" \
            -o "temporary_dir=/dev/shm/ccache-temp" \
            -o file_clone=false \
            -o hard_link=false \
            -z

      - name: Cache ARM Toolchain
        id: arm-toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu

      - name: Install ARM Toolchain
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ "${{ steps.arm-toolchain-cache.outputs.cache-hit }}" != "true" ] || [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "⚡ Cache miss: Downloading ARM GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }} with aria2c..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE}" -o arm-toolchain.tar.xz
            tar -xf arm-toolchain.tar.xz
            rm -f arm-toolchain.tar.xz
          else
            echo "✅ ARM Toolchain restored from Action Cache!"
          fi
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone Source
        run: |
          git clone --depth=1 --single-branch --no-tags https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu
          fi

      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" || echo "unknown")
          RAW_TOOLCHAIN_STR=$(${TOOLCHAIN_PATH}gcc --version 2>&1 | head -n1)
          TOOLCHAIN_DISPLAY=$(echo "$RAW_TOOLCHAIN_STR" | sed -n 's/^[^(]*(\([^)]*\)).*/\1/p')
          if [ -z "$TOOLCHAIN_DISPLAY" ]; then
            TOOLCHAIN_DISPLAY="$RAW_TOOLCHAIN_STR"
          fi

          V_MAJOR=$(grep -E '^VERSION =' sultan/Makefile | awk '{print $3}')
          V_PATCH=$(grep -E '^PATCHLEVEL =' sultan/Makefile | awk '{print $3}')
          KERNEL_VER="${V_MAJOR}.${V_PATCH}"
          if [ -z "$KERNEL_VER" ] || [ "$KERNEL_VER" = "." ]; then
            KERNEL_VER="6.1"
          fi

          SUSFS_VER="unknown"
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -E '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F '"' '{print $2}')
          fi

          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "toolchain_display=$TOOLCHAIN_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "🏷️ Sultan Tag: $S_TAG"
          echo "🐧 Kernel Base: Linux $KERNEL_VER"
          echo "🔧 KSU Branch: $KSU_BRANCH (+$K_VER)"
          echo "🪝 Hook Mode: manual"
          echo "🛡️ SUSFS: ${{ matrix.enable_susfs }} ($SUSFS_VER)"
          echo "⚙️ Toolchain: $TOOLCHAIN_DISPLAY"
          echo "⚡ Ccache: ${{ github.event.inputs.use_ccache != 'false' && 'Enabled' || 'Disabled' }}"
          echo "======================================"

      - name: KSU Base & Sultan Patches
        working-directory: sultan
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          curl -LSs "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/$KSU_BRANCH/kernel/setup.sh" | bash -s -- "$KSU_BRANCH"
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch
          patch -p1 < ../kernel_patches/sultan/0001-modify-noinline.patch

      - name: Apply Manual Hook Patches
        working-directory: sultan
        run: |
          echo "Applying manual security hooks patches..."
          patch -p1 -l < "${{ github.workspace }}/.github/patches/manual-security-hooks-v2.0.patch"
          patch -p1 -l < "${{ github.workspace }}/.github/patches/scope-min-manual-hooks-v2.3.patch"

      - name: Apply SuSFS Patches
        if: matrix.enable_susfs == 'true'
        working-directory: sultan
        run: |
          echo "Applying SuSFS patches (Sultan Android 14 6.1)..."
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/51_deinlined_susfs_hooks_sultan-android14-6.1.patch" || true

          echo "Applying SuSFS patch to KernelSU..."
          cd KernelSU
          patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/11_enable_susfs_for_ksu.patch"

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          hook_mode: "manual"
          enable_susfs: "${{ matrix.enable_susfs }}"

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            CC="ccache ${{ env.TOOLCHAIN_PATH }}gcc"
          else
            CC="${{ env.TOOLCHAIN_PATH }}gcc"
          fi
          echo "Compiling kernel with CC: $CC"
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Ccache Performance Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats (manual, SUSFS=${{ matrix.enable_susfs }}) ==="
          ccache -s

      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb

          DATE=$(date +'%y%m%d')
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KERNEL_VER="${{ steps.meta.outputs.kernel_ver }}"
          SUSFS_VER="${{ steps.meta.outputs.susfs_ver }}"

          if [ "$KSU_BRANCH" = "staging" ]; then
            BRANCH_TAG="-staging"
          else
            BRANCH_TAG=""
          fi
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            SUSFS_TAG="-SUSFS_${SUSFS_VER}"
          else
            SUSFS_TAG=""
          fi

          BASE_NAME="KSU_Sultan_gs201_${KERNEL_VER}+${K_VER}${BRANCH_TAG}-manual${SUSFS_TAG}-${DATE}"
          ZIP_NAME="${BASE_NAME}.zip"

          echo "Packaging AnyKernel3: $ZIP_NAME"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )

          mkdir -p ./output_artifacts
          mv "$ZIP_NAME" ./output_artifacts/

          TOOLCHAIN_DISPLAY="${{ steps.meta.outputs.toolchain_display }}"
          S_TAG="${{ steps.meta.outputs.s_tag }}"
          echo "KERNEL_VER='${KERNEL_VER}'" > ./output_artifacts/build_metadata.env
          echo "KSU_VER='${K_VER}'" >> ./output_artifacts/build_metadata.env
          echo "S_TAG='${S_TAG}'" >> ./output_artifacts/build_metadata.env
          echo "TOOLCHAIN_DISPLAY='${TOOLCHAIN_DISPLAY}'" >> ./output_artifacts/build_metadata.env

          if [ "$KSU_BRANCH" = "staging" ]; then
            echo "Packaging debug symbols for staging build..."
            VMLINUX_ZIP_NAME="vmlinux-${BASE_NAME}.zip"
            SYSMAP_ZIP_NAME="System.map-${BASE_NAME}.zip"

            if [ -f "sultan/out/vmlinux" ]; then
              cp sultan/out/vmlinux ./vmlinux
            elif [ -f "sultan/out/arch/arm64/boot/vmlinux" ]; then
              cp sultan/out/arch/arm64/boot/vmlinux ./vmlinux
            else
              find sultan/out -name "vmlinux" -type f -exec cp {} ./vmlinux \; || true
            fi
            if [ -f "./vmlinux" ]; then
              zip -9 "$VMLINUX_ZIP_NAME" vmlinux
              mv "$VMLINUX_ZIP_NAME" ./output_artifacts/
            fi

            if [ -f "sultan/out/System.map" ]; then
              cp sultan/out/System.map ./System.map
              zip -9 "$SYSMAP_ZIP_NAME" System.map
              mv "$SYSMAP_ZIP_NAME" ./output_artifacts/
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-manual-${{ matrix.enable_susfs }}
          path: ./output_artifacts/*

  build_lsm:
    name: LSM Hook (SUSFS=${{ matrix.enable_susfs }})
    if: github.event.inputs.hook_mode == 'all' || github.event.inputs.hook_mode == 'lsm' || github.event_name != 'workflow_dispatch'
    needs: matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable_susfs: ${{ fromJson(needs.matrix_prep.outputs.susfs_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Fast Git Protocol
        run: |
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/2
          git config --global core.compression 0

      - name: Free Disk Space & Install Fast Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true &
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bison flex bc aria2 ccache zip zstd

      - name: Cache Ccache Data
        if: github.event.inputs.use_ccache != 'false'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gs201-lsm-${{ matrix.enable_susfs }}-${{ github.event.inputs.ksu_branch || 'master' }}-${{ github.sha }}
          restore-keys: |
            ccache-gs201-lsm-${{ matrix.enable_susfs }}-${{ github.event.inputs.ksu_branch || 'master' }}-
            ccache-gs201-lsm-${{ matrix.enable_susfs }}-
            ccache-gs201-${{ matrix.enable_susfs }}-
            ccache-gs201-

      - name: Setup Ccache Configurations & Wrappers
        if: github.event.inputs.use_ccache != 'false'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p /dev/shm/ccache-temp

          CCACHE_BIN="${{ github.workspace }}/.ccache-bin"
          mkdir -p "$CCACHE_BIN"
          ln -sf "$(which ccache)" "$CCACHE_BIN/aarch64-none-linux-gnu-gcc"
          ln -sf "$(which ccache)" "$CCACHE_BIN/aarch64-none-linux-gnu-g++"
          ln -sf "$(which ccache)" "$CCACHE_BIN/gcc"
          ln -sf "$(which ccache)" "$CCACHE_BIN/g++"
          echo "$CCACHE_BIN" >> "$GITHUB_PATH"

          ccache -M 5G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o "cache_dir=${{ env.CCACHE_DIR }}" \
            -o "base_dir=${{ github.workspace }}" \
            -o "temporary_dir=/dev/shm/ccache-temp" \
            -o file_clone=false \
            -o hard_link=false \
            -z

      - name: Cache ARM Toolchain
        id: arm-toolchain-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu

      - name: Install ARM Toolchain
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ "${{ steps.arm-toolchain-cache.outputs.cache-hit }}" != "true" ] || [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "⚡ Cache miss: Downloading ARM GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }} with aria2c..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE}" -o arm-toolchain.tar.xz
            tar -xf arm-toolchain.tar.xz
            rm -f arm-toolchain.tar.xz
          else
            echo "✅ ARM Toolchain restored from Action Cache!"
          fi
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Clone Source
        run: |
          git clone --depth=1 --single-branch --no-tags https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu
          fi

      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" || echo "unknown")
          RAW_TOOLCHAIN_STR=$(${TOOLCHAIN_PATH}gcc --version 2>&1 | head -n1)
          TOOLCHAIN_DISPLAY=$(echo "$RAW_TOOLCHAIN_STR" | sed -n 's/^[^(]*(\([^)]*\)).*/\1/p')
          if [ -z "$TOOLCHAIN_DISPLAY" ]; then
            TOOLCHAIN_DISPLAY="$RAW_TOOLCHAIN_STR"
          fi

          V_MAJOR=$(grep -E '^VERSION =' sultan/Makefile | awk '{print $3}')
          V_PATCH=$(grep -E '^PATCHLEVEL =' sultan/Makefile | awk '{print $3}')
          KERNEL_VER="${V_MAJOR}.${V_PATCH}"
          if [ -z "$KERNEL_VER" ] || [ "$KERNEL_VER" = "." ]; then
            KERNEL_VER="6.1"
          fi

          SUSFS_VER="unknown"
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -E '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F '"' '{print $2}')
          fi

          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "toolchain_display=$TOOLCHAIN_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "🏷️ Sultan Tag: $S_TAG"
          echo "🐧 Kernel Base: Linux $KERNEL_VER"
          echo "🔧 KSU Branch: $KSU_BRANCH (+$K_VER)"
          echo "🪝 Hook Mode: lsm (Hookless/BL)"
          echo "🛡️ SUSFS: ${{ matrix.enable_susfs }} ($SUSFS_VER)"
          echo "⚙️ Toolchain: $TOOLCHAIN_DISPLAY"
          echo "⚡ Ccache: ${{ github.event.inputs.use_ccache != 'false' && 'Enabled' || 'Disabled' }}"
          echo "======================================"

      - name: KSU Base & Sultan Patches
        working-directory: sultan
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          curl -LSs "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/$KSU_BRANCH/kernel/setup.sh" | bash -s -- "$KSU_BRANCH"
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch
          patch -p1 < ../kernel_patches/sultan/0001-modify-noinline.patch

      - name: Apply SuSFS Patches
        if: matrix.enable_susfs == 'true'
        working-directory: sultan
        run: |
          echo "Applying SuSFS patches (Sultan Android 14 6.1)..."
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/51_deinlined_susfs_hooks_sultan-android14-6.1.patch" || true

          echo "Applying SuSFS patch to KernelSU..."
          cd KernelSU
          patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/11_enable_susfs_for_ksu.patch"

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          hook_mode: "lsm"
          enable_susfs: "${{ matrix.enable_susfs }}"

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            CC="ccache ${{ env.TOOLCHAIN_PATH }}gcc"
          else
            CC="${{ env.TOOLCHAIN_PATH }}gcc"
          fi
          echo "Compiling kernel with CC: $CC"
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Ccache Performance Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats (lsm, SUSFS=${{ matrix.enable_susfs }}) ==="
          ccache -s

      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb

          DATE=$(date +'%y%m%d')
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KERNEL_VER="${{ steps.meta.outputs.kernel_ver }}"
          SUSFS_VER="${{ steps.meta.outputs.susfs_ver }}"

          if [ "$KSU_BRANCH" = "staging" ]; then
            BRANCH_TAG="-staging"
          else
            BRANCH_TAG=""
          fi
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            SUSFS_TAG="-SUSFS_${SUSFS_VER}"
          else
            SUSFS_TAG=""
          fi

          BASE_NAME="KSU_Sultan_gs201_${KERNEL_VER}+${K_VER}${BRANCH_TAG}-lsm${SUSFS_TAG}-${DATE}"
          ZIP_NAME="${BASE_NAME}.zip"

          echo "Packaging AnyKernel3: $ZIP_NAME"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )

          mkdir -p ./output_artifacts
          mv "$ZIP_NAME" ./output_artifacts/

          TOOLCHAIN_DISPLAY="${{ steps.meta.outputs.toolchain_display }}"
          S_TAG="${{ steps.meta.outputs.s_tag }}"
          echo "KERNEL_VER='${KERNEL_VER}'" > ./output_artifacts/build_metadata.env
          echo "KSU_VER='${K_VER}'" >> ./output_artifacts/build_metadata.env
          echo "S_TAG='${S_TAG}'" >> ./output_artifacts/build_metadata.env
          echo "TOOLCHAIN_DISPLAY='${TOOLCHAIN_DISPLAY}'" >> ./output_artifacts/build_metadata.env

          if [ "$KSU_BRANCH" = "staging" ]; then
            echo "Packaging debug symbols for staging build..."
            VMLINUX_ZIP_NAME="vmlinux-${BASE_NAME}.zip"
            SYSMAP_ZIP_NAME="System.map-${BASE_NAME}.zip"

            if [ -f "sultan/out/vmlinux" ]; then
              cp sultan/out/vmlinux ./vmlinux
            elif [ -f "sultan/out/arch/arm64/boot/vmlinux" ]; then
              cp sultan/out/arch/arm64/boot/vmlinux ./vmlinux
            else
              find sultan/out -name "vmlinux" -type f -exec cp {} ./vmlinux \; || true
            fi
            if [ -f "./vmlinux" ]; then
              zip -9 "$VMLINUX_ZIP_NAME" vmlinux
              mv "$VMLINUX_ZIP_NAME" ./output_artifacts/
            fi

            if [ -f "sultan/out/System.map" ]; then
              cp sultan/out/System.map ./System.map
              zip -9 "$SYSMAP_ZIP_NAME" System.map
              mv "$SYSMAP_ZIP_NAME" ./output_artifacts/
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-lsm-${{ matrix.enable_susfs }}
          path: ./output_artifacts/*

  release:
    name: Publish Release
    if: always() && github.event.inputs.create_release != 'false' && (needs.build_manual.result == 'success' || needs.build_lsm.result == 'success')
    needs: [matrix_prep, build_manual, build_lsm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          path: ./all_artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "=== Collected Release Artifacts ==="
          ls -lh ./all_artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_BRANCH: ${{ github.event.inputs.ksu_branch || 'master' }}
        run: |
          DATE=$(date +"%y%m%d")
          if ! gh release view "$DATE" >/dev/null 2>&1; then
            TAG="$DATE"
          else
            MAX_REV=$(gh release list --limit 50 | awk '{print $1}' | grep -E "^${DATE}-r[0-9]+" | sed "s/${DATE}-r//" | sort -n | tail -n1)
            REV=$(( ${MAX_REV:-0} + 1 ))
            TAG="${DATE}-r${REV}"
          fi

          ZIP_FILES=$(find ./all_artifacts -name "*.zip" -type f)
          if [ -z "$ZIP_FILES" ]; then
            echo "Error: No zip files found for release!"
            exit 1
          fi

          if [ -f "./all_artifacts/build_metadata.env" ]; then
            eval "$(grep -E '^(KERNEL_VER|KSU_VER|S_TAG|TOOLCHAIN_DISPLAY)=' ./all_artifacts/build_metadata.env 2>/dev/null || true)"
          fi
          TOOLCHAIN_DISPLAY="${TOOLCHAIN_DISPLAY:-ARM GNU Toolchain}"
          KERNEL_VER="${KERNEL_VER:-6.1}"
          KSU_VER="${KSU_VER:-unknown}"

          PRERELEASE_FLAG=""
          TITLE_PREFIX="Release"
          DEBUG_NOTE=""
          if [ "$KSU_BRANCH" = "staging" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE_PREFIX="Pre-release (staging)"
            DEBUG_NOTE="> 🛠️ **Debug Symbols**: Includes \`vmlinux\` and \`System.map\` debug symbol archives for kernel debugging."
          fi

          gh release create "$TAG" $ZIP_FILES \
            --target "${{ github.sha }}" \
            $PRERELEASE_FLAG \
            --title "Pixel 7 / Pro (gs201) Sultan Kernel — $TITLE_PREFIX $TAG (KSU +$KSU_VER)" \
            --notes "
          ## 📱 Sultan gs201 Kernel — $TITLE_PREFIX $TAG

          ### 🚀 Build Information
          | Component | Details |
          | :--- | :--- |
          | **Target Device** | Google Pixel 7 / 7 Pro (\`gs201\` — Cheetah / Panther) |
          | **Kernel Base** | Sultan Kernel (Linux $KERNEL_VER) |
          | **KernelSU Branch** | \`$KSU_BRANCH\` (+$KSU_VER) |
          | **Compiler** | $TOOLCHAIN_DISPLAY |
          | **Build Date** | $DATE |

          ### 📦 Variant Breakdown
          | Package | Security Hook Mode | SuSFS Status | Stealth Level |
          | :--- | :--- | :--- | :--- |
          | \`*-manual-SUSFS-*.zip\` | Manual Security Hooks (Inline) | ✅ Enabled | 🛡️ **Maximum Stealth** (Recommended) |
          | \`*-manual-*.zip\` | Manual Security Hooks (Inline) | ❌ Clean KSU | Standard Root |
          | \`*-lsm-SUSFS-*.zip\` | LSM Security Hooks (BL Hookless) | ✅ Enabled | Hookless Stealth |
          | \`*-lsm-*.zip\` | LSM Security Hooks (BL Hookless) | ❌ Clean KSU | Standard Hookless Root |

          $DEBUG_NOTE

          ### ⚡ Networking & Performance Tweaks
          - **TCP Congestion Control:** BBR v1 + FQ default
          - **Advanced Policy Routing:** Table 1066 support & 64k IPSet for seamless split-tunneling
          - **Fixes & Compatibility:** ADDRTYPE match, Google VPN (XFRM), TTL 64 share
          "
