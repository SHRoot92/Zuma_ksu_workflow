name: Build Sultan KSU 

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Branch'
        required: true
        type: choice
        options:
          - 'master'
          - 'staging'
        default: 'master'
      hook_mode:
        description: 'Hook Mode to Build'
        required: true
        type: choice
        options:
          - 'manual'
          - 'lsm'
          - 'all'
        default: 'manual'
      enable_susfs:
        description: 'SuSFS Integration'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
          - 'all'
        default: 'true'
      use_ccache:
        description: 'Enable Ccache Acceleration'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      upload_debug_symbols:
        description: 'Upload Debug Symbols (vmlinux & System.map)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.ksu_branch }}
  cancel-in-progress: false

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_REPO_BRANCH: sultan-shiba-susfs-minimal
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_COMPILERCHECK: "content"
  CCACHE_NOHASHDIR: "true"
  CCACHE_TEMPDIR: "/dev/shm/ccache-temp"

jobs:
  matrix_prep:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      susfs_matrix: ${{ steps.set-matrix.outputs.susfs_matrix }}
    steps:
      - id: set-matrix
        run: |
          SUSFS_INPUT="${{ github.event.inputs.enable_susfs || 'true' }}"
          if [ "$SUSFS_INPUT" = "all" ]; then
            echo "susfs_matrix=[\"true\", \"false\"]" >> "$GITHUB_OUTPUT"
          else
            echo "susfs_matrix=[\"$SUSFS_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build_manual:
    name: Manual Hook (SUSFS=${{ matrix.enable_susfs }})
    if: github.event.inputs.hook_mode == 'all' || github.event.inputs.hook_mode == 'manual' || github.event.inputs.hook_mode == '' || github.event_name != 'workflow_dispatch'
    needs: matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable_susfs: ${{ fromJson(needs.matrix_prep.outputs.susfs_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Fast Git Protocol
        run: |
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/2
          git config --global core.compression 0

      - name: Set up build environment and ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev)
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            mkdir -p ${{ github.workspace }}/.ccache
            mkdir -p /dev/shm/ccache-temp
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" >> $GITHUB_ENV
            echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSTYPE=zstd" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSLEVEL=1" >> $GITHUB_ENV
            echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
            echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
            echo "CCACHE_TEMPDIR=/dev/shm/ccache-temp" >> $GITHUB_ENV
          else
            echo "USE_CCACHE=0" >> $GITHUB_ENV
          fi

      - name: Restore Cache
        id: cache-restore
        uses: ./.github/actions/restore-cache-retry
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-manual-${{ matrix.enable_susfs }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-manual-${{ matrix.enable_susfs }}-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-manual-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-manual-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-

      - name: Setup Ccache Configurations
        if: github.event.inputs.use_ccache != 'false'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p /dev/shm/ccache-temp
          ccache -M 10G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o temporary_dir=/dev/shm/ccache-temp \
            -o base_dir="${{ github.workspace }}"
          ccache -z

      - name: Install ARM Toolchain
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "⚡ Cache miss: Downloading ARM GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }} with aria2c..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE}" -o arm-toolchain.tar.xz || { echo "❌ Failed to download toolchain"; exit 1; }
            tar -xf arm-toolchain.tar.xz || { echo "❌ Failed to extract toolchain"; exit 1; }
            rm -f arm-toolchain.tar.xz
          else
            echo "✅ ARM Toolchain restored from Action Cache!"
          fi
          
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "❌ ERROR: Toolchain directory not found after installation: $TOOLCHAIN_DIR"
            exit 1
          fi
          
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "GCC_VER=$($TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-gcc --version | head -n1 | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Verify KSU Branch Exists
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          echo "🔍 Verifying KSU branch '$KSU_BRANCH' exists in ${{ env.KSU_REPO }}..."
          if ! git ls-remote --heads https://github.com/${{ env.KSU_REPO }}.git "$KSU_BRANCH" | grep -q "$KSU_BRANCH"; then
            echo "❌ ERROR: Branch '$KSU_BRANCH' does not exist in ${{ env.KSU_REPO }}"
            echo "   Available branches:"
            git ls-remote --heads https://github.com/${{ env.KSU_REPO }}.git | sed 's/^/   /'
            exit 1
          fi
          echo "✅ KSU branch '$KSU_BRANCH' verified"

      - name: Clone Source
        run: |
          echo "🔄 Cloning source repositories..."
          git clone --depth=1 --single-branch --no-tags https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan &
          PID_SULTAN=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3 &
          PID_AK3=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches &
          PID_PATCHES=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh &
          PID_SCRIPTS=$!
          
          # Wait for all background jobs and verify
          wait $PID_SULTAN || { echo "❌ Failed to clone sultan"; exit 1; }
          wait $PID_AK3 || { echo "❌ Failed to clone AK3"; exit 1; }
          wait $PID_PATCHES || { echo "❌ Failed to clone kernel_patches"; exit 1; }
          wait $PID_SCRIPTS || { echo "❌ Failed to clone sh"; exit 1; }
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu || { echo "❌ Failed to clone susfs4ksu"; exit 1; }
          fi
          
          # Verify all required directories exist
          for dir in sultan AK3 kernel_patches sh; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Required directory '$dir' not found after clone"
              exit 1
            fi
          done
          
          if [ "${{ matrix.enable_susfs }}" = "true" ] && [ ! -d "susfs4ksu" ]; then
            echo "❌ ERROR: Required directory 'susfs4ksu' not found after clone"
            exit 1
          fi
          
          echo "✅ All repositories cloned successfully"

      - name: Metadata
        id: meta
        run: |
          set -e
          
          echo "📊 Gathering build metadata..."
          
          # Get Sultan tag
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1)
          if [ -z "$S_TAG" ]; then
            echo "⚠️  Warning: No git tags found in sultan repo, using 'latest'"
            S_TAG="latest"
          fi
          
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          # Get KSU version with proper error handling
          echo "🔍 Fetching KernelSU version from branch: $KSU_BRANCH..."
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" 2>&1) || {
            echo "⚠️  Warning: Failed to retrieve KernelSU version from $KSU_BRANCH"
            echo "   Using fallback value 'unknown'"
            K_VER="unknown"
          }
          
          # Sanitize version strings (remove extra whitespace)
          K_VER="${K_VER// /}"
          S_TAG="${S_TAG// /}"
          
          # Get toolchain info
          RAW_TOOLCHAIN_STR=$(${TOOLCHAIN_PATH}gcc --version 2>&1 | head -n1)
          TOOLCHAIN_DISPLAY=$(echo "$RAW_TOOLCHAIN_STR" | sed -n 's/^[^(]*(\([^)]*\)).*/\1/p')
          if [ -z "$TOOLCHAIN_DISPLAY" ]; then
            TOOLCHAIN_DISPLAY="$RAW_TOOLCHAIN_STR"
          fi
          
          # Get kernel version dynamically from kernel
          KERNEL_VER=$(make -C sultan -s kernelversion 2>/dev/null || true)
          if [ -z "$KERNEL_VER" ]; then
            V_MAJOR=$(grep -E '^VERSION =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_PATCH=$(grep -E '^PATCHLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_SUB=$(grep -E '^SUBLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            if [ -n "$V_SUB" ]; then
              KERNEL_VER="${V_MAJOR}.${V_PATCH}.${V_SUB}"
            else
              KERNEL_VER="${V_MAJOR}.${V_PATCH}"
            fi
          fi
          
          # Get SuSFS version & commit
          SUSFS_VER="unknown"
          SUSFS_COMMIT=""
          if [ -d "susfs4ksu" ]; then
            SUSFS_COMMIT=$(git -C susfs4ksu rev-parse --short HEAD 2>/dev/null || true)
          fi
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -E '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F '"' '{print $2}' || echo "unknown")
          fi
          
          # Output metadata safely to GitHub Actions
          {
            echo "ksu_ver=$K_VER"
            echo "s_tag=$S_TAG"
            echo "toolchain_display=$TOOLCHAIN_DISPLAY"
            echo "kernel_ver=$KERNEL_VER"
            echo "susfs_ver=$SUSFS_VER"
            echo "susfs_commit=$SUSFS_COMMIT"
          } >> "$GITHUB_OUTPUT"
          
          echo "======================================"
          echo "🏷️ Sultan Tag: $S_TAG"
          echo "🐧 Kernel Base: Linux $KERNEL_VER"
          echo "🔧 KSU Branch: $KSU_BRANCH (+$K_VER)"
          echo "🪝 Hook Mode: manual"
          echo "🛡️ SUSFS: ${{ matrix.enable_susfs }} ($SUSFS_VER)"
          echo "⚙️ Toolchain: $TOOLCHAIN_DISPLAY"
          echo "⚡ Ccache: ${{ github.event.inputs.use_ccache != 'false' && 'Enabled' || 'Disabled' }}"
          echo "======================================"

      - name: KSU Base & Sultan Patches
        working-directory: sultan
        run: |
          set -e
          
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          echo "📥 Downloading KSU setup script..."
          SETUP_SCRIPT="ksu_setup.sh"
          curl -LSs --max-time 30 "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/$KSU_BRANCH/kernel/setup.sh" -o "$SETUP_SCRIPT" || {
            echo "❌ Failed to download KSU setup script"
            exit 1
          }
          
          chmod +x "$SETUP_SCRIPT"
          echo "✅ Running KSU setup..."
          ./"$SETUP_SCRIPT" "$KSU_BRANCH" || {
            echo "❌ KSU setup script failed"
            exit 1
          }
          rm -f "$SETUP_SCRIPT"
          
          KSU_COMMIT=$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo "")
          echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
          
          echo "📋 Applying Sultan kernel patches..."
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
            "../kernel_patches/sultan/0001-modify-noinline.patch"
          )
          
          for patch in "${PATCHES[@]}"; do
            if [ ! -f "$patch" ]; then
              echo "❌ ERROR: Required patch not found: $patch"
              exit 1
            fi
            
            if ! patch -p1 < "$patch"; then
              echo "❌ ERROR: Failed to apply patch: $patch"
              exit 1
            fi
            echo "✅ Applied: $(basename $patch)"
          done

      - name: Apply Manual Hook Patches
        working-directory: sultan
        run: |
          set -e
          
          echo "📋 Applying manual security hooks patches..."
          MANUAL_PATCHES=(
            "${{ github.workspace }}/.github/patches/manual-security-hooks-v2.0.patch"
            "${{ github.workspace }}/.github/patches/scope-min-manual-hooks-v2.3.patch"
          )
          
          for patch in "${MANUAL_PATCHES[@]}"; do
            if [ ! -f "$patch" ]; then
              echo "❌ ERROR: Required patch not found: $patch"
              exit 1
            fi
            
            if ! patch -p1 -l < "$patch"; then
              echo "❌ ERROR: Failed to apply patch: $patch"
              exit 1
            fi
            echo "✅ Applied: $(basename $patch)"
          done

      - name: Apply SuSFS Patches
        if: matrix.enable_susfs == 'true'
        working-directory: sultan
        run: |
          set -e
          
          echo "📋 Applying SuSFS patches (Sultan Android 14 6.1)..."
          
          # Verify SuSFS source files exist
          SUSFS_FILES=(
            "../susfs4ksu/kernel_patches/fs/susfs.c"
            "../susfs4ksu/kernel_patches/include/linux/susfs.h"
            "../susfs4ksu/kernel_patches/include/linux/susfs_def.h"
          )
          
          for file in "${SUSFS_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required SuSFS file not found: $file"
              exit 1
            fi
          done
          
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          echo "✅ SuSFS files copied"
          
          # Apply SuSFS kernel patch (with tolerance for fuzz)
          if ! patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/51_deinlined_susfs_hooks_sultan-android14-6.1.patch" 2>&1; then
            echo "⚠️  SuSFS kernel patch failed (non-critical, continuing...)"
          fi
          
          echo "🔧 Applying SuSFS patch to KernelSU..."
          cd KernelSU
          if ! patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/11_enable_susfs_for_ksu.patch"; then
            echo "❌ ERROR: Failed to apply KernelSU SuSFS patch"
            exit 1
          fi
          cd ..
          echo "✅ SuSFS patches applied successfully"

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "⚙️ Generating defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig || { echo "❌ Failed to generate defconfig"; exit 1; }

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          hook_mode: "manual"
          enable_susfs: "${{ matrix.enable_susfs }}"

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "🔧 Finalizing defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -e
          
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            CC="ccache ${{ env.TOOLCHAIN_PATH }}gcc"
          else
            CC="${{ env.TOOLCHAIN_PATH }}gcc"
          fi
          
          echo "🔨 Compiling kernel with CC: $CC"
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)" || { echo "❌ Kernel build failed"; exit 1; }
          
          # Validate critical build artifacts exist
          if [ ! -f "out/arch/arm64/boot/Image.lz4" ]; then
            echo "❌ ERROR: Build failed - Image.lz4 not found"
            echo "   Build output directory contents:"
            ls -la out/arch/arm64/boot/ 2>/dev/null || ls -la out/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Kernel build successful - Image.lz4 ready"
          ls -lh out/arch/arm64/boot/Image.lz4

      - name: Ccache Performance Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats (manual, SUSFS=${{ matrix.enable_susfs }}) ==="
          ccache -s

      - name: Package
        run: |
          set -e
          
          echo "📦 Packaging kernel and artifacts..."
          
          # Validate required metadata from previous step
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KERNEL_VER="${{ steps.meta.outputs.kernel_ver }}"
          S_TAG="${{ steps.meta.outputs.s_tag }}"
          SUSFS_VER="${{ steps.meta.outputs.susfs_ver }}"
          TOOLCHAIN_DISPLAY="${{ steps.meta.outputs.toolchain_display }}"
          
          if [ -z "$K_VER" ] || [ -z "$KERNEL_VER" ] || [ -z "$S_TAG" ]; then
            echo "❌ ERROR: Required metadata missing from Metadata step"
            echo "   ksu_ver: '$K_VER'"
            echo "   kernel_ver: '$KERNEL_VER'"
            echo "   s_tag: '$S_TAG'"
            exit 1
          fi
          
          # Copy kernel and DTB
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4 || { echo "❌ Failed to copy Image.lz4"; exit 1; }
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb || { echo "❌ Failed to copy DTB"; exit 1; }
          
          DATE=$(date +'%y%m%d')
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          if [ "$KSU_BRANCH" = "staging" ]; then
            BRANCH_TAG="-staging"
          else
            BRANCH_TAG=""
          fi
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            SUSFS_TAG="-SUSFS_${SUSFS_VER}"
          else
            SUSFS_TAG=""
          fi
          
          BASE_NAME="KSU_Sultan_gs201_${KERNEL_VER}+${K_VER}${BRANCH_TAG}-manual${SUSFS_TAG}-${DATE}"
          ZIP_NAME="${BASE_NAME}.zip"
          
          echo "📦 Packaging AnyKernel3: $ZIP_NAME"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" ) || { echo "❌ Failed to create zip"; exit 1; }
          
          mkdir -p ./output_artifacts
          mv "$ZIP_NAME" ./output_artifacts/
          
          # Create build metadata
          {
            echo "KERNEL_VER='${KERNEL_VER}'"
            echo "KSU_VER='${K_VER}'"
            echo "KSU_COMMIT='${KSU_COMMIT}'"
            echo "S_TAG='${S_TAG}'"
            echo "TOOLCHAIN_DISPLAY='${TOOLCHAIN_DISPLAY}'"
            if [ "${{ matrix.enable_susfs }}" = "true" ] && [ -n "$SUSFS_VER" ] && [ "$SUSFS_VER" != "unknown" ]; then
              echo "SUSFS_VER='${SUSFS_VER}'"
              echo "SUSFS_COMMIT='${{ steps.meta.outputs.susfs_commit }}'"
            fi
          } > ./output_artifacts/build_metadata.env
          
          echo "✅ Kernel package created successfully"
          
          # Package debug symbols if requested
          if [ "${{ github.event.inputs.upload_debug_symbols }}" = "true" ]; then
            echo "📦 Packaging debug symbols..."
            VMLINUX_ZIP_NAME="vmlinux-${BASE_NAME}.zip"
            SYSMAP_ZIP_NAME="System.map-${BASE_NAME}.zip"
            
            if [ -f "sultan/out/vmlinux" ]; then
              cp sultan/out/vmlinux ./vmlinux
            elif [ -f "sultan/out/arch/arm64/boot/vmlinux" ]; then
              cp sultan/out/arch/arm64/boot/vmlinux ./vmlinux
            else
              find sultan/out -name "vmlinux" -type f -exec cp {} ./vmlinux \; 2>/dev/null || true
            fi
            
            if [ -f "./vmlinux" ]; then
              zip -9 "$VMLINUX_ZIP_NAME" vmlinux || { echo "⚠️  Failed to create vmlinux zip"; }
              mv "$VMLINUX_ZIP_NAME" ./output_artifacts/ || true
              echo "✅ Debug symbols (vmlinux) packaged"
            else
              echo "⚠️  vmlinux not found"
            fi
            
            if [ -f "sultan/out/System.map" ]; then
              cp sultan/out/System.map ./System.map
              zip -9 "$SYSMAP_ZIP_NAME" System.map || { echo "⚠️  Failed to create System.map zip"; }
              mv "$SYSMAP_ZIP_NAME" ./output_artifacts/ || true
              echo "✅ Debug symbols (System.map) packaged"
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-manual-${{ matrix.enable_susfs }}
          path: ./output_artifacts/*

      - name: Save Cache
        if: always() && github.event.inputs.use_ccache != 'false'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-manual-${{ matrix.enable_susfs }}-${{ github.run_id }}

  build_lsm:
    name: LSM Hook (SUSFS=${{ matrix.enable_susfs }})
    if: github.event.inputs.hook_mode == 'all' || github.event.inputs.hook_mode == 'lsm' || github.event_name != 'workflow_dispatch'
    needs: matrix_prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enable_susfs: ${{ fromJson(needs.matrix_prep.outputs.susfs_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Fast Git Protocol
        run: |
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/2
          git config --global core.compression 0

      - name: Set up build environment and ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache aria2 libdw-dev)
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            mkdir -p ${{ github.workspace }}/.ccache
            mkdir -p /dev/shm/ccache-temp
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" >> $GITHUB_ENV
            echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSTYPE=zstd" >> $GITHUB_ENV
            echo "CCACHE_COMPRESSLEVEL=1" >> $GITHUB_ENV
            echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
            echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
            echo "CCACHE_TEMPDIR=/dev/shm/ccache-temp" >> $GITHUB_ENV
          else
            echo "USE_CCACHE=0" >> $GITHUB_ENV
          fi

      - name: Restore Cache
        id: cache-restore
        uses: ./.github/actions/restore-cache-retry
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-lsm-${{ matrix.enable_susfs }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-lsm-${{ matrix.enable_susfs }}-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-lsm-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-lsm-
            toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-

      - name: Setup Ccache Configurations
        if: github.event.inputs.use_ccache != 'false'
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p /dev/shm/ccache-temp
          ccache -M 10G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o temporary_dir=/dev/shm/ccache-temp \
            -o base_dir="${{ github.workspace }}"
          ccache -z

      - name: Install ARM Toolchain
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "⚡ Cache miss: Downloading ARM GNU Toolchain ${{ env.ARM_TOOLCHAIN_VERSION }} with aria2c..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE}" -o arm-toolchain.tar.xz || { echo "❌ Failed to download toolchain"; exit 1; }
            tar -xf arm-toolchain.tar.xz || { echo "❌ Failed to extract toolchain"; exit 1; }
            rm -f arm-toolchain.tar.xz
          else
            echo "✅ ARM Toolchain restored from Action Cache!"
          fi
          
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "❌ ERROR: Toolchain directory not found after installation: $TOOLCHAIN_DIR"
            exit 1
          fi
          
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "GCC_VER=$($TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-gcc --version | head -n1 | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Verify KSU Branch Exists
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          echo "🔍 Verifying KSU branch '$KSU_BRANCH' exists in ${{ env.KSU_REPO }}..."
          if ! git ls-remote --heads https://github.com/${{ env.KSU_REPO }}.git "$KSU_BRANCH" | grep -q "$KSU_BRANCH"; then
            echo "❌ ERROR: Branch '$KSU_BRANCH' does not exist in ${{ env.KSU_REPO }}"
            echo "   Available branches:"
            git ls-remote --heads https://github.com/${{ env.KSU_REPO }}.git | sed 's/^/   /'
            exit 1
          fi
          echo "✅ KSU branch '$KSU_BRANCH' verified"

      - name: Clone Source
        run: |
          echo "🔄 Cloning source repositories..."
          git clone --depth=1 --single-branch --no-tags https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan &
          PID_SULTAN=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3 &
          PID_AK3=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches &
          PID_PATCHES=$!
          
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh &
          PID_SCRIPTS=$!
          
          # Wait for all background jobs and verify
          wait $PID_SULTAN || { echo "❌ Failed to clone sultan"; exit 1; }
          wait $PID_AK3 || { echo "❌ Failed to clone AK3"; exit 1; }
          wait $PID_PATCHES || { echo "❌ Failed to clone kernel_patches"; exit 1; }
          wait $PID_SCRIPTS || { echo "❌ Failed to clone sh"; exit 1; }
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu || { echo "❌ Failed to clone susfs4ksu"; exit 1; }
          fi
          
          # Verify all required directories exist
          for dir in sultan AK3 kernel_patches sh; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Required directory '$dir' not found after clone"
              exit 1
            fi
          done
          
          if [ "${{ matrix.enable_susfs }}" = "true" ] && [ ! -d "susfs4ksu" ]; then
            echo "❌ ERROR: Required directory 'susfs4ksu' not found after clone"
            exit 1
          fi
          
          echo "✅ All repositories cloned successfully"

      - name: Metadata
        id: meta
        run: |
          set -e
          
          echo "📊 Gathering build metadata..."
          
          # Get Sultan tag
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1)
          if [ -z "$S_TAG" ]; then
            echo "⚠️  Warning: No git tags found in sultan repo, using 'latest'"
            S_TAG="latest"
          fi
          
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          # Get KSU version with proper error handling
          echo "🔍 Fetching KernelSU version from branch: $KSU_BRANCH..."
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" 2>&1) || {
            echo "⚠️  Warning: Failed to retrieve KernelSU version from $KSU_BRANCH"
            echo "   Using fallback value 'unknown'"
            K_VER="unknown"
          }
          
          # Sanitize version strings (remove extra whitespace)
          K_VER="${K_VER// /}"
          S_TAG="${S_TAG// /}"
          
          # Get toolchain info
          RAW_TOOLCHAIN_STR=$(${TOOLCHAIN_PATH}gcc --version 2>&1 | head -n1)
          TOOLCHAIN_DISPLAY=$(echo "$RAW_TOOLCHAIN_STR" | sed -n 's/^[^(]*(\([^)]*\)).*/\1/p')
          if [ -z "$TOOLCHAIN_DISPLAY" ]; then
            TOOLCHAIN_DISPLAY="$RAW_TOOLCHAIN_STR"
          fi
          
          # Get kernel version dynamically from kernel
          KERNEL_VER=$(make -C sultan -s kernelversion 2>/dev/null || true)
          if [ -z "$KERNEL_VER" ]; then
            V_MAJOR=$(grep -E '^VERSION =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_PATCH=$(grep -E '^PATCHLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            V_SUB=$(grep -E '^SUBLEVEL =' sultan/Makefile | awk '{print $3}' | tr -d '\r')
            if [ -n "$V_SUB" ]; then
              KERNEL_VER="${V_MAJOR}.${V_PATCH}.${V_SUB}"
            else
              KERNEL_VER="${V_MAJOR}.${V_PATCH}"
            fi
          fi
          
          # Get SuSFS version & commit
          SUSFS_VER="unknown"
          SUSFS_COMMIT=""
          if [ -d "susfs4ksu" ]; then
            SUSFS_COMMIT=$(git -C susfs4ksu rev-parse --short HEAD 2>/dev/null || true)
          fi
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -E '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F '"' '{print $2}' || echo "unknown")
          fi
          
          # Output metadata safely to GitHub Actions
          {
            echo "ksu_ver=$K_VER"
            echo "s_tag=$S_TAG"
            echo "toolchain_display=$TOOLCHAIN_DISPLAY"
            echo "kernel_ver=$KERNEL_VER"
            echo "susfs_ver=$SUSFS_VER"
            echo "susfs_commit=$SUSFS_COMMIT"
          } >> "$GITHUB_OUTPUT"
          
          echo "======================================"
          echo "🏷️ Sultan Tag: $S_TAG"
          echo "🐧 Kernel Base: Linux $KERNEL_VER"
          echo "🔧 KSU Branch: $KSU_BRANCH (+$K_VER)"
          echo "🪝 Hook Mode: lsm (Hookless/BL)"
          echo "🛡️ SUSFS: ${{ matrix.enable_susfs }} ($SUSFS_VER)"
          echo "⚙️ Toolchain: $TOOLCHAIN_DISPLAY"
          echo "⚡ Ccache: ${{ github.event.inputs.use_ccache != 'false' && 'Enabled' || 'Disabled' }}"
          echo "======================================"

      - name: KSU Base & Sultan Patches
        working-directory: sultan
        run: |
          set -e
          
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          echo "📥 Downloading KSU setup script..."
          SETUP_SCRIPT="ksu_setup.sh"
          curl -LSs --max-time 30 "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/$KSU_BRANCH/kernel/setup.sh" -o "$SETUP_SCRIPT" || {
            echo "❌ Failed to download KSU setup script"
            exit 1
          }
          
          chmod +x "$SETUP_SCRIPT"
          echo "✅ Running KSU setup..."
          ./"$SETUP_SCRIPT" "$KSU_BRANCH" || {
            echo "❌ KSU setup script failed"
            exit 1
          }
          rm -f "$SETUP_SCRIPT"
          
          KSU_COMMIT=$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo "")
          echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
          
          echo "📋 Applying Sultan kernel patches..."
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
            "../kernel_patches/sultan/0001-modify-noinline.patch"
          )
          
          for patch in "${PATCHES[@]}"; do
            if [ ! -f "$patch" ]; then
              echo "❌ ERROR: Required patch not found: $patch"
              exit 1
            fi
            
            if ! patch -p1 < "$patch"; then
              echo "❌ ERROR: Failed to apply patch: $patch"
              exit 1
            fi
            echo "✅ Applied: $(basename $patch)"
          done

      - name: Apply SuSFS Patches
        if: matrix.enable_susfs == 'true'
        working-directory: sultan
        run: |
          set -e
          
          echo "📋 Applying SuSFS patches (Sultan Android 14 6.1)..."
          
          # Verify SuSFS source files exist
          SUSFS_FILES=(
            "../susfs4ksu/kernel_patches/fs/susfs.c"
            "../susfs4ksu/kernel_patches/include/linux/susfs.h"
            "../susfs4ksu/kernel_patches/include/linux/susfs_def.h"
          )
          
          for file in "${SUSFS_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required SuSFS file not found: $file"
              exit 1
            fi
          done
          
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          
          echo "✅ SuSFS files copied"
          
          # Apply SuSFS kernel patch (with tolerance for fuzz)
          if ! patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/51_deinlined_susfs_hooks_sultan-android14-6.1.patch" 2>&1; then
            echo "⚠️  SuSFS kernel patch failed (non-critical, continuing...)"
          fi
          
          echo "🔧 Applying SuSFS patch to KernelSU..."
          cd KernelSU
          if ! patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/11_enable_susfs_for_ksu.patch"; then
            echo "❌ ERROR: Failed to apply KernelSU SuSFS patch"
            exit 1
          fi
          cd ..
          echo "✅ SuSFS patches applied successfully"

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "⚙️ Generating defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig || { echo "❌ Failed to generate defconfig"; exit 1; }

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          hook_mode: "lsm"
          enable_susfs: "${{ matrix.enable_susfs }}"

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
        run: |
          echo "🔧 Finalizing defconfig..."
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -e
          
          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            CC="ccache ${{ env.TOOLCHAIN_PATH }}gcc"
          else
            CC="${{ env.TOOLCHAIN_PATH }}gcc"
          fi
          
          echo "🔨 Compiling kernel with CC: $CC"
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)" || { echo "❌ Kernel build failed"; exit 1; }
          
          # Validate critical build artifacts exist
          if [ ! -f "out/arch/arm64/boot/Image.lz4" ]; then
            echo "❌ ERROR: Build failed - Image.lz4 not found"
            echo "   Build output directory contents:"
            ls -la out/arch/arm64/boot/ 2>/dev/null || ls -la out/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Kernel build successful - Image.lz4 ready"
          ls -lh out/arch/arm64/boot/Image.lz4

      - name: Ccache Performance Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats (lsm, SUSFS=${{ matrix.enable_susfs }}) ==="
          ccache -s

      - name: Package
        run: |
          set -e
          
          echo "📦 Packaging kernel and artifacts..."
          
          # Validate required metadata from previous step
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KERNEL_VER="${{ steps.meta.outputs.kernel_ver }}"
          S_TAG="${{ steps.meta.outputs.s_tag }}"
          SUSFS_VER="${{ steps.meta.outputs.susfs_ver }}"
          TOOLCHAIN_DISPLAY="${{ steps.meta.outputs.toolchain_display }}"
          
          if [ -z "$K_VER" ] || [ -z "$KERNEL_VER" ] || [ -z "$S_TAG" ]; then
            echo "❌ ERROR: Required metadata missing from Metadata step"
            echo "   ksu_ver: '$K_VER'"
            echo "   kernel_ver: '$KERNEL_VER'"
            echo "   s_tag: '$S_TAG'"
            exit 1
          fi
          
          # Copy kernel and DTB
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4 || { echo "❌ Failed to copy Image.lz4"; exit 1; }
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb || { echo "❌ Failed to copy DTB"; exit 1; }
          
          DATE=$(date +'%y%m%d')
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          
          if [ "$KSU_BRANCH" = "staging" ]; then
            BRANCH_TAG="-staging"
          else
            BRANCH_TAG=""
          fi
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            SUSFS_TAG="-SUSFS_${SUSFS_VER}"
          else
            SUSFS_TAG=""
          fi
          
          BASE_NAME="KSU_Sultan_gs201_${KERNEL_VER}+${K_VER}${BRANCH_TAG}-lsm${SUSFS_TAG}-${DATE}"
          ZIP_NAME="${BASE_NAME}.zip"
          
          echo "📦 Packaging AnyKernel3: $ZIP_NAME"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" ) || { echo "❌ Failed to create zip"; exit 1; }
          
          mkdir -p ./output_artifacts
          mv "$ZIP_NAME" ./output_artifacts/
          
          # Create build metadata
          {
            echo "KERNEL_VER='${KERNEL_VER}'"
            echo "KSU_VER='${K_VER}'"
            echo "KSU_COMMIT='${KSU_COMMIT}'"
            echo "S_TAG='${S_TAG}'"
            echo "TOOLCHAIN_DISPLAY='${TOOLCHAIN_DISPLAY}'"
            if [ "${{ matrix.enable_susfs }}" = "true" ] && [ -n "$SUSFS_VER" ] && [ "$SUSFS_VER" != "unknown" ]; then
              echo "SUSFS_VER='${SUSFS_VER}'"
              echo "SUSFS_COMMIT='${{ steps.meta.outputs.susfs_commit }}'"
            fi
          } > ./output_artifacts/build_metadata.env
          
          echo "✅ Kernel package created successfully"
          
          # Package debug symbols if requested
          if [ "${{ github.event.inputs.upload_debug_symbols }}" = "true" ]; then
            echo "📦 Packaging debug symbols..."
            VMLINUX_ZIP_NAME="vmlinux-${BASE_NAME}.zip"
            SYSMAP_ZIP_NAME="System.map-${BASE_NAME}.zip"
            
            if [ -f "sultan/out/vmlinux" ]; then
              cp sultan/out/vmlinux ./vmlinux
            elif [ -f "sultan/out/arch/arm64/boot/vmlinux" ]; then
              cp sultan/out/arch/arm64/boot/vmlinux ./vmlinux
            else
              find sultan/out -name "vmlinux" -type f -exec cp {} ./vmlinux \; 2>/dev/null || true
            fi
            
            if [ -f "./vmlinux" ]; then
              zip -9 "$VMLINUX_ZIP_NAME" vmlinux || { echo "⚠️  Failed to create vmlinux zip"; }
              mv "$VMLINUX_ZIP_NAME" ./output_artifacts/ || true
              echo "✅ Debug symbols (vmlinux) packaged"
            else
              echo "⚠️  vmlinux not found"
            fi
            
            if [ -f "sultan/out/System.map" ]; then
              cp sultan/out/System.map ./System.map
              zip -9 "$SYSMAP_ZIP_NAME" System.map || { echo "⚠️  Failed to create System.map zip"; }
              mv "$SYSMAP_ZIP_NAME" ./output_artifacts/ || true
              echo "✅ Debug symbols (System.map) packaged"
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-lsm-${{ matrix.enable_susfs }}
          path: ./output_artifacts/*

      - name: Save Cache
        if: always() && github.event.inputs.use_ccache != 'false'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu
          key: toolchain-${{ runner.os }}-arm-gnu-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ github.event.inputs.ksu_branch || 'master' }}-lsm-${{ matrix.enable_susfs }}-${{ github.run_id }}

  release:
    name: Publish Release
    if: always() && github.event.inputs.create_release != 'false' && (needs.build_manual.result == 'success' || needs.build_lsm.result == 'success')
    needs: [matrix_prep, build_manual, build_lsm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: ./all_artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "=== Collected Release Artifacts ==="
          ls -lh ./all_artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_BRANCH: ${{ github.event.inputs.ksu_branch || 'master' }}
        run: |
          DATE=$(date +"%y%m%d")
          TAG="${DATE}-sultan"

          ZIP_FILES=$(find ./all_artifacts -name "*.zip" -type f)
          if [ -z "$ZIP_FILES" ]; then
            echo "Error: No zip files found for release!"
            exit 1
          fi

          if [ -f "./all_artifacts/build_metadata.env" ]; then
            eval "$(grep -E '^(KERNEL_VER|KSU_VER|S_TAG|TOOLCHAIN_DISPLAY|SUSFS_VER|SUSFS_COMMIT)=' ./all_artifacts/build_metadata.env 2>/dev/null || true)"
          fi
          if [ -z "$SUSFS_VER" ] || [ "$SUSFS_VER" = "unknown" ]; then
            DETECTED_SUSFS=$(find ./all_artifacts -name "*SUSFS_*.zip" -type f | head -n1 | sed -E 's/.*SUSFS_([^-]+)-.*/\1/' || true)
            if [ -n "$DETECTED_SUSFS" ]; then
              SUSFS_VER="$DETECTED_SUSFS"
            fi
          fi
          if [ -z "$SUSFS_VER" ] || [ "$SUSFS_VER" = "unknown" ]; then
            SUSFS_VER="v2.2.0"
          fi
          if [ -n "$SUSFS_COMMIT" ]; then
            SUSFS_DISPLAY="\`v${SUSFS_VER#v} (${SUSFS_COMMIT})\`"
          else
            SUSFS_DISPLAY="\`v${SUSFS_VER#v}\`"
          fi
          if [ -n "$KSU_COMMIT" ]; then
            KSU_DISPLAY="\`$KSU_BRANCH\` (v\`$KSU_VER\` @ \`$KSU_COMMIT\`)"
          else
            KSU_DISPLAY="\`$KSU_BRANCH\` (+$KSU_VER)"
          fi
          TOOLCHAIN_DISPLAY="${TOOLCHAIN_DISPLAY:-ARM GNU Toolchain}"
          KERNEL_VER="${KERNEL_VER:-6.1}"
          KSU_VER="${KSU_VER:-unknown}"

          PRERELEASE_FLAG=""
          if [ "$KSU_BRANCH" = "staging" ]; then
            PRERELEASE_FLAG="--prerelease"
            RELEASE_TITLE="Pixel 7 Sultan Kernel ${KERNEL_VER} (Staging)"
          else
            RELEASE_TITLE="Pixel 7 Sultan Kernel ${KERNEL_VER}"
          fi
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "## 📱 Pixel 7 Sultan Kernel"
            echo ""
            echo "### 🚀 Build Info"
            echo "| Item | Details |"
            echo "| :--- | :--- |"
            echo "| **Device** | Google Pixel 7 / 7 Pro (\`gs201\` — Cheetah / Panther) |"
            echo "| **Kernel Base** | Sultan Kernel (Linux $KERNEL_VER) |"
            echo "| **KernelSU** | $KSU_DISPLAY |"
            echo "| **SuSFS** | $SUSFS_DISPLAY |"
            echo "| **Compiler** | $TOOLCHAIN_DISPLAY |"
            echo "| **Build Date** | $BUILD_TIME |"
          } > release_body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚡ Release $TAG already exists for today. Overwriting assets and updating release..."
            gh release upload "$TAG" $ZIP_FILES --clobber
            gh release edit "$TAG" \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG \
              --title "$RELEASE_TITLE" \
              --notes-file release_body.md
          else
            echo "🚀 Creating new release for $TAG..."
            gh release create "$TAG" $ZIP_FILES \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG \
              --title "$RELEASE_TITLE" \
              --notes-file release_body.md
          fi
