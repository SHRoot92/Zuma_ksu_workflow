name: Dump Pixel Build Scripts

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          wget -O kernel.tar.xz \
            https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz

      - name: Extract
        run: |
          tar -xJf kernel.tar.xz

      - name: Dump build scripts
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          cat private/devices/google/gs201/build_gs201.sh \
            > dump/build_gs201.sh.txt

          cat private/devices/google/pantah/build_pantah.sh \
            > dump/build_pantah.sh.txt

          cat private/devices/google/pantah/Kconfig.ext.pantah \
            > dump/Kconfig.ext.pantah.txt

          cat private/devices/google/gs201/Kconfig.ext.gs201 \
            > dump/Kconfig.ext.gs201.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pixel-build-files
          path: |
            kernel-pantah-15260412/dump/build_gs201.sh.txt
            kernel-pantah-15260412/dump/build_pantah.sh.txt
            kernel-pantah-15260412/dump/Kconfig.ext.pantah.txt
            kernel-pantah-15260412/dump/Kconfig.ext.gs201.txt
