name: Dump GS201 Build Script

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Download Source
        run: |
          wget -O kernel.tar.xz \
            https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz

          ls -lh kernel.tar.xz

      - name: Extract Source
        run: |
          mkdir src
          tar -xJf kernel.tar.xz -C src

          ls -lah src
          ls -lah src/kernel-pantah-15260412

      - name: Show Symlink Info
        run: |
          cd src/kernel-pantah-15260412

          echo "==== build_gs201.sh ===="
          ls -l build_gs201.sh

          echo
          echo "==== build_pantah.sh ===="
          ls -l build_pantah.sh

          echo
          echo "==== WORKSPACE ===="
          ls -l WORKSPACE

      - name: Dump GS201 Script
        run: |
          cd src/kernel-pantah-15260412

          TARGET=$(readlink -f build_gs201.sh)

          echo "TARGET=$TARGET"

          echo
          echo "================ HEAD ================="
          head -200 "$TARGET"

          echo
          echo "================ FULL ================="
          cat "$TARGET"

      - name: Dump Pantah Script
        run: |
          cd src/kernel-pantah-15260412

          TARGET=$(readlink -f build_pantah.sh)

          echo "TARGET=$TARGET"

          echo
          echo "================ HEAD ================="
          head -200 "$TARGET"

          echo
          echo "================ FULL ================="
          cat "$TARGET"

      - name: Find Build Configs
        run: |
          cd src/kernel-pantah-15260412

          echo "==== BUILD CONFIGS ===="
          find . -name "build.config*" | sort

          echo
          echo "==== BUILD.SH FILES ===="
          find . -name "build.sh" | sort

          echo
          echo "==== GS201 FILES ===="
          find private/devices/google/gs201 -type f | sort | head -200

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: gs201-build-script
          path: |
            src/kernel-pantah-15260412/private/devices/google/gs201/*
            src/kernel-pantah-15260412/private/devices/google/pantah/*
