name: Dump Pixel Tree

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          wget -O kernel.tar.xz \
            https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz

      - name: Extract
        run: |
          tar -xJf kernel.tar.xz

      - name: Dump directory tree
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          find . -type d | sort > dump/directories.txt

          find . -type f | sort > dump/files.txt

          find . -type l | sort > dump/symlinks.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pixel-tree
          path: kernel-pantah-15260412/dump/
