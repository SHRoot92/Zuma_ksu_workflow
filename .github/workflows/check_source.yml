name: Inspect Pixel Kernel

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Download kernel source
        run: |
          wget -O kernel.tar.xz \
            https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz

          ls -lh kernel.tar.xz

      - name: Extract source
        run: |
          mkdir src

          tar -xJf kernel.tar.xz -C src

          echo "Extraction complete"

      - name: Discover source tree
        run: |
          {
            echo "================ ROOT ================="
            pwd

            echo
            echo "================ SRC TOP ================="
            ls -lah src

            echo
            echo "================ FIND ================="
            find src | head -500

          } | tee tree.log

      - name: Find kernel root
        run: |
          ROOT="$(find src -name build_gs201.sh | head -n1)"

          echo "BUILD_GS201=$ROOT"

          ROOTDIR="$(dirname "$ROOT")"

          echo "ROOTDIR=$ROOTDIR"

          echo "ROOTDIR=$ROOTDIR" >> $GITHUB_ENV

          {
            echo "================ ROOTDIR ================="
            echo "$ROOTDIR"

            echo
            echo "================ LS ================="
            ls -lah "$ROOTDIR"

          } | tee root.log

      - name: Dump build_gs201.sh
        run: |
          cd "$ROOTDIR"

          {
            echo "================ FILE ================="
            file build_gs201.sh

            echo
            echo "================ LS -L ================="
            ls -l build_gs201.sh

            echo
            echo "================ READLINK ================="
            readlink build_gs201.sh || true

            echo
            echo "================ REALPATH ================="
            readlink -f build_gs201.sh || true

            echo
            echo "================ CONTENT ================="
            cat build_gs201.sh || true

          } | tee build_gs201.log

      - name: Dump real target
        run: |
          cd "$ROOTDIR"

          TARGET=$(readlink -f build_gs201.sh)

          echo "TARGET=$TARGET"

          {
            echo "================ TARGET ================="
            echo "$TARGET"

            echo
            echo "================ HEAD 300 ================="
            head -300 "$TARGET"

          } | tee target.log

      - name: Search build configs
        run: |
          cd "$ROOTDIR"

          {
            echo "================ BUILD CONFIGS ================="
            find . -name "build.config*" | sort

            echo
            echo "================ BUILD SCRIPTS ================="
            find . -name "*.sh" | sort

            echo
            echo "================ BAZEL FILES ================="
            find . -name "BUILD.bazel" | head -100

          } | tee buildinfo.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-inspect
          path: |
            tree.log
            root.log
            build_gs201.log
            target.log
            buildinfo.log
