name: Dump Pixel Kernel Build Info

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          wget -O kernel.tar.xz \
            https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz

      - name: Extract
        run: |
          tar -xJf kernel.tar.xz

      - name: Dump source information
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          {
            echo "========== ROOT =========="
            ls -lah

            echo
            echo "========== COMMON =========="
            ls -lah common

            echo
            echo "========== COMMON ACK =========="
            ls -lah common/ack | head -100

            echo
            echo "========== COMMON GKI =========="
            ls -lah common/gki | head -100
          } > dump/tree.txt

      - name: Dump build scripts
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          {
            echo "========== build_gs201.sh =========="
            cat private/devices/google/gs201/build_gs201.sh

            echo
            echo "========== build_pantah.sh =========="
            cat private/devices/google/pantah/build_pantah.sh

            echo
            echo "========== build_dist.sh =========="
            cat tools/build_dist.sh
          } > dump/build_scripts.txt

      - name: Dump configs
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          {
            echo "========== BUILD CONFIG FILES =========="
            find . -name "build.config*" | sort

            echo
            echo "========== GS201 FILES =========="
            find private/devices/google/gs201 -type f | sort

            echo
            echo "========== PANTAH FILES =========="
            find private/devices/google/pantah -type f | sort
          } > dump/config_list.txt

      - name: Dump build.config contents
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          find . -name "build.config*" | while read f
          do
            echo "==========================" >> dump/build_configs.txt
            echo "$f" >> dump/build_configs.txt
            echo "==========================" >> dump/build_configs.txt
            cat "$f" >> dump/build_configs.txt
            echo >> dump/build_configs.txt
          done

      - name: Dump gki config
        run: |
          cd kernel-pantah-15260412

          mkdir -p dump

          {
            echo "========== GKI DEFCONFIG =========="
            sed -n '1,400p' common/ack/arch/arm64/configs/gki_defconfig

            echo
            echo "========== GS201 DEFCONFIG =========="
            find . -name "*gs201*defconfig*" -exec cat {} \;
          } > dump/defconfigs.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: pixel-kernel-dump
          path: kernel-pantah-15260412/dump/
