name: Build GKI + KSUN

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_NAME: 'android14-11-gfa1d6308d1fe-ab14691759'
  KBUILD_BUILD_USER: "build-user"
  KBUILD_BUILD_HOST: "build-host"
  BUILD_TIMESTAMP: "Fri Jan 9 16:33:46 UTC 2026"
  GCC_VERSION: "14.2.rel1"
  KSN_REPO: "https://github.com/MirahSyakilla/KSUN"
  KSN_BRANCH: "susfs+nomount-hookless"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies and initialize source repository
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update || true

          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            aria2 \
            zstd \
            unzip \
            wget \
            pahole \
            zip \
            patch \
            git

          echo "Downloading GKI source..."
          aria2c -s16 -x16 -k1M \
            "https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-06_r1/common-android14-6.1-2026-06_r1.tar.gz" \
            -o common.tar.gz

          mkdir -p common
          tar -xzf common.tar.gz -C common
          rm -f common.tar.gz

          echo "Extracting kernel version from source..."
          cd common
          
          KERNEL_V=$(grep -E '^VERSION =' Makefile | awk '{print $3}' | tr -d '\r')
          KERNEL_P=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}' | tr -d '\r')
          KERNEL_S=$(grep -E '^SUBLEVEL =' Makefile | awk '{print $3}' | tr -d '\r')
          
          if [ -z "$KERNEL_V" ] || [ -z "$KERNEL_P" ]; then
            echo "Error: Failed to extract kernel version from Makefile"
            cat Makefile | grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ='
            exit 1
          fi
          
          KERNEL_S=${KERNEL_S:-0}
          
          KERNEL_VERSION_FULL="${KERNEL_V}.${KERNEL_P}"
          KERNEL_VERSION_FULL_WITH_SUB="${KERNEL_V}.${KERNEL_P}.${KERNEL_S}"
          
          echo "KERNEL_VERSION=${KERNEL_VERSION_FULL}" >> $GITHUB_ENV
          echo "KERNEL_VERSION_FULL=${KERNEL_VERSION_FULL_WITH_SUB}" >> $GITHUB_ENV
          
          echo "Detected kernel version: ${KERNEL_VERSION_FULL_WITH_SUB}"
          
          cd ..

          echo "Downloading Clang 17.0.6..."
          mkdir -p clang
          curl -L "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o clang.tar.xz
          tar -xJf clang.tar.xz -C clang --strip-components=1
          rm -rf clang.tar.xz

          if [ -f "$PWD/clang/bin/clang" ]; then
            CLANG_BIN="$PWD/clang/bin"
          else
            CLANG_BIN=$(find "$PWD/clang" -type f -name "clang" | grep -v "lib/" | head -n 1)
            if [ -n "$CLANG_BIN" ]; then
              CLANG_BIN=$(dirname "$CLANG_BIN")
            else
              echo "Error: Cannot find valid bin directory containing clang in clang/"
              ls -la clang/
              exit 1
            fi
          fi

          echo "Clang installed successfully:"
          $CLANG_BIN/clang --version
          $CLANG_BIN/clang -target aarch64-linux-gnu --version
          
          echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV

          echo "Downloading GCC toolchains..."
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${GCC_VERSION}/binrel/"
          
          ARCHIVE64="arm-gnu-toolchain-${GCC_VERSION}-x86_64-aarch64-none-linux-gnu.tar.xz"
          wget --tries=3 --retry-connrefused -q "${BASE_URL}/${ARCHIVE64}" -O gcc64.tar.xz
          if [ ! -f "gcc64.tar.xz" ] || [ ! -s "gcc64.tar.xz" ]; then
            echo "Error: Failed to download 64-bit GCC toolchain"
            exit 1
          fi
          tar -xf gcc64.tar.xz
          rm gcc64.tar.xz
          
          ARCHIVE32="arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf.tar.xz"
          wget --tries=3 --retry-connrefused -q "${BASE_URL}/${ARCHIVE32}" -O gcc32.tar.xz
          if [ ! -f "gcc32.tar.xz" ] || [ ! -s "gcc32.tar.xz" ]; then
            echo "Warning: Failed to download 32-bit GCC toolchain (optional for CONFIG_COMPAT)"
          else
            tar -xf gcc32.tar.xz
            rm gcc32.tar.xz
            GCC_ARM32_DIR="$PWD/arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/bin"
            echo "GCC_ARM32_DIR=${GCC_ARM32_DIR}" >> $GITHUB_ENV
          fi
          
          TOOLCHAIN_DIR="$PWD/arm-gnu-toolchain-${GCC_VERSION}-x86_64-aarch64-none-linux-gnu"
          GCC_PATH="${TOOLCHAIN_DIR}/bin/aarch64-none-linux-gnu-"
          echo "GCC_PATH=${GCC_PATH}" >> $GITHUB_ENV
          
          echo "GCC toolchains installed successfully:"
          ${GCC_PATH}gcc --version || echo "GCC installed"

          echo "Source and toolchain initialization completed."

          echo "Removing ABI protection and dirty suffix..."
          rm -f common/android/abi_gki_protected_exports_* || true

          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
            [ -f "$f" ] && sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "Current disk space:"
          df -h

      - name: Clone KSUN repository
        run: |
         cd kernel_workspace/common
         echo "Cloning KSUN (susfs+nomount-hookless)..."
         git clone --depth=1 --branch=${{ env.KSN_BRANCH }} ${{ env.KSN_REPO }}.git KernelSU

      - name: Calculate KSUN version
        id: ksn_version
        run: |
         cd kernel_workspace/common/KernelSU
    
         LATEST_TAG=$(curl -s -H "Accept: application/vnd.github.v3+json" \
         https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags | \
         jq -r '.[0].name // "v0.0.1"')
    
         if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
         LATEST_TAG=$(curl -s -H "Accept: application/vnd.github.v3+json" \
         https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest | \
         jq -r '.tag_name // "v0.0.1"')
         fi
    
         if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
         LATEST_TAG="v0.0.1"
         fi
    
         echo "Latest tag from KernelSU-Next: $LATEST_TAG"
    
         git tag -f "$LATEST_TAG"
    
         KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
         KSU_VERSION=$((30000 + KSU_GIT_VERSION))
    
         echo "ksu_git_version=$KSU_GIT_VERSION" >> $GITHUB_OUTPUT
         echo "ksu_version=$KSU_VERSION" >> $GITHUB_OUTPUT
         echo "ksu_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
         echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
         echo "KSU_GIT_VERSION=$KSU_GIT_VERSION" >> $GITHUB_ENV
         echo "KSU_GIT_TAG=$LATEST_TAG" >> $GITHUB_ENV


      - name: Apply KSUN patches and fixes
        run: |
          cd kernel_workspace/common
          
          echo "Setting up KSUN symlink and driver configurations..."
          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "Fixing uapi paths and include headers..."
          cp -r KernelSU/uapi KernelSU/kernel/uapi 2>/dev/null || true
          echo 'ccflags-y += -I$(srctree)/drivers/kernelsu' >> drivers/kernelsu/Makefile
          mkdir -p include/uapi
          cp -f KernelSU/kernel/policy/*.h include/uapi/ 2>/dev/null || true
          cp -f KernelSU/kernel/policy/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/include/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/uapi/*.h include/uapi/ 2>/dev/null || true

          

      - name: Add KSUN kernel configuration
        run: |
          cd kernel_workspace

          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_HEADERS_INSTALL=n
          # CONFIG_KSU_DEBUG is not set
          CONFIG_KSU_KPROBES_HOOK=y
          # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_KPROBES_SUSFS=y
          CONFIG_KSU_KPROBES_NOMOUNT=y
          
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_INOTIFY_USER=y
          EOF

          sed -i 's/check_defconfig//' ./common/build.config.gki

          echo "KSUN configuration applied"

      - name: Add kernel version suffix
        run: |
          cd kernel_workspace

          SUFFIX="${{ env.KERNEL_NAME }}"
          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
          done

      - name: Show build metadata
        run: |
         cd kernel_workspace/common/KernelSU
    
         KSU_VERSION_FROM_MAKEFILE=$(grep "KSU_VERSION =" kernel/Makefile 2>/dev/null | awk '{print $3}' | head -1 || echo "unknown")
    
         echo "========================================"
         echo "Build Metadata"
         echo "========================================"
         echo "Kernel Version: ${{ env.KERNEL_VERSION_FULL }}"
         echo "Kernel Suffix:  ${{ env.KERNEL_NAME }}"
         echo ""
         echo "KSUN Version:   ${KSU_VERSION_FROM_MAKEFILE}"
         echo "KSUN Git:       ${{ env.KSU_GIT_VERSION }}"
         echo "KSUN Tag:       ${{ env.KSU_GIT_TAG }}"
         echo ""
         echo "Clang:"
         $CLANG_BIN/clang --version | head -1
         echo "GCC64:"
         ${GCC_PATH}gcc --version | head -1
         echo ""
         echo "User:           ${{ env.KBUILD_BUILD_USER }}"
         echo "Host:           ${{ env.KBUILD_BUILD_HOST }}"
         echo "Cores:          $(nproc)"
         echo "========================================"

      - name: Build kernel
        run: |
          WORKDIR="$(pwd)"
          
          if [ -z "$CLANG_BIN" ]; then
            echo "Error: CLANG_BIN environment variable not set"
            exit 1
          fi
          
          if [ ! -f "$CLANG_BIN/clang" ]; then
            echo "Error: clang not found at $CLANG_BIN/clang"
            exit 1
          fi
          
          export PATH="$CLANG_BIN:$PATH"
          
          if [ -n "$GCC_PATH" ]; then
            export CROSS_COMPILE="${GCC_PATH}"
            echo "Using custom GCC toolchain: ${CROSS_COMPILE}"
            GCC_BIN_DIR=$(dirname "${GCC_PATH}")
            export PATH="${GCC_BIN_DIR}:$PATH"
          else
            echo "Warning: GCC_PATH not set, using system toolchain"
            export CROSS_COMPILE="aarch64-linux-gnu-"
          fi
          
          if [ -n "$GCC_ARM32_DIR" ] && [ -f "${GCC_ARM32_DIR}/arm-none-linux-gnueabihf-gcc" ]; then
            export CROSS_COMPILE_ARM32="${GCC_ARM32_DIR}/arm-none-linux-gnueabihf-"
            export PATH="${GCC_ARM32_DIR}:$PATH"
            echo "Using 32-bit toolchain: ${CROSS_COMPILE_ARM32}"
          fi
          
          echo "Using Clang from: $CLANG_BIN"
          clang --version
          
          cd kernel_workspace/common
          
          export KCFLAGS="-O2 -Wno-error"
          
          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
          
          export KBUILD_GENDWARFKSYMS_STABLE=1
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out gki_defconfig
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out Image
          
          echo "Kernel build completed."
          
          df -h

      - name: Package kernel
        run: |
          cd kernel_workspace

          git clone https://github.com/yapixel/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          KSU_VERSION="${{ env.KSU_VERSION }}"
          [ -z "$KSU_VERSION" ] && KSU_VERSION="1"

          ZIP_NAME="AK3_${{ env.KERNEL_VERSION_FULL }}_KSUN_r${KSU_VERSION}.zip"
          zip -r9 "../${ZIP_NAME}" ./*

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Packaging completed: ${ZIP_NAME}"

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AK3_${{ env.KERNEL_VERSION }}_KSUN
          path: kernel_workspace/AK3_*.zip
