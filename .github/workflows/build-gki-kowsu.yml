name: Build GKI Kernel with KowSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      use_ccache:
        description: 'Use ccache for compilation'
        required: false
        default: false
        type: boolean
      kernel_ref:
        description: 'Kernel branch/tag'
        required: false
        default: 'android14-6.1-2026-03'
        type: string
      susfs_ref:
        description: 'SuSFS branch/tag'
        required: false
        default: 'gki-android14-6.1'
        type: string
      kowsu_ref:
        description: 'KOWSU KernelSU branch/tag'
        required: false
        default: 'master'
        type: string
      build_epoch:
        description: 'SOURCE_DATE_EPOCH for reproducible builds'
        required: false
        default: '1711843200'
        type: string
      build_timestamp:
        description: 'KBUILD_BUILD_TIMESTAMP'
        required: false
        default: 'Sun Mar 31 00:00:00 UTC 2024'
        type: string
      build_host:
        description: 'KBUILD_BUILD_HOST'
        required: false
        default: 'GKI-Builder'
        type: string
      build_user:
        description: 'KBUILD_BUILD_USER'
        required: false
        default: 'deepongi'
        type: string

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref_name }}
  cancel-in-progress: false

env:
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  KOWSU_REPO_URL: https://github.com/KOWX712/KernelSU.git
  ANYKERNEL_REPO_URL: https://github.com/yapixel/AnyKernel3
  CLIDR_PATCH_URL: https://raw.githubusercontent.com/infectedmushi/kernel_patches/4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e/fix-clidr-uninitialized.patch
  WIFI_PATCH_URL: https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Workflow Repo 
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev pahole build-essential bc bison flex libssl-dev ccache zip curl git

          # 创建规范的工作流目录结构
          mkdir -p kernel_workspace/clang
          mkdir -p kernel_workspace/build-tools
          mkdir -p kernel_workspace/clang-tools

          # 1. 下载 Google 官方预编译 Clang (以适用于 Android 14 6.1 的 r485501b 为例)
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r485501b.tar.gz" -o clang.tar.gz
          tar -xf clang.tar.gz -C kernel_workspace/clang
          rm -f clang.tar.gz

          # 2. 下载 Google 官方预编译 build-tools
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/build-tools/+archive/refs/heads/main/linux-x86.tar.gz" -o build-tools.tar.gz
          tar -xf build-tools.tar.gz -C kernel_workspace/build-tools
          rm -f build-tools.tar.gz

          # 3. 下载 Google 官方预编译 clang-tools
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang-tools/+archive/refs/heads/main/linux-x86.tar.gz" -o clang-tools.tar.gz
          tar -xf clang-tools.tar.gz -C kernel_workspace/clang-tools
          rm -f clang-tools.tar.gz

      - name: Sync Kernel & SuSFS
        run: |
          git clone --depth=1 --branch="${{ inputs.kernel_ref }}" "${{ env.KERNEL_REPO_URL }}" kernel_workspace/kernel
          git clone --depth=1 --branch="${{ inputs.susfs_ref }}" "${{ env.SUSFS_REPO_URL }}" kernel_workspace/susfs4ksu

      - name: Setup KowSU KernelSU
        run: |
          cd kernel_workspace/kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 --branch="${{ inputs.kowsu_ref }}" "${{ env.KOWSU_REPO_URL }}" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SuSFS with Local Patches
        if: inputs.disable_susfs != 'true'
        run: |
          cp kernel_workspace/susfs4ksu/kernel_patches/fs/susfs.c kernel_workspace/kernel/fs/
          cp kernel_workspace/susfs4ksu/kernel_patches/include/linux/susfs.h kernel_workspace/kernel/include/linux/
          cp kernel_workspace/susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel_workspace/kernel/include/linux/

          cd kernel_workspace/kernel
          # 注意：应用此步骤需确保你的本地 workflow 仓库的该路径下存有对应的 patch 文件
          patch -p1 --forward < ../../.github/patches/kowsu/50_add_susfs_in_gki-android14-6.1.patch || true
          cd KernelSU
          patch -p1 --forward < ../../../.github/patches/kowsu/10_enable_susfs_for_ksu.patch || true

      - name: Apply Fix Patches
        run: |
          cd kernel_workspace/kernel
          rm -f android/abi_gki_protected_exports_* || true
          curl -fsSL "${{ env.CLIDR_PATCH_URL }}" | patch -p1 --forward || true
          curl -fsSL "${{ env.WIFI_PATCH_URL }}" | patch -p1 --forward || true

      - name: Compile Kernel
        working-directory: kernel_workspace/kernel
        run: |
          set -e
          
          # 1. 自动推导工作空间绝对路径
          WORK_DIR="$(dirname "$PWD")" 
          
          # 2. 注入 Google 工具链环境（不含 rust/bin）
          export PATH="${WORK_DIR}/clang/bin:${WORK_DIR}/build-tools/bin:${WORK_DIR}/clang-tools/bin:${PATH}"
          
          # 如果开启了 ccache 缓存，则注入 ccache 路径
          if [ -d "${{ github.workspace }}/.ccache-bin" ]; then
            export PATH="${{ github.workspace }}/.ccache-bin:${PATH}"
          fi
          
          # 3. 去除编译路径绝对化，保障内核干净稳定
          ROOT_REAL_PATH=$(dirname "$(readlink -f "$PWD")")
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export KCFLAGS="-fdebug-prefix-map=$ROOT_REAL_PATH=. -fmacro-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=. -no-canonical-prefixes -pipe -fno-stack-protector -DANDROID_COMMON_KERNEL"
          
          # 4. 伪装编译元数据（去隐私/防变异变动）
          export SOURCE_DATE_EPOCH="${{ inputs.build_epoch }}"
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          export KBUILD_BUILD_HOST="${{ inputs.build_host }}"
          export KBUILD_BUILD_USER="${{ inputs.build_user }}"

          # 5. 将 KowSU 和 SuSFS 的 Kconfig 选项写入基础 defconfig 
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUCOMPAT=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="-deepongi+"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LTO_NONE=y
          EOF

          if [ "${{ inputs.disable_susfs }}" != "true" ]; then
            cat <<'SUSFS_EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
          fi

          # 6. 生成并编译内核
          JOBS=$(nproc)
          
          # 生成最终 .config
          make -j$JOBS LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          
          # 如果开启了强力清理
          [ "${{ inputs.force_clean_build }}" = "true" ] && make -j$JOBS LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out clean
          
          # 执行全量编译
          make -j$JOBS LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          
          # 7. 打印 ccache 状态（可选）
          [ "${{ inputs.use_ccache }}" = "true" ] && ccache -s || true

      - name: Package Kernel
        run: |
          cd kernel_workspace/kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ../..

          git clone --depth=1 "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3

          cp kernel_workspace/kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel_workspace/kernel/out/arch/arm64/boot/dtb ] && cp kernel_workspace/kernel/out/arch/arm64/boot/dtb AnyKernel3/ || true

          cd AnyKernel3
          rm -rf .git .github
          ZIP_NAME="${KERNEL_VERSION}-kowsu.zip"
          zip -r9 "../$ZIP_NAME" .
          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kowsu
          path: ${{ env.KERNEL_ZIP }}

      - name: Create Release
        if: always()
        run: |
          TAG="kowsu-build-${{ github.run_number }}"
          NOTES="KOWSU + SUSFS build #${{ github.run_number }} · $(date -u '+%Y-%m-%d %H:%M UTC')"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ env.KERNEL_ZIP }}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${{ env.KERNEL_ZIP }}" --title "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
