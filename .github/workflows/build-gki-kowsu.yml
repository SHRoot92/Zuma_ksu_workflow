
name: Build Android Kernel with KowSU

on:
  workflow_dispatch:
    inputs:
      pixel8a:
        description: 'Enable Pixel 8a configuration (y/n)'
        required: false
        default: 'y'
      lto_type:
        description: 'LTO type (full/thin/none)'
        required: false
        default: 'thin'
      build_clean:
        description: 'Build clean mode (always/auto/never)'
        required: false
        default: 'always'

env:
  # Build configuration
  BUILD: dev
  PIXEL8A: ${{ github.event.inputs.pixel8a || 'y' }}
  LTO_TYPE: ${{ github.event.inputs.lto_type || 'thin' }}
  ZIP_PREFIX: AK3-A14-6.1.162-KowSU
  KERNEL_DIR: common
  CONFIG_FILE: arch/arm64/configs/gki_defconfig
  OUT_DIR: out
  KERNEL_TAG: android14-6.1-2026-03
  BUILD_CLEAN: ${{ github.event.inputs.build_clean || 'always' }}
  RETRY: 3
  REPO_DEPTH: 1
  KSUN_BRANCH: master
  ANYKERNEL_DIR: AnyKernel3-p8a
  ANYKERNEL_BRANCH: gki-2.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  PATCHES_BRANCH: dev
  BUILDS_DIR: builds/6.1.162
  #LOCALVERSION: -android14-11-g66e758f7d0c0-ab13748739
  BUILD_DATE: Tue Jul 8 09:17:32 UTC 2025
  
  # Compiler configuration
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  LLVM_CACHE_PATH: ${{ github.workspace }}/.cache/llvm

  # Reproducible identity
  KBUILD_BUILD_USER: build-user
  KBUILD_BUILD_HOST: build-host
  
  # GitHub-specific
  GIT_SHORT_SHA: ${{ github.event.pull_request.head.sha && github.event.pull_request.head.sha || github.sha }}

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Check Initial Disk Space
      run: |
          echo "===== Initial Total Disk Space in GB ====="
          df -BG
          
    - name: Download Apache Arrow's util_free_space.sh
      run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh
          
    - name: Check Disk Space After Cleanup
      run: |
          echo "===== Total Disk Space After Cleanup in GB ====="
          df -BG

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "GIT_SHORT_SHA=$(echo ${{ env.GIT_SHORT_SHA }} | cut -c1-7)" >> $GITHUB_ENV
        echo "THREADS=$(nproc)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          zip \
          ccache \
          curl \
          git \
          wget \
          cpio \
          python3 \
          python3-pip \
          device-tree-compiler \
          kmod \
          dwarves \
          pahole

    - name: Remove System Clang
      run: sudo apt-get purge clang-14
    
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: kernel-build-${{ env.LTO_TYPE }}
        max-size: 5G

    - name: Download and setup Clang
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang
        
        # Download latest Clang from Google
        #wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz -O clang.tar.gz
        aria2c -s16 -x16 -k1M "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" -o clang.tar.gz
        tar -xzf clang.tar.gz
        rm clang.tar.gz
        
        echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
        echo "$HOME/clang/bin" >> $GITHUB_PATH
        
    - name: Verify Clang Binary
      run: |
       $HOME/clang/bin/clang --version | head -n1
    
    - name: Download ARM64 toolchain
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        
        # Download ARM64 GNU toolchain
        wget https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        
        echo "ARM64_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

    - name: Download ARM32 toolchain
      run: |
        cd $HOME/toolchains
        
        # Download ARM32 GNU toolchain
        wget https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        tar -xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
        
        echo "ARM32_TOOLCHAIN=$HOME/toolchains/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-" >> $GITHUB_ENV

    - name: Clone kernel source
      run: |
        #git clone --depth=1 https://android.googlesource.com/kernel/common -b ${{ env.KERNEL_TAG }}  ${{ env.KERNEL_DIR }}
        aria2c -s16 -x16 -k1M "https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r14.tar.gz" -o common.tar.gz
        mkdir -p common && tar -xzf common.tar.gz -C common && rm common.tar.gz
         

    - name: Setup repositories
      run: |
        # Clone susfs4ksu
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.SUSFS_BRANCH }} ${{ env.SUSFS_REPO }} susfs4ksu
        
        # Clone AnyKernel3
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.ANYKERNEL_BRANCH }} \
          https://github.com/deepongi-labs/${{ env.ANYKERNEL_DIR }} ${{ env.ANYKERNEL_DIR }}
        
        # Clone kernel patches
        git clone --depth=${{ env.REPO_DEPTH }} -b ${{ env.PATCHES_BRANCH }} ${{ env.PATCHES_REPO }} kernel_patches
        
       
    - name: Prepare kernel source
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        git clean -fdx || true
        # Using latest commit from branch (reset commit disabled)
        rm -rf KernelSU || true

    - name: Configure Pixel 8a
      if: env.PIXEL8A == 'y'
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        
        # Add Pixel 8a specific configurations
        cat >> "$CONFIG" << EOF
        CONFIG_ARM64_CORTEX_X3=y
        CONFIG_ARM64_CORTEX_A715=y
        CONFIG_ARM64_CORTEX_A510=y
        CONFIG_ARM64_VA_BITS=48
        CONFIG_ARM64_PA_BITS=48
        CONFIG_ARM64_TAGGED_ADDR_ABI=y
        CONFIG_ARM64_SVE=y
        CONFIG_ARM64_BTI=y
        CONFIG_ARM64_PTR_AUTH=y
        CONFIG_SCHED_MC=y
        CONFIG_SCHED_CORE=y
        CONFIG_ENERGY_MODEL=y
        CONFIG_UCLAMP_TASK=y
        CONFIG_UCLAMP_TASK_GROUP=y
        CONFIG_SCHEDUTIL=y
        CONFIG_CPU_FREQ=y
        CONFIG_CPUFREQ_DT=y
        CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
        CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
        EOF

    - name: Configure LTO
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        sed -i -E '/^CONFIG_LTO_(CLANG_(FULL|THIN)|NONE)=/d' "$CONFIG" || true
        
        case "${{ env.LTO_TYPE }}" in
          full) echo "CONFIG_LTO_CLANG_FULL=y" >> "$CONFIG" ;;
          thin) echo "CONFIG_LTO_CLANG_THIN=y" >> "$CONFIG" ;;
          none) echo "CONFIG_LTO_NONE=y" >> "$CONFIG" ;;
        esac

    - name: Install KernelSU 
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        curl -LSs https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/${{ env.KSUN_BRANCH }}/kernel/setup.sh | bash -s ${{ env.KSUN_BRANCH }}


    - name: Apply SUSFS patches
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        # Copy SUSFS patches
        cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
        cp ../susfs4ksu/kernel_patches/fs/* ./fs/
        cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
        
        patch -p1 < ../.github/patches/kowsu/50_add_susfs_in_gki-android14-6.1.patch || true
       
        cd ./KernelSU

        echo "Apply KSU integration patches"   
        
        patch -p1 < ../../.github/patches/kowsu/10_enable_susfs_for_ksu.patch


    - name: Configure kernel
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        CONFIG="${{ env.CONFIG_FILE }}"
        
        # Remove ABI exports that could block linking
        rm -f android/abi_gki_protected_exports_* || true
        
        # Core kernel configuration
        cat >> "$CONFIG" << EOF
        CONFIG_LOCALVERSION="${{ env.LOCALVERSION }}"
        CONFIG_LOCALVERSION_AUTO=n
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_DEBUG=n
        CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
        CONFIG_KSU_ALLOWLIST_WORKAROUND=n
        CONFIG_KSU_LSM_SECURITY_HOOKS=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_TCP_CONG_CUBIC=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_TCP_CONG_BIC=n
        CONFIG_TCP_CONG_WESTWOOD=n
        CONFIG_TCP_CONG_HTCP=n
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=256
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CCACHE=y
        EOF
        
        # Disable BTF debug info (optional - only if pahole fails)
        sed -i '/^CONFIG_DEBUG_INFO_BTF/d' "$CONFIG"
        echo "# CONFIG_DEBUG_INFO_BTF is not set" >> "$CONFIG"
        
    - name: Set fixed build timestamp
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        perl -pi -e 's/build-timestamp = \$\(or \$\(KBUILD_BUILD_TIMESTAMP\), \$\(build-timestamp-auto\)\)/build-timestamp = "Tue Jul 8 09:17:32 UTC 2025"/' ./init/Makefile

    - name: Prepare build
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        sed -i '/# Check for uncommitted changes\./,/fi/d' ./scripts/setlocalversion || true
        sed -i '2s/check_defconfig//' ./build.config.gki 2>/dev/null || true
        
        if [ "${{ env.BUILD_CLEAN }}" = "always" ]; then
          rm -rf ${{ env.OUT_DIR }}
        fi
        mkdir -p ${{ env.OUT_DIR }}

    - name: Set reproducible build identity
      run: |
        echo "KBUILD_BUILD_USER=${{ env.KBUILD_BUILD_USER }}" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=${{ env.KBUILD_BUILD_HOST }}" >> $GITHUB_ENV
    
    - name: Build kernel
      working-directory: ${{ env.KERNEL_DIR }}
      env:
        KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
        KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
      run: |
        make -j${{ env.THREADS }} \
          LLVM_IAS=1 \
          LLVM=1 \
          ARCH=arm64 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
          CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
          CC="ccache clang" \
          LD=ld.lld \
          HOSTLD=ld.lld \
          O="${{ env.OUT_DIR }}" \
          gki_defconfig all

    - name: Check build output
      run: |
        if [ ! -f "${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
          echo "Error: Kernel Image not found!"
          exit 1
        fi

    - name: Package kernel
      run: |
        IMAGE="${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image"
        cp -fv "$IMAGE" "${{ env.ANYKERNEL_DIR }}"/
        
        cd "${{ env.ANYKERNEL_DIR }}"
        rm -rf .git
        
        # Get BUILD version from KernelSU
        if [ -d "../${{ env.KERNEL_DIR }}/KernelSU/.git" ]; then
          cd "../${{ env.KERNEL_DIR }}/KernelSU"
          BUILD_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "12222")
          BUILD_VER=$((10000 + BUILD_COUNT + 200))
        else
          BUILD_VER="12222"
        fi
        
        cd "${{ github.workspace }}/${{ env.ANYKERNEL_DIR }}"
        
        # Create timestamp label
        TIMESTAMP=$(TZ=UTC date -u +"%Y%m%dT%H%MZ")
        BUILD_LABEL="${TIMESTAMP}-${{ env.GIT_SHORT_SHA }}"
        ZIP_NAME="${{ env.ZIP_PREFIX }}-${BUILD_VER}.zip"
        
        zip -r "../${ZIP_NAME}" ./*
        
        mkdir -p "../${{ env.BUILDS_DIR }}"
        mv "../${ZIP_NAME}" "../${{ env.BUILDS_DIR }}/"
        
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "BUILD_VER=${BUILD_VER}" >> $GITHUB_ENV

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
        retention-days: 30

    - name: Generate build info
      run: |
        cd "${{ env.KERNEL_DIR }}"
        cat > ../build_info.txt << EOF
        Build Information
        =================
        Kernel Version: 6.1.145
        Build Number: ${{ env.BUILD_VER }}
        Build Date: $(date -u)
        Commit SHA: ${{ github.sha }}
        Short SHA: ${{ env.GIT_SHORT_SHA }}
        LTO Type: ${{ env.LTO_TYPE }}
        Pixel 8a Config: ${{ env.PIXEL8A }}
        
        Compiler Information
        ===================
        Clang Version: $(clang --version | head -n1)
        
        Build Configuration
        ==================
        KernelSU: Enabled (next-susfs)
        SuSFS: Enabled
        Baseband-guard: Enabled
        BBR TCP: Enabled
        IPSet: Enabled
        EOF
        
        cat ../build_info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build_info.txt
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.BUILDS_DIR }}/${{ env.ZIP_NAME }}
          build_info.txt
        body: |
          ## Kernel Build ${{ github.ref_name }}
          
          - **Build Version**: ${{ env.BUILD_VER }}
          - **Commit**: ${{ github.sha }}
          - **LTO**: ${{ env.LTO_TYPE }}
          - **Date**: $(date -u)
          
          ### Features
          - KernelSU-Next (next-susfs branch)
          - SuSFS patches for android14-6.1
          - Baseband-guard integration
          - BBR TCP congestion control
          - IPSet support
          - Pixel 8a optimizations
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
