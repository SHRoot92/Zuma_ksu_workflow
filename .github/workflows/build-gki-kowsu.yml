name: Build Kernel 6.1 Image (Standalone MidoriSU)

on:
  workflow_dispatch: # 删除了所有 inputs，直接一键运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      VARIANT: "MidoriSU"
      KERNEL_VERSION: "6.1"
      # 以下为自动规范化的编译元数据
      BUILD_USER: "build-user"
      BUILD_HOST: "build-host"
      BUILD_EPOCH: "1711843200"
      BUILD_TIMESTAMP: "Sun Mar 31 00:00:00 UTC 2024"
      KERNEL_LOCALVERSION: "-MidoriSU"
      # 默认开启必备特性
      USE_SUSFS: "true"
      USE_DROIDSPACES: "false"
      USE_CCACHE: "true"
      BUILD_EBPF: "true"
      # 环境后缀控制
      DS_SUFFIX: ""
      SUSFS_SUFFIX: "-SUSFS"
      CCACHE_DIR: ${{ github.workspace }}/.ccache-MidoriSU-susfs
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Dynamic Configs (Standalone)
        id: cfg
        run: |
          echo "android_version=android14" >> $GITHUB_OUTPUT
          echo "sub_level=6.1" >> $GITHUB_OUTPUT
          echo "asb_date=2024-03" >> $GITHUB_OUTPUT
          echo "r_version=none" >> $GITHUB_OUTPUT
          echo "r_suffix=" >> $GITHUB_OUTPUT
          echo "clang_version=r485501b" >> $GITHUB_OUTPUT
          echo "mirror_tag=GKI-Tools" >> $GITHUB_OUTPUT
          echo "anykernel_branch=android14-6.1" >> $GITHUB_OUTPUT
          echo "kmi_version=android14-6.1" >> $GITHUB_OUTPUT

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true &
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bison flex bc aria2 ccache &

      - name: Restore Ccache
        if: env.USE_CCACHE == 'true'
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: gki-6.1-r485501b-2024-03-MidoriSU-susfs-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: |
            gki-6.1-r485501b-2024-03-MidoriSU-susfs-

      - name: Setup Ccache Wrappers
        if: env.USE_CCACHE == 'true'
        run: |
          for i in $(seq 1 60); do which ccache && break; sleep 1; done
          which ccache || { echo "ccache not found after waiting"; exit 1; }
          CCACHE_PATH="${{ github.workspace }}/.ccache-bin"
          mkdir -p "$CCACHE_PATH" && rm -f "$CCACHE_PATH"/*
          for prog in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-size llvm-readelf llvm-strip; do
            ln -sf "$(which ccache)" "$CCACHE_PATH/$prog"
          done
          echo "$CCACHE_PATH" >> $GITHUB_PATH
          ccache -M 10G
          ccache -o hash_dir=false
          ccache -o compiler_check=content
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules
          ccache -o depend_mode=true
          ccache -o run_second_cpp=true
          ccache -z

      - name: Download Toolchains & Kernel Source
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r485501b.tar.gz"
          BTOOLS_URL="https://android.googlesource.com/platform/prebuilts/build-tools/+archive/refs/heads/main/linux-x86.tar.gz"
          KERNEL_BASE_URL="https://android.googlesource.com/kernel/common/+archive/refs/heads/android14-6.1.tar.gz"
          
          aria2c -s16 -x16 -k1M "$KERNEL_BASE_URL" -o common.tar.gz && mkdir -p common && tar -xzf common.tar.gz -C common &
          aria2c -s16 -x16 -k1M "$CLANG_URL" -o clang.tar.gz && mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz &
          aria2c -s16 -x16 -k1M "$BTOOLS_URL" -o build-tools.tar.gz && mkdir -p build-tools && tar -xzf build-tools.tar.gz -C build-tools && rm build-tools.tar.gz &
          wait
          
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          rm -f common/android/abi_gki_protected_exports_* || true

      - name: Setup KernelSU (MidoriSU)
        working-directory: kernel_workspace/common
        run: |
          git clone --single-branch --branch=main https://github.com/midori01/KernelSU.git KernelSU
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(srctree)/$(src) -I$(srctree)/$(src)/include -I$(src) -I$(src)/include|' KernelSU/kernel/Kbuild
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SUSFS
        if: env.USE_SUSFS == 'true'
        working-directory: kernel_workspace/common
        run: |
          SUSFS_DIR="${{ github.workspace }}/susfs4ksu"
          git clone --depth=1 --branch="gki-android14-6.1" https://gitlab.com/simonpunk/susfs4ksu "$SUSFS_DIR"
          
          cp "$SUSFS_DIR"/kernel_patches/fs/* fs/
          cp "$SUSFS_DIR"/kernel_patches/include/linux/* include/linux/
          
          if [ -d "${{ github.workspace }}/.github/patches" ]; then
            patch -p1 < "${{ github.workspace }}/.github/patches/android14-6.1/50_add_susfs_in_gki-android14-6.1.patch" || true
            patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/10_enable_susfs_for_ksu.patch" || true
          fi

      - name: Inject Kernel Configs (Inline Standalone)
        working-directory: kernel_workspace/common
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          cat <<EOF >> "$DEFCONFIG"
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUCOMPAT=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="${{ env.KERNEL_LOCALVERSION }}"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LTO_NONE=y
          EOF

          if [ "${{ env.USE_SUSFS }}" = "true" ]; then
            cat <<'SUSFS_EOF' >> "$DEFCONFIG"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
          fi

      - name: Save Commit Info
        working-directory: kernel_workspace/common
        run: |
          COMMIT_DIR="$(pwd)/commit_info"
          mkdir -p "$COMMIT_DIR"
          cd KernelSU
          
          git rev-parse HEAD > "$COMMIT_DIR/midorisu_ksu_commit"
          git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/midorisu_ksu_date"
          git rev-list --count HEAD > "$COMMIT_DIR/ksu_commit_count"
          
          if [ "${{ env.USE_SUSFS }}" = "true" ] && [ -d "${{ github.workspace }}/susfs4ksu" ]; then
            pushd "${{ github.workspace }}/susfs4ksu" > /dev/null
            git rev-parse HEAD > "$COMMIT_DIR/susfs_commit"
            git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/susfs_date"
            popd > /dev/null
          fi

      - name: Upload Commit Info
        uses: actions/upload-artifact@v4
        with:
          name: commit-info-6.1-MidoriSU${{ env.SUSFS_SUFFIX }}
          path: kernel_workspace/common/commit_info/
          retention-days: 1

      - name: Compile Kernel
        working-directory: kernel_workspace/common
        run: |
          WORK_DIR="${{ github.workspace }}/kernel_workspace"
          export PATH="${WORK_DIR}/clang/bin:${WORK_DIR}/build-tools/bin:${PATH}"
          
          if [ -d "${{ github.workspace }}/.ccache-bin" ]; then
            export PATH="${{ github.workspace }}/.ccache-bin:${PATH}"
          fi
          
          ROOT_REAL_PATH=$(dirname "$(readlink -f "$PWD")")
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export KCFLAGS="-fdebug-prefix-map=$ROOT_REAL_PATH=. -fmacro-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=. -no-canonical-prefixes -pipe -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          export SOURCE_DATE_EPOCH="${{ env.BUILD_EPOCH }}"
          export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
          export KBUILD_BUILD_HOST="${{ env.BUILD_HOST }}"
          export KBUILD_BUILD_USER="${{ env.BUILD_USER }}"
          
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          [ "${{ env.USE_CCACHE }}" = "true" ] && ccache -s

      
      - name: Package Kernel
        working-directory: kernel_workspace
        run: |
          IMAGE="common/out/arch/arm64/boot/Image"
          [ -f "$IMAGE" ] || { echo "Binary Missing!"; exit 1; }
          ZIP_NAME="MidoriSU_Kernel-6.1_Standalone${{ env.SUSFS_SUFFIX }}.zip"
          
          git clone --depth=1 https://github.com/midori01/AnyKernel3 -b android14-6.1 anykernel
          cp "$IMAGE" anykernel/
          cd anykernel && rm -rf .git && zip -r9 "../$ZIP_NAME" *
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save Ccache
        if: env.USE_CCACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-6.1-MidoriSU${{ env.SUSFS_SUFFIX }}
          path: kernel_workspace/${{ env.ZIP_NAME }}
