name: Build GKI Kernel with  KowSU

on:
  workflow_dispatch:
    inputs:
      force_clean_build:
        description: 'Force clean build'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      make_jobs:
        description: 'Parallel jobs (auto or integer)'
        required: false
        default: 'auto'
        type: string
      kernel_ref:
        description: 'Kernel ref'
        required: false
        default: 'android14-6.1-2026-03'
        type: string
      kowsu_ref:
        description: 'KowSU ref'
        required: false
        default: 'master'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup Build Environment
        run: |
          set -e
          echo "CPU cores: $(nproc)"
          df -h .
          mkdir -p /tmp/toolchains

          echo "Downloading ARM GNU Toolchain..."
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" -o /tmp/toolchains/arm64.tar.xz
          tar -xf /tmp/toolchains/arm64.tar.xz -C /tmp/toolchains/
          ARM64_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-aarch64-none-linux-gnu" | head -1)
          echo "ARM64_TOOLCHAIN=${ARM64_DIR}/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz" -o /tmp/toolchains/arm32.tar.xz
          tar -xf /tmp/toolchains/arm32.tar.xz -C /tmp/toolchains/
          ARM32_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-arm-none-linux-gnueabihf" | head -1)
          echo "ARM32_TOOLCHAIN=${ARM32_DIR}/bin/arm-none-linux-gnueabihf-" >> $GITHUB_ENV

          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev pahole

      - name: Sync Sources
        run: |
          set -e
          git clone --depth=1 --branch="${{ inputs.kernel_ref }}" "https://android.googlesource.com/kernel/common" kernel
          git clone --depth=1 --branch="gki-android14-6.1" "https://gitlab.com/simonpunk/susfs4ksu" susfs4ksu
          git clone --depth=1 https://github.com/yapixel/kernel_patches kernel_patches

      - name: Setup KowSU
        run: |
          set -e
          cd kernel
          git clone --depth=1 --branch="${{ inputs.kowsu_ref }}" "https://github.com/KOWX712/KernelSU.git" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SuSFS
        run: |
          set -e
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/
          cd kernel
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch || true
          cd KernelSU
          patch -p1 --forward < ../../kernel_patches/kowsu/10_enable_susfs_for_ksu.patch || true

      - name: Build Kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"

          MAKE_JOBS="${{ inputs.make_jobs }}"
          [ "$MAKE_JOBS" = "auto" ] && MAKE_JOBS=$(nproc)

          make O=out gki_defconfig

          cat <<EOF >> out/.config
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="-kowsu"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LTO_NONE=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          make O=out olddefconfig
          [ "${{ inputs.force_clean_build }}" = "true" ] && make -j$MAKE_JOBS O=out clean
          make -j$MAKE_JOBS O=out Image

      - name: Package Kernel
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..

          git clone --depth=1 "https://github.com/deepongi-labs/AnyKernel3-p8a" AnyKernel3 2>/dev/null || \
            git clone --depth=1 --branch=main "https://github.com/deepongi-labs/AnyKernel3-p8a" AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/ || true

          cd AnyKernel3 && rm -rf .git .github
          ZIP_NAME="${KERNEL_VERSION}-kowsu-susfs.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..

          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kowsu
          path: ${{ env.KERNEL_ZIP }}

      - name: Publish Release
        if: inputs.create_release
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES="KowSU + SuSFS | Kernel ${{ inputs.kernel_ref }} | $(date -u '+%Y-%m-%d %H:%M UTC')"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ env.KERNEL_ZIP }}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${{ env.KERNEL_ZIP }}" --title "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
