name: Build GKI Kernel with KowSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      kernel_ref:
        description: 'Kernel branch/tag'
        required: false
        default: 'android14-6.1-2026-03'
        type: string
      susfs_ref:
        description: 'SuSFS branch/tag'
        required: false
        default: 'gki-android14-6.1'
        type: string
      kowsu_ref:
        description: 'KOWSU KernelSU branch/tag'
        required: false
        default: 'master'
        type: string

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref_name }}
  cancel-in-progress: false

env:
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  KOWSU_REPO_URL: https://github.com/KOWX712/KernelSU.git
  ANYKERNEL_REPO_URL: https://github.com/yapixel/AnyKernel3
  CLIDR_PATCH_URL: https://raw.githubusercontent.com/infectedmushi/kernel_patches/4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e/fix-clidr-uninitialized.patch
  WIFI_PATCH_URL: https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Workflow Repo 
        uses: actions/checkout@v6

      - name: Setup Build Environment
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev pahole

          mkdir -p /tmp/toolchains

          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" -o /tmp/toolchains/arm64.tar.xz
          tar -xf /tmp/toolchains/arm64.tar.xz -C /tmp/toolchains/
          ARM64_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-aarch64-none-linux-gnu" | head -1)
          echo "ARM64_TOOLCHAIN=${ARM64_DIR}/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz" -o /tmp/toolchains/arm32.tar.xz
          tar -xf /tmp/toolchains/arm32.tar.xz -C /tmp/toolchains/
          ARM32_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-arm-none-linux-gnueabihf" | head -1)
          echo "ARM32_TOOLCHAIN=${ARM32_DIR}/bin/arm-none-linux-gnueabihf-" >> $GITHUB_ENV

      - name: Sync Kernel & SuSFS
        run: |
          git clone --depth=1 --branch="${{ inputs.kernel_ref }}" "${{ env.KERNEL_REPO_URL }}" kernel
          git clone --depth=1 --branch="${{ inputs.susfs_ref }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu

      - name: Setup KowSU KernelSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 --branch="${{ inputs.kowsu_ref }}" "${{ env.KOWSU_REPO_URL }}" KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SuSFS with Local Patches
        if: inputs.disable_susfs != 'true'
        run: |
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/

          cd kernel
          
          patch -p1 --forward < ../.github/patches/kowsu/50_add_susfs_in_gki-android14-6.1.patch || true
          cd KernelSU
          patch -p1 --forward < ../../.github/patches/kowsu/10_enable_susfs_for_ksu.patch || true

      - name: Apply Fix Patches
        run: |
          cd kernel
          rm -f android/abi_gki_protected_exports_* || true
          curl -fsSL "${{ env.CLIDR_PATCH_URL }}" | patch -p1 --forward || true
          curl -fsSL "${{ env.WIFI_PATCH_URL }}" | patch -p1 --forward || true

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"

          make O=out gki_defconfig

          cat <<EOF >> out/.config
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUCOMPAT=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="-deepongi+"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LTO_NONE=y
          EOF

          if [ "${{ inputs.disable_susfs }}" != "true" ]; then
            cat <<'SUSFS_EOF' >> out/.config
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
          fi

          make O=out olddefconfig

          JOBS=$(nproc)
          [ "${{ inputs.force_clean_build }}" = "true" ] && make -j$JOBS O=out clean
          make -j$JOBS O=out Image

      - name: Package Kernel
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..

          git clone --depth=1 "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/ || true

          cd AnyKernel3
          rm -rf .git .github
          ZIP_NAME="${KERNEL_VERSION}-kowsu.zip"
          zip -r9 "../$ZIP_NAME" .
          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-kowsu
          path: ${{ env.KERNEL_ZIP }}

      - name: Create Release
        if: always()
        run: |
          TAG="kowsu-build-${{ github.run_number }}"
          NOTES="KOWSU + SUSFS build #${{ github.run_number }} · $(date -u '+%Y-%m-%d %H:%M UTC')"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ env.KERNEL_ZIP }}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${{ env.KERNEL_ZIP }}" --title "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
