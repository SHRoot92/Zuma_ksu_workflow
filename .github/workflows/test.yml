name: Build Sultan + xxKSU staging test
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  KSU_BRANCH: staging
  GCC_VERSION: "14.2.rel1"
jobs:
  build:
    name: Build gs201 Kernel
    runs-on: ubuntu-latest
    outputs:
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      s_tag: ${{ steps.meta.outputs.s_tag }}
      gcc_version: ${{ steps.meta.outputs.gcc_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install GCC
        run: |
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.GCC_VERSION }}/binrel/"
          ARCHIVE="arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
          wget -q "${BASE_URL}/${ARCHIVE}" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          echo "GCC_PATH=$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
      - name: Clone Source
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh
      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
      
          # Get GCC version - extract just the version number
          GCC_VER_FULL=$(${GCC_PATH}gcc -v 2>&1 | grep "gcc version" | awk '{print $3}')
          GCC_VER=$(echo "$GCC_VER_FULL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      
          # Output variables
          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "gcc_version=$GCC_VER" >> "$GITHUB_OUTPUT"
      
          # Display all metadata
          echo "================================"
          echo "📊 Build Metadata"
          echo "================================"
          echo "🏷️  Sultan Tag: $S_TAG"
          echo "🔧 xxKSU Version: r$K_VER"
          echo "⚙️  GCC Version: $GCC_VER"
          echo "================================"
          echo ""
          echo "=== Detailed GCC Information (for debugging) ==="
          ${GCC_PATH}gcc --version | head -1
          echo "================================"
      - name: KSU & Patches
        working-directory: sultan
        run: |
          # Install KernelSU
          curl -LSs "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/${{ env.KSU_BRANCH }}/kernel/setup.sh" | bash -s -- "${{ env.KSU_BRANCH }}"
          
          # Apply existing patches (ignore failures)
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch || true
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch || true
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch || true
          
          # Apply noinline modifications using sed (reliable, avoids patch context issues)
          echo "📝 Applying noinline modifications..."
          
          # Modify do_faccessat in fs/open.c
          echo "  - Modifying fs/open.c: do_faccessat"
          sed -i 's/^static long do_faccessat(/static noinline long do_faccessat(/' fs/open.c
          if grep -q "^static noinline long do_faccessat" fs/open.c; then
            echo "    ✅ do_faccessat modified"
            grep -n "^static noinline long do_faccessat" fs/open.c
          else
            echo "    ❌ do_faccessat modification failed"
            exit 1
          fi
          
          # Modify vfs_statx in fs/stat.c
          echo "  - Modifying fs/stat.c: vfs_statx"
          sed -i 's/^static int vfs_statx(/static noinline int vfs_statx(/' fs/stat.c
          if grep -q "^static noinline int vfs_statx" fs/stat.c; then
            echo "    ✅ vfs_statx modified"
            grep -n "^static noinline int vfs_statx" fs/stat.c
          else
            echo "    ❌ vfs_statx modification failed"
            exit 1
          fi
          
          echo "✅ All noinline modifications applied successfully"
          
          # Generate corrected patch files for future use
          echo "📝 Generating corrected patch files..."
          
          cat > ../kernel_patches/sultan/0001-modify-do_faccessat-noinline.patch << 'EOF'
          diff --git a/fs/open.c b/fs/open.c
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -421,7 +421,7 @@ static const struct cred *access_override_creds(void)
            return old_cred;
           }
           
          -static long do_faccessat(int dfd, const char __user *filename, int mode, int flags)
          +static noinline long do_faccessat(int dfd, const char __user *filename, int mode, int flags)
           {
            struct path path;
            struct inode *inode;
          EOF
          
          cat > ../kernel_patches/sultan/0002-modify-vfs_statx-noinline.patch << 'EOF'
          diff --git a/fs/stat.c b/fs/stat.c
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -180,7 +180,7 @@ int getname_statx_lookup_flags(int flags)
            *
            * 0 will be returned on success, and a -ve error code if unsuccessful.
            */
          -static int vfs_statx(int dfd, struct filename *filename, int flags,
          +static noinline int vfs_statx(int dfd, struct filename *filename, int flags,
                 struct kstat *stat, u32 request_mask)
           {
            struct path path;
          EOF
          
          echo "✅ Corrected patches generated:"
          ls -la ../kernel_patches/sultan/000*.patch
          
      - name: Global Defconfig Analysis
        working-directory: sultan
        run: |
          echo "=== Scanning All Relevant Defconfigs ==="
          TARGET_DEFS=("gs201_defconfig")
          CHECK_FLAGS=(
            "CONFIG_NETFILTER_ADVANCED"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE"
            "CONFIG_KSU"
          )
          for def in "${TARGET_DEFS[@]}"; do
            CONF_PATH="arch/arm64/configs/$def"
            echo "[*] Checking $def..."
            for flag in "${CHECK_FLAGS[@]}"; do
              grep "$flag" "$CONF_PATH" || echo "  - $flag: missing"
            done
          done
      - name: Inject Configuration (Fortress Deep Unlock)
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig
      
          # Append configuration without comments
          cat >> out/.config << 'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          # CONFIG_TCP_CONG_BIC is not set
          # CONFIG_TCP_CONG_WESTWOOD is not set
          # CONFIG_TCP_CONG_HTCP is not set
          CONFIG_DEFAULT_BBR=y
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          # CONFIG_KSU_ALLOWLIST_WORKAROUND is not set
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          EOF
      
          # Run olddefconfig and suppress warnings
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true
      
      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"
      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          ZIP_NAME="Sultan-gs201-$(date +'%Y%m%d')-xxKSU-r${{ steps.meta.outputs.ksu_ver }}.zip"
          VMLINUX_ZIP_NAME="Sultan-gs201-vmlinux-$(date +'%Y%m%d')-xxKSU-r${{ steps.meta.outputs.ksu_ver }}.zip"
          SYSMAP_ZIP_NAME="Sultan-gs201-System.map-$(date +'%Y%m%d')-xxKSU-r${{ steps.meta.outputs.ksu_ver }}.zip"
          # Main flashable AnyKernel3 zip
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          # vmlinux debug zip
          if [ -f "sultan/out/vmlinux" ]; then
            cp sultan/out/vmlinux ./vmlinux
          elif [ -f "sultan/out/arch/arm64/boot/vmlinux" ]; then
            cp sultan/out/arch/arm64/boot/vmlinux ./vmlinux
          else
            echo "vmlinux not found!"
            echo "Searching for vmlinux candidates..."
            find sultan/out -name "vmlinux" -type f || true
            exit 1
          fi
          zip -9 "$VMLINUX_ZIP_NAME" vmlinux
          # System.map zip
          if [ -f "sultan/out/System.map" ]; then
            cp sultan/out/System.map ./System.map
          else
            echo "System.map not found!"
            echo "Searching for System.map candidates..."
            find sultan/out -name "System.map" -type f || true
            exit 1
          fi
          zip -9 "$SYSMAP_ZIP_NAME" System.map
          echo "ZIP_PATH=$PWD/$ZIP_NAME" >> "$GITHUB_ENV"
          echo "VMLINUX_ZIP_PATH=$PWD/$VMLINUX_ZIP_NAME" >> "$GITHUB_ENV"
          echo "SYSMAP_ZIP_PATH=$PWD/$SYSMAP_ZIP_NAME" >> "$GITHUB_ENV"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Sultan-gs201
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.VMLINUX_ZIP_PATH }}
            ${{ env.SYSMAP_ZIP_PATH }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
      - name: List artifacts (debug)
        run: |
          echo "=== artifacts directory contents ==="
          ls -la ./artifacts/
          echo "=== find zip files ==="
          find ./artifacts -name "*.zip" -type f
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_version }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          # Locate all release zip assets
          ZIP_FILES=$(find ./artifacts -name "*.zip" -type f)
          if [ -z "$ZIP_FILES" ]; then
            echo "No zip files found!"
            exit 1
          fi
          echo "Found zip files:"
          echo "$ZIP_FILES"
          gh release create "$TAG" $ZIP_FILES \
            --title "Kernel Build — $TAG" \
            --notes "
            ### 🚀 Build Information

          | Component | Details |
          | :--- | :--- |
          | **Kernel Base** | Sultan ($S_TAG) |
          | **Manager** | https://github.com/backslashxx/KernelSU |
          | **xxKSU Ver** | \`r$KSU_VER\` |
          | **Compiler** | GCC ($GCC_VER) |

            ### 📦 Release Assets
            - Flashable AnyKernel3 kernel zip
            - Debug symbol archive: \`vmlinux.zip\`
            - Kernel map archive: \`System.map.zip\`
            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v1) + FQ
            - **Routing:** Policy Routing (Table 1066) + IPSet (64k)
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            > Built for Pixel 7 (gs201)."
