name: Build GS201 LineageOS Kernel

on:
  workflow_dispatch: # Allows you to manually trigger the build via the GitHub Actions UI

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzma \
            pinentry-curses python3 python3-pip rsync unzip zip zlib1g-dev \
            libtinfo5

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize Repo Workspace
        run: |
          mkdir workspace
          cd workspace
          
          # Download a local, writable copy of the latest repo tool to bypass permission errors
          mkdir -p bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > bin/repo
          chmod a+x bin/repo
          
          # Add local bin to PATH so the workspace uses it explicitly
          export PATH=$PWD/bin:$PATH
          
          # Initialize using your repository and sync files
          repo init -u https://github.com/yapixel/cheetah_kernel_build.git -b main
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build GS201 Kernel
        run: |
          cd workspace
          
          # Ensure local bin is still in PATH for this step
          export PATH=$PWD/bin:$PATH
          
          # Grant execution permissions to the build script linked by the manifest
          chmod +x build_gs201.sh
          
          # Execute the Tensor G2 compilation script
          ./build_gs201.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gs201-kernel-artifacts
          path: |
            workspace/out/gs201/dist/vendor_kernel_boot.img
            workspace/out/gs201/dist/dtbo.img
            workspace/out/gs201/dist/*.ko
            workspace/out/gs201/dist/vendor_dlkm.img
          if-no-files-found: error
