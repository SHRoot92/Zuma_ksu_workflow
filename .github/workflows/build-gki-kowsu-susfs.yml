name: Build GKI Kernel with KowSU SuSFS

on:
  workflow_dispatch:
    inputs:
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      
      - name: Checkout Workflow Repo
        uses: actions/checkout@v6

      
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential \

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kowsu-${{ github.run_id }}
          restore-keys: ccache-kowsu-

      - name: Setup ccache
        run: ccache --max-size=5G

      - name: Download Toolchains
        run: |
          # Clang
          mkdir -p $HOME/clang
          cd $HOME/clang
          aria2c -s16 -x16 -k1M "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          
          # AArch64 toolchain
          cd $HOME
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "ARM64_TOOLCHAIN=$HOME/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Sync Kernel Source
        run: |
          git clone --depth=1 --branch=android14-6.1-2026-03 \
            https://android.googlesource.com/kernel/common kernel

      - name: Setup KowSU
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 --branch=master https://github.com/KOWX712/KernelSU.git KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SuSFS
        run: |
         # Clone SuSFS
         git clone --depth=1 --branch=gki-android14-6.1-dev \
         https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
    
         # Copy SuSFS core files to kernel
         cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
         cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
         cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/
    
         cd kernel
    
         # Apply core SuSFS kernel patch
         echo "Applying core SuSFS patch..."
         PATCH_FILE="${{ github.workspace }}/.github/patches/50_add_susfs_in_gki-android14-6.1.patch"
         if [ ! -f "$PATCH_FILE" ]; then
         echo "❌ Patch file not found at $PATCH_FILE"
         exit 1
         fi

         patch -p1 < "$PATCH_FILE"
         if [ $? -ne 0 ]; then
         echo "❌ KSU-side SuSFS patch failed!"
         exit 1
         fi
         
         # Apply KSU-side SuSFS patch 
         cd KernelSU
         echo "Applying KSU-side SuSFS patch..."
         PATCH_FILE="${{ github.workspace }}/.github/patches/10_enable_susfs_for_ksu.patch"
         if [ ! -f "$PATCH_FILE" ]; then
         echo "❌ Patch file not found at $PATCH_FILE"
         exit 1
         fi
    
         patch -p1 < "$PATCH_FILE"
         if [ $? -ne 0 ]; then
         echo "❌ KSU-side SuSFS patch failed!"
         exit 1
         fi
    
         cd ../..
    
         echo "✅ SuSFS patches applied successfully!"

      - name: Apply Fixes
        run: |
          cd kernel
          # Remove ABI checks
          rm -f android/abi_gki_protected_exports_* || true
          # Fix clidr
          curl -s https://raw.githubusercontent.com/infectedmushi/kernel_patches/main/fix-clidr-uninitialized.patch | patch -p1 --forward || true

      - name: Configure & Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          
          # 生成默认配置
          make LLVM=1 LLVM_IAS=1 LD=ld.lld O=out gki_defconfig
          
          # 添加自定义配置（强制启用 SuSFS）
          cat << 'EOF' >> out/.config
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LOCALVERSION="-kowsu+"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          
          # 更新配置
          make LLVM=1 LLVM_IAS=1 LD=ld.lld O=out olddefconfig
          
          # 清理构建（如果需要）
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            make -j$(nproc) LLVM=1 LLVM_IAS=1 LD=ld.lld O=out clean
          fi
          
          # 编译内核
          MAKE_JOBS=$(nproc)
          make -j$MAKE_JOBS LLVM=1 LLVM_IAS=1 LD=ld.lld O=out Image
          
          # 验证编译产物
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found! Build failed."
            exit 1
          fi
          
          echo "✅ Kernel built successfully!"

      - name: Package Kernel
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..
          
          # Clone AnyKernel3
          git clone --depth=1 --branch=KowSU https://github.com/deepongi-labs/AnyKernel3-p8a AnyKernel3
          
          # 复制内核镜像
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          
          # 打包
          cd AnyKernel3
          rm -rf .git
          ZIP_NAME="KOWSU-${KERNEL_VERSION}-${{ github.run_number }}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..
          
          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Packaged: $ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kowsu-kernel-${{ github.run_number }}
          path: ${{ env.KERNEL_ZIP }}
          retention-days: 7

      - name: Create Release
        if: inputs.create_release == 'true'
        run: |
          if [ ! -f "${{ env.KERNEL_ZIP }}" ]; then
            echo "❌ No kernel zip found!"
            exit 1
          fi
          
          RELEASE_TAG="kowsu-${{ github.run_number }}"
          RELEASE_NOTES="**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          **Kernel Version:** $(cd kernel && make kernelversion)
          **KOWSU Version:** master
          **SuSFS:** Enabled
          **Clean Build:** ${{ inputs.force_clean_build == 'true' && 'Yes' || 'No' }}

          ## 📦 Download
          Flash in Kernel Flasher or extract boot.img"
          
          gh release create "$RELEASE_TAG" \
            --title "KOWSU Kernel Build #${{ github.run_number }}" \
            --notes "$RELEASE_NOTES" \
            "${{ env.KERNEL_ZIP }}"
        env:
          GH_TOKEN: ${{ github.token }}
