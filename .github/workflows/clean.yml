name: Clean Orphan Tags

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 姣忓懆鏃ュ崍澶滆嚜鍔ㄨ繍琛?
jobs:
  clean-orphan-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Clean orphan tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "馃攳 Fetching all tags and releases..."
          
          # 鑾峰彇鎵€鏈夋湁 Release 鐨?tag锛堜娇鐢?gh CLI锛?          echo "馃搵 Getting tags with releases..."
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort > released_tags.txt || echo "" > released_tags.txt
          
          echo "鉁?Tags with releases:"
          cat released_tags.txt
          echo "---"
          
          # 鑾峰彇鎵€鏈夋湰鍦?tag 骞舵帓搴?          echo "馃彿锔? Getting all tags..."
          git tag -l | sort > all_tags.txt
          
          echo "馃搳 All tags:"
          cat all_tags.txt
          echo "---"
          
          # 楠岃瘉鏂囦欢纭疄宸叉帓搴?          echo "馃敡 Verifying sorted order..."
          if ! sort -c released_tags.txt 2>/dev/null; then
            echo "鈿狅笍  released_tags.txt not sorted, fixing..."
            sort -o released_tags.txt released_tags.txt
          fi
          if ! sort -c all_tags.txt 2>/dev/null; then
            echo "鈿狅笍  all_tags.txt not sorted, fixing..."
            sort -o all_tags.txt all_tags.txt
          fi
          
          # 浣跨敤涓存椂鏂囦欢纭繚鎺掑簭
          sort -o all_tags.txt all_tags.txt
          sort -o released_tags.txt released_tags.txt
          
          echo "馃暤锔? Finding orphan tags..."
          # 鎵惧嚭鍦?all_tags.txt 涓絾涓嶅湪 released_tags.txt 涓殑 tag
          ORPHAN_TAGS=$(comm -23 all_tags.txt released_tags.txt)
          
          if [ -z "$ORPHAN_TAGS" ]; then
            echo "鉁?No orphan tags found! All tags are associated with releases."
            echo "鉁?No orphan tags found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "馃棏锔? Orphan tags to be deleted:"
          echo "$ORPHAN_TAGS"
          echo "---"
          
          # 鍒犻櫎瀛ゅ効 tag
          echo "馃毊 Deleting orphan tags..."
          DELETED_COUNT=0
          FAILED_TAGS=""
          
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "  鉂?Deleting: $tag"
              if git push origin --delete "$tag" 2>/dev/null; then
                ((DELETED_COUNT++))
                echo "     鉁?Successfully deleted"
              else
                echo "     鈿狅笍  Failed to delete: $tag (may already be removed)"
                FAILED_TAGS="$FAILED_TAGS\n- $tag"
              fi
            fi
          done <<< "$ORPHAN_TAGS"
          
          echo "---"
          echo "鉁?Cleanup complete! Deleted $DELETED_COUNT orphan tags."
          
          # 鐢熸垚 GitHub Actions 姝ラ鎽樿
          {
            echo "## 馃Ч Tag Cleanup Report"
            echo ""
            echo "| Status | Tag |"
            echo "|--------|-----|"
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                echo "| 馃棏锔?Deleted | \`$tag\` |"
              fi
            done <<< "$ORPHAN_TAGS"
            echo ""
            echo "**Total orphan tags deleted:** $DELETED_COUNT"
            if [ -n "$FAILED_TAGS" ]; then
              echo ""
              echo "**Failed to delete:**"
              echo -e "$FAILED_TAGS"
            fi
            echo ""
            echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          } >> $GITHUB_STEP_SUMMARY

      - name: Alternative method (using grep)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "馃攧 Trying alternative method using grep..."
          
          # 浣跨敤 grep 鏇夸唬 comm 鏂规硶
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort > released_tags.txt
          git tag -l | sort > all_tags.txt
          
          echo "馃搵 Tags with releases:"
          cat released_tags.txt
          echo "---"
          echo "馃搳 All tags:"
          cat all_tags.txt
          echo "---"
          
          # 鐢?grep 鎵惧嚭瀛ゅ効 tag
          echo "馃暤锔? Finding orphan tags with grep..."
          ORPHAN_TAGS=$(grep -v -x -f released_tags.txt all_tags.txt || true)
          
          if [ -z "$ORPHAN_TAGS" ]; then
            echo "鉁?No orphan tags found!"
            exit 0
          fi
          
          echo "馃棏锔? Orphan tags to be deleted:"
          echo "$ORPHAN_TAGS"
          
          # 鍒犻櫎杩欎簺 tag
          echo "$ORPHAN_TAGS" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "  鉂?Deleting: $tag"
              git push origin --delete "$tag" || echo "     鈿狅笍  Failed to delete: $tag"
            fi
          done

  # 鍙€夌殑锛氱敓鎴愭竻鐞嗗巻鍙茶褰?  log-cleanup:
    needs: clean-orphan-tags
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create cleanup log
        run: |
          DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          WORKFLOW_STATUS="${{ needs.clean-orphan-tags.result }}"
          
          echo "Cleanup Report" > cleanup.log
          echo "==============" >> cleanup.log
          echo "Timestamp: $DATE" >> cleanup.log
          echo "Repository: ${{ github.repository }}" >> cleanup.log
          echo "Workflow Status: $WORKFLOW_STATUS" >> cleanup.log
          echo "Workflow Run ID: ${{ github.run_id }}" >> cleanup.log
          echo "Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> cleanup.log
          
      - name: Upload cleanup log
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cleanup-log-${{ github.run_id }}
          path: cleanup.log
          retention-days: 30
