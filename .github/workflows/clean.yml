name: Clean Orphan Tags

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 每周日午夜自动运行

jobs:
  clean-orphan-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Clean orphan tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Fetching all tags and releases..."
          
          # 获取所有有 Release 的 tag（使用 gh CLI）
          echo "📋 Getting tags with releases..."
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort > released_tags.txt || echo "" > released_tags.txt
          
          echo "✅ Tags with releases:"
          cat released_tags.txt
          echo "---"
          
          # 获取所有本地 tag 并排序
          echo "🏷️  Getting all tags..."
          git tag -l | sort > all_tags.txt
          
          echo "📊 All tags:"
          cat all_tags.txt
          echo "---"
          
          # 验证文件确实已排序
          echo "🔧 Verifying sorted order..."
          if ! sort -c released_tags.txt 2>/dev/null; then
            echo "⚠️  released_tags.txt not sorted, fixing..."
            sort -o released_tags.txt released_tags.txt
          fi
          if ! sort -c all_tags.txt 2>/dev/null; then
            echo "⚠️  all_tags.txt not sorted, fixing..."
            sort -o all_tags.txt all_tags.txt
          fi
          
          # 使用临时文件确保排序
          sort -o all_tags.txt all_tags.txt
          sort -o released_tags.txt released_tags.txt
          
          echo "🕵️  Finding orphan tags..."
          # 找出在 all_tags.txt 中但不在 released_tags.txt 中的 tag
          ORPHAN_TAGS=$(comm -23 all_tags.txt released_tags.txt)
          
          if [ -z "$ORPHAN_TAGS" ]; then
            echo "✨ No orphan tags found! All tags are associated with releases."
            echo "✨ No orphan tags found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "🗑️  Orphan tags to be deleted:"
          echo "$ORPHAN_TAGS"
          echo "---"
          
          # 删除孤儿 tag
          echo "🚮 Deleting orphan tags..."
          DELETED_COUNT=0
          FAILED_TAGS=""
          
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "  ❌ Deleting: $tag"
              if git push origin --delete "$tag" 2>/dev/null; then
                ((DELETED_COUNT++))
                echo "     ✅ Successfully deleted"
              else
                echo "     ⚠️  Failed to delete: $tag (may already be removed)"
                FAILED_TAGS="$FAILED_TAGS\n- $tag"
              fi
            fi
          done <<< "$ORPHAN_TAGS"
          
          echo "---"
          echo "✅ Cleanup complete! Deleted $DELETED_COUNT orphan tags."
          
          # 生成 GitHub Actions 步骤摘要
          {
            echo "## 🧹 Tag Cleanup Report"
            echo ""
            echo "| Status | Tag |"
            echo "|--------|-----|"
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                echo "| 🗑️ Deleted | \`$tag\` |"
              fi
            done <<< "$ORPHAN_TAGS"
            echo ""
            echo "**Total orphan tags deleted:** $DELETED_COUNT"
            if [ -n "$FAILED_TAGS" ]; then
              echo ""
              echo "**Failed to delete:**"
              echo -e "$FAILED_TAGS"
            fi
            echo ""
            echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          } >> $GITHUB_STEP_SUMMARY

      - name: Alternative method (using grep)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Trying alternative method using grep..."
          
          # 使用 grep 替代 comm 方法
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort > released_tags.txt
          git tag -l | sort > all_tags.txt
          
          echo "📋 Tags with releases:"
          cat released_tags.txt
          echo "---"
          echo "📊 All tags:"
          cat all_tags.txt
          echo "---"
          
          # 用 grep 找出孤儿 tag
          echo "🕵️  Finding orphan tags with grep..."
          ORPHAN_TAGS=$(grep -v -x -f released_tags.txt all_tags.txt || true)
          
          if [ -z "$ORPHAN_TAGS" ]; then
            echo "✨ No orphan tags found!"
            exit 0
          fi
          
          echo "🗑️  Orphan tags to be deleted:"
          echo "$ORPHAN_TAGS"
          
          # 删除这些 tag
          echo "$ORPHAN_TAGS" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "  ❌ Deleting: $tag"
              git push origin --delete "$tag" || echo "     ⚠️  Failed to delete: $tag"
            fi
          done

  # 可选的：生成清理历史记录
  log-cleanup:
    needs: clean-orphan-tags
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create cleanup log
        run: |
          DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          WORKFLOW_STATUS="${{ needs.clean-orphan-tags.result }}"
          
          echo "Cleanup Report" > cleanup.log
          echo "==============" >> cleanup.log
          echo "Timestamp: $DATE" >> cleanup.log
          echo "Repository: ${{ github.repository }}" >> cleanup.log
          echo "Workflow Status: $WORKFLOW_STATUS" >> cleanup.log
          echo "Workflow Run ID: ${{ github.run_id }}" >> cleanup.log
          echo "Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> cleanup.log
          
      - name: Upload cleanup log
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-log-${{ github.run_id }}
          path: cleanup.log
          retention-days: 30
