name: Build GKI + xxKSU

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '126'
  KERNEL_NAME: 'android14-11-gfa1d6308d1fe-ab14691759'
  KBUILD_BUILD_USER: "build-user"
  KBUILD_BUILD_HOST: "build-host"
  BUILD_TIMESTAMP: "Fri Jan 9 16:33:46 UTC 2026"
  SCRIPTS_REPO: "https://github.com/TheSillyOk/sh"
  KSU_BRANCH: "master"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies and initialize source repository with LLVM-Clang20 toolchain
        run: |
         rm -rf kernel_workspace
         mkdir kernel_workspace
         cd kernel_workspace

         sudo apt-mark hold firefox || true
         sudo apt-mark hold libc-bin || true
         sudo apt purge -y man-db || true
         sudo rm -rf /var/lib/man-db/auto-update || true

         sudo apt update
         sudo apt-get install -y --no-install-recommends \
          binutils \
          python-is-python3 \
          libssl-dev \
          libelf-dev \
          aria2 \
          zstd \
          unzip \
          wget \
          pahole \
          zip \
          gcc-aarch64-linux-gnu

         echo "Downloading GKI source..."
         aria2c -s16 -x16 -k1M \
          "https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r14.tar.gz" \
          -o common.tar.gz

         mkdir -p common
         tar -xzf common.tar.gz -C common
         rm -f common.tar.gz

         echo "Downloading Clang..."
         # 下载并解压，不指定目录，让 tar 自动创建
         aria2c -s16 -x16 -k1M \
          "https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz" \
         -o clang.tar.gz
    
         # 解压并查看目录结构
         tar -xzf clang.tar.gz
         rm -f clang.tar.gz
    
         # 查找 clang 目录（通常是 Clang-* 格式）
         CLANG_DIR=$(find . -maxdepth 1 -type d -name "Clang-*" | head -1)
         if [ -z "$CLANG_DIR" ]; then
          echo "Error: Cannot find Clang directory"
         ls -la
         exit 1
         fi
    
         CLANG_BIN="$(realpath "$CLANG_DIR")/bin"
         if [ ! -f "$CLANG_BIN/clang" ]; then
         echo "Error: clang not found in $CLANG_BIN"
         ls -la "$CLANG_DIR"
         exit 1
         fi
    
         echo "Clang installed successfully:"
         $CLANG_BIN/clang --version
    
         # 验证 ARM64 支持
         echo "Checking ARM64 support:"
         $CLANG_BIN/clang -target aarch64-linux-gnu --version || echo "ARM64 target available"
    
         echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV

         echo "Downloading build tools..."
         mkdir -p build-tools
         aria2c -s16 -x16 -k1M \
           "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip" \
         -o build-tools.zip
         unzip -q build-tools.zip -d build-tools
         rm -f build-tools.zip

         echo "Source and toolchain initialization completed."

         echo "Removing ABI protection and dirty suffix..."
         rm -f common/android/abi_gki_protected_exports_* || true

         for f in common/scripts/setlocalversion; do
          [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
          [ -f "$f" ] && sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
         done

         echo "Current disk space:"
         df -h

         echo "Current kernel version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"

      - name: Setup xxKSU
        id: ksu_version
        run: |
          
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh
          chmod +x ./sh/*.sh 2>/dev/null || true

          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
          
          echo "ksuver=$K_VER" >> $GITHUB_OUTPUT
          echo "KSUVER=$K_VER" >> $GITHUB_ENV
          echo "xxKSU version: $K_VER"

          
          cd kernel_workspace/common
          echo "Cloning xxKSU..."
          git clone --depth=1 --branch=${{ env.KSU_BRANCH }} https://github.com/backslashxx/KernelSU.git KernelSU

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          KSU_MAKEFILE="drivers/kernelsu/Makefile"
          if [ -f "$KSU_MAKEFILE" ]; then
            echo "" >> "$KSU_MAKEFILE"
            echo "CFLAGS_ksu.o += -DKSU_VERSION=$K_VER" >> "$KSU_MAKEFILE"
          fi

      - name: Integrate xxKSU
        run: |
          cd kernel_workspace/common
          patch -p1 -l  < "${{ github.workspace }}/.github/patches/xxksu/scope-min-manual-hooks-v2.2.patch"

      - name: Inject Kernel configuration
        run: |
          cd kernel_workspace

          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          cat >> $DEFCONFIG <<-'EOF'
          # Core Bootability & Performance
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_ANDROID_BINDER_IPC_RUST=m
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # Networking Configuration
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y

          # IPSet & TProxy Suite
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
        
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=n
          CONFIG_KSU_KPROBES_KSUD=n
          EOF

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add kernel version suffix
        run: |
          cd kernel_workspace

          echo "Replacing kernel version suffix..."

          SUFFIX="${{ env.KERNEL_NAME }}"

          echo "Current kernel version suffix: $SUFFIX"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
          done

      - name: Build kernel
        run: |
          WORKDIR="$(pwd)"
          
          if [ -z "$CLANG_BIN" ]; then
            echo "Error: CLANG_BIN environment variable not set"
            exit 1
          fi
          
          if [ ! -d "$CLANG_BIN" ]; then
            echo "Error: Clang directory not found at $CLANG_BIN"
            exit 1
          fi
          
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$CLANG_BIN:$PATH"
          
          echo "Using Clang from: $CLANG_BIN"
          clang --version
          
          cd kernel_workspace/common
          
          ROOT_REAL_PATH=$(readlink -f "$PWD")
          export KCFLAGS="-O2 -Wno-error -fdebug-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=."
          
          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
          export KBUILD_GENDWARFKSYMS_STABLE=1
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out Image
          
          echo "Kernel build completed."
          
          df -h

      - name: Clone AnyKernel3 and package kernel
        run: |
          cd kernel_workspace

          git clone https://github.com/cctv18/AnyKernel3 --depth=1

          rm -rf ./AnyKernel3/.git

          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          KSU_VER="$KSUVER"
          [ -z "$KSU_VER" ] && KSU_VER="${{ steps.ksu_version.outputs.ksuver }}"
          [ -z "$KSU_VER" ] && KSU_VER="unknown"

          ZIP_NAME="AK3_xxKSU_${KSU_VER}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip"

          zip -r9 "../${ZIP_NAME}" ./*

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          echo "Packaging completed: ${ZIP_NAME}"

      - name: Upload AnyKernel3 flashable package
        uses: actions/upload-artifact@v4
        with:
          name: AK3_${{ env.KERNEL_VERSION }}_xxKSU
          path: kernel_workspace/AK3_*.zip
