name: Build GKI + xxKSU 

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master
  GCC_VERSION: "14.3.rel1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      gcc_ver: ${{ steps.meta.outputs.gcc_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download and setup Clang 
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
         
          # Download Clang from ZyCromerZ
          #wget https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz -O clang.tar.gz
          wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
         
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Download ARM64 GNU Toolchain 14.3.rel1
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 GNU Toolchain 14.3.rel1
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          aria2c -s16 -x16 -k1M "https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r13.tar.gz" -o common.tar.gz
          mkdir -p sultan && tar -xzf common.tar.gz -C sultan && rm common.tar.gz
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b gki-2.0 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply build-reproducibility patches
        working-directory: sultan
        run: |
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do
            [ -f "$p" ] && patch -p1 < "$p" || echo "Optional patch $p skipped."
          done

      - name: Collect build metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan rev-parse --short HEAD)
          chmod +x sh/get_ksuver.sh
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "integrated")
          
          # 修复提取 GCC 版本时的环境变量错误
          G_VER=$($HOME/toolchains/arm-gnu-toolchain-*/bin/aarch64-none-linux-gnu-gcc --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          echo "--- LOGGING METADATA ---"
          echo "ksu_version: $K_VER"
          echo "gcc_version: $G_VER"
          echo "sultan_commit: $S_TAG"
          echo "------------------------"
          
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "gcc_ver=${G_VER}" >> "$GITHUB_OUTPUT"

      - name: Setup xxKSU
        run: |
          cd sultan
          git clone --branch=master https://github.com/backslashxx/KernelSU.git KernelSU
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup atp4pixel Config Pillars
        run: |
          cd sultan
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          echo "" >> "$DEFCONFIG"

          cat <<EOF >> "$DEFCONFIG"
          # KernelSU Core (Source Integrated)
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y

          # Networking & System Pillars
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_INODE64=y
          EOF

          # Guardrails
          sed -i 's/CONFIG_TCP_CONG_BIC=y/CONFIG_TCP_CONG_BIC=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_TCP_CONG_WESTWOOD=y/CONFIG_TCP_CONG_WESTWOOD=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_TCP_CONG_HTCP=y/CONFIG_TCP_CONG_HTCP=n/' "$DEFCONFIG"
          echo "CONFIG_WERROR=n" >> "$DEFCONFIG"

      - name: Build Kernel (Production)
        working-directory: sultan
        run: |
          # 显式使用下载的 Clang22 和 GCC14 交叉工具链参数进行编译
          make O=out ARCH=arm64 gki_defconfig
          make O=out -j"$(nproc --all)" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package AnyKernel3
        id: package
        run: |
          if [ -f sultan/out/arch/arm64/boot/Image.lz4 ]; then
            cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          else
            cp sultan/out/arch/arm64/boot/Image AK3/Image
          fi
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          
          # 去除了 SUSFS 相关文件后缀命名
          ZIP_NAME="Sultan-gs201-${S_TAG}-xxKSU-r${K_VER}.zip"
          ( cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*" )
          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v7
        with:
          name: gs201-kernel
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          K_VER: ${{ needs.build.outputs.ksu_ver }}
          S_TAG: ${{ needs.build.outputs.sultan_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_ver }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          gh release create "$TAG" artifacts/*.zip \
            --title "Kernel Build — $TAG" \
            --notes "
            ### 🚀 Build Information
            | Component | Details |
            | :--- | :--- |
            | **Kernel Base** | GKI ($S_TAG) |
            | **Manager** | [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU) |
            | **xxKSU Ver** | \`r$K_VER\` |
            | **Compiler** | GCC $GCC_VER / Clang 22 |
            
            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v1) + FQ
            - **Routing:** Policy Routing (Table 1066) + IPSet (64k)
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            
            > Built for Pixel 7 (gs201)."
