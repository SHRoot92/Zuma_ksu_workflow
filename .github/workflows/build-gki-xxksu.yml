name: Build GKI + xxKSU 

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master
  GCC_VERSION: "14.3.rel1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      gcc_ver: ${{ steps.meta.outputs.gcc_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev libssl-dev libbpf-dev dwarves aria2 zip ccache

      - name: Download and setup Clang 23
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Download ARM64 GNU Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.GCC_VERSION }}/binrel/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz" -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Download ARM32 GNU Toolchain
        run: |
          cd $HOME/toolchains
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.GCC_VERSION }}/binrel/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-arm-none-eabi.tar.xz" -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          aria2c -s16 -x16 -k1M "https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-03_r13/common-android14-6.1-2026-03_r13.tar.gz" -o common.tar.gz
          mkdir -p common && tar -xzf common.tar.gz -C common && rm common.tar.gz
          
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b gki-2.0 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply build-reproducibility patches
        working-directory: common
        run: |
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do
            [ -f "$p" ] && patch -p1 < "$p" || echo "Optional patch $p skipped."
          done

      - name: Collect build metadata
        id: meta
        run: |
          S_TAG=$(git -C common rev-parse --short HEAD)
          chmod +x sh/get_ksuver.sh
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "integrated")
          
          G_VER=$("${{ env.ARM64_TOOLCHAIN }}gcc" --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          echo "--- LOGGING METADATA ---"
          echo "ksu_version: $K_VER"
          echo "gcc_version: $G_VER"
          echo "sultan_commit: $S_TAG"
          echo "------------------------"
          
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "gcc_ver=${G_VER}" >> "$GITHUB_OUTPUT"

      - name: Setup xxKSU
        working-directory: common
        run: |
          git clone --branch=master https://github.com/backslashxx/KernelSU.git KernelSU
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup atp4pixel Config Pillars
        working-directory: common
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # 先移除可能冲突的已有 KSU 配置
          sed -i '/^CONFIG_KSU=/d' "$DEFCONFIG"
          echo "" >> "$DEFCONFIG"

          cat <<EOF >> "$DEFCONFIG"
          # 抹平内核版本后缀，维持原厂 vermagic 兼容性
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n

          # 强制关闭模块符号版本与签名校验（允许加载原厂 vendor 分区未签名的驱动）
          CONFIG_MODVERSIONS=n
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          CONFIG_MODULE_SIG_ALL=n

          # KernelSU 核心配置
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y

          # 网络与系统增强组件 (atp4pixel Pillars)
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_INOTIFY_USER=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Android 14 核心要求的 BTF 调试信息开关（防止 bpfloader 崩溃卡开机）
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_REDUCED=n
          CONFIG_DEBUG_INFO_COMPRESSED_NONE=y

          # 优化选项（与 BTF 完美共存的 ThinLTO 模式）
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_LTO_CLANG_FULL=n
          CONFIG_LTO_NONE=n
          EOF

          # 清理传统拥塞控制算法
          sed -i 's/CONFIG_TCP_CONG_BIC=y/CONFIG_TCP_CONG_BIC=n/' "$DEFCONFIG"
          sed -i 's/CONFIG_TCP_CONG_WESTWOOD=y/CONFIG_TCP_CONG_WESTWOOD=n/' "$DEFCONFIG"
          echo "CONFIG_WERROR=n" >> "$DEFCONFIG"

      - name: Build Kernel (Production)
        working-directory: common
        run: |
          # 显式导出完整的 LLVM/Clang 工具链环境变量
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export READELF="llvm-readelf"
          export STRIP="llvm-strip"
          
          # 1. 释放基础配置
          make O=out ARCH=arm64 gki_defconfig
          
          # 2. 检查、对齐并合并附加的 Kconfig 参数
          make O=out ARCH=arm64 olddefconfig
          
          # 3. 严格断言校验（避免编译出卡引导的坏包）
          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::error::CONFIG_KSU 未能在同步配置后存活！"
            exit 1
          fi
          if ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' out/.config; then
            echo "::error::CONFIG_DEBUG_INFO_BTF 未生效！Android 14 的 bpfloader 将会循环报错导致 bootloop。"
            exit 1
          fi
          
          # 4. 执行全核并行编译
          make O=out -j"$(nproc --all)" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}"

      - name: Package AnyKernel3
        id: package
        run: |
          cp common/out/arch/arm64/boot/Image AK3/Image
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          
          ZIP_NAME="GKI-gs201-${S_TAG}-xxKSU-r${K_VER}.zip"
          ( cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*" )
          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gs201-kernel
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: gs201-kernel
          path: ./artifacts

      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          K_VER: ${{ needs.build.outputs.ksu_ver }}
          S_TAG: ${{ needs.build.outputs.sultan_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_ver }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          gh release create "$TAG" artifacts/*.zip \
            --title "Kernel Build — $TAG" \
            --notes "
            ### Build Information
            | Component | Details |
            | :--- | :--- |
            | **Kernel Base** | GKI ($S_TAG) |
            | **Manager** | [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU) |
            | **xxKSU Ver** | \`r$K_VER\` |
            | **Compiler** | GCC $GCC_VER / Clang 23 |
            
            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v1) + FQ
            - **Routing:** Policy Routing (Table 1066) + IPSet (64k)
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            
            > Built for Pixel 7 (gs201)."
