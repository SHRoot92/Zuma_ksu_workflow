name: Build GKI Kernel with xxKSU Staging
on:
  workflow_dispatch:
    inputs:
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean
      debug:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  packages: write
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      force_clean: ${{ steps.config.outputs.force_clean }}
      build_start_time: ${{ steps.timestamp.outputs.start_time }}
      create_release: ${{ steps.config.outputs.create_release }}
    steps:
      - name: Record Build Start Time
        id: timestamp
        run: |
          echo "WORKFLOW_START_TIME=$(date +%s)" >> $GITHUB_ENV
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          echo "::notice::Workflow started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
      - name: Set Build Config
        id: config
        run: |
          echo "force_clean=${{ github.event.inputs.force_clean_build }}" >> $GITHUB_OUTPUT
          echo "create_release=${{ github.event.inputs.create_release }}" >> $GITHUB_OUTPUT
  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Free Disk Space & Install Build Dependencies
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo apt-get purge -yq \
            '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
            'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel libgl1-mesa-dri \
            'ghc-*' 'cabal-install' \
            || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/local/graalvm \
            "$AGENT_TOOLSDIRECTORY"
          docker image prune -af 2>/dev/null || true
          sudo apt-get autoremove -yq
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== Disk after cleanup ==="
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            build-essential binutils-aarch64-linux-gnu \
            python3 python3-pip rsync \
            ccache curl zip unzip git \
            libncurses-dev gawk openssl \
            dwarves zstd pahole
          echo "Dependencies installed"
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-backslashxx-pixel7-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-backslashxx-pixel7-${{ github.ref_name }}-
            ccache-backslashxx-pixel7-
      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=sloppiness="pch_defines,time_macros,file_macro,include_file_mtime,include_file_ctime"
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          echo "ccache version: $(ccache --version | head -1)"
      - name: Download & Verify Clang Toolchain
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "CLANG_BIN=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH
      - name: Download & Verify AArch64 GNU Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*aarch64*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
          echo "AArch64 toolchain ready"
      - name: Download & Verify ARM32 GNU Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV
          echo "ARM32 toolchain ready"
      - name: Pre-Clean Build Artifacts
        run: |
          echo "Cleaning previous build artifacts..."
          rm -rf AnyKernel3 release-assets changelogs kernel_patches || true
      - name: Checkout Workflow Repo
        uses: actions/checkout@v6.0.2
        with:
          clean: false
      - name: Download and Extract Kernel Source
        run: |
          echo "Downloading kernel source for Pixel 7 from pre-built archive..."
          rm -rf kernel
          
          wget -q --show-progress \
            https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-03_r13/common-android14-6.1-2026-03_r13.tar.gz \
            -O kernel-source.tar.gz
          
          mkdir -p kernel
          tar -xzf kernel-source.tar.gz -C kernel
          rm -f kernel-source.tar.gz
          
          if [ ! -f "kernel/Makefile" ]; then
            echo "Error: Makefile not found in kernel directory!"
            exit 1
          fi
      - name: Clone Kernel Patches Repository
        run: |
          echo "Cloning kernel patches repository..."
          git clone --depth=1 https://github.com/yapixel/kernel_patches.git
      - name: Store Kernel Version Info
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3)
          KERNEL_SUBLEVEL=$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          KERNEL_FULL_VERSION="${KERNEL_VERSION}.${KERNEL_SUBLEVEL}"
          
          echo "KERNEL_VERSION=$KERNEL_FULL_VERSION" >> $GITHUB_ENV
          echo "KERNEL_MAKE_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          
          if [ -d ".git" ]; then
            K_SHORT=$(git log -1 --format="%h")
            K_MSG=$(git log -1 --format="%s")
            echo "KERNEL_COMMIT_SHORT=$K_SHORT" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_MSG=$K_MSG" >> $GITHUB_ENV
          else
            echo "KERNEL_COMMIT_SHORT=archive" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_MSG=Kernel from pre-built archive (android14-6.1-2026-03_r13)" >> $GITHUB_ENV
          fi
      - name: Show CCACHE Status
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true
      - name: Setup KernelSU (backslashxx)
        run: |
          cd kernel
          rm -rf KernelSU drivers/kernelsu
          
          git clone --depth=1 --branch=staging https://github.com/backslashxx/KernelSU.git KernelSU
          
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          echo "KSU_REPO=backslashxx/KernelSU" >> $GITHUB_ENV
          echo "KSU_BRANCH=master" >> $GITHUB_ENV
      - name: Get KSU Version Info
        run: |
          cd kernel/KernelSU
          git fetch --unshallow --quiet 2>/dev/null || true
          
          KSU_COUNT=$(git rev-list --count HEAD)
          KSU_VERSION=$((KSU_COUNT + 30000))
          
          KSU_C_SHORT=$(git log -1 --format="%h")
          KSU_C_MSG=$(git log -1 --format="%s")
          
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KSU_COMMIT_SHORT=$KSU_C_SHORT" >> $GITHUB_ENV
          echo "KSU_COMMIT_MSG=$KSU_C_MSG" >> $GITHUB_ENV
      - name: Apply Sultan Patches
        run: |
          cd kernel
          if [ ! -f "../kernel_patches/sultan/60_scripts_mkcompile_h.patch" ] || \
             [ ! -f "../kernel_patches/sultan/61_scripts_setlocalversion.patch" ] || \
             [ ! -f "../kernel_patches/sultan/62_init_Makefile.patch" ]; then
            echo "Error: Critical Sultan patch files missing!"
            exit 1
          fi
          
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch || exit 1
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch || exit 1
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch || exit 1
      - name: Apply Vendor Module CRC Patch
        run: |
          cd kernel
          if [ -f "../kernel_patches/cheetah/dirty_allow_vendor_module_crcs.patch" ]; then
            patch -p1 < ../kernel_patches/cheetah/dirty_allow_vendor_module_crcs.patch || exit 1
          elif [ -f "../kernel_patches/dirty_allow_vendor_module_crcs.patch" ]; then
            patch -p1 < ../kernel_patches/dirty_allow_vendor_module_crcs.patch || exit 1
          elif [ -f "../.github/patches/dirty_allow_vendor_module_crcs.patch" ]; then
            patch -p1 < ../.github/patches/dirty_allow_vendor_module_crcs.patch || exit 1
          else
            echo "Error: dirty_allow_vendor_module_crcs.patch not found in local directories!"
            exit 1
          fi
      - name: Generate Changelog
        if: needs.setup.outputs.create_release == 'true'
        run: |
          mkdir -p changelogs
          CHANGELOG_FILE="changelogs/CHANGELOG-backslashxx-pixel7.md"
          
          cat > "$CHANGELOG_FILE" << EOF
          # Kernel Build Changelog - Pixel 7 Series
          
          **Device:** Pixel 7, 7 Pro, 7a
          **Variant:** backslashxx (KernelSU)
          **Build Number:** #${{ github.run_number }}
          **KernelSU Version:** r${{ env.KSU_VERSION }}
          **Kernel Source:** android14-6.1-2026-03_r13 (pre-built archive)
          
          ---
          ## Component Versions

          | Component | Version/Commit | Summary |
          | :--- | :--- | :--- |
          | **KernelSU** | \`${{ env.KSU_COMMIT_SHORT }}\` | ${{ env.KSU_COMMIT_MSG }} |
          | **Kernel** | ${{ env.KERNEL_VERSION }} | ${{ env.KERNEL_COMMIT_MSG }} |

          ---
          ## Applied Patches
          - Sultan: 60_scripts_mkcompile_h.patch
          - Sultan: 61_scripts_setlocalversion.patch
          - Sultan: 62_init_Makefile.patch
          - Core: dirty_allow_vendor_module_crcs.patch
          
          ---
          ## Fortress Deep Unlock - Configuration Pillars
          
          ### Core System & FS
          - TMPFS XATTR/POSIX ACL support
          - Extended log buffer (21)
          
          ### Pillar 1: atp4pixel / Advanced Networking
          - Netfilter advanced features
          - TTL/HL target support
          - BPF stream parser
          - TPROXY/REDIRECT targets
          - Socket/Mark/IP range/MAC/ConnTrack matching
          
          ### Pillar 2: Google VPN (XFRM) Coexistence
          - XFRM algorithms and user support
          - IP compression and ESP
          - XFRM tunnel modes and statistics
          
          ### Pillar 3: IPSet Full Suite
          - Full IPSet support (bitmap, hash, list sets)
          - Maximum 65534 entries
          - All hash types enabled
          
          ### Pillar 4: TCP Congestion & BBR
          - BBR as default congestion control
          - FQ queue discipline
          - Advanced TCP congestion options
          
          ### Pillar 5: KernelSU (Hookless / LSM)
          - KernelSU with extras
          - LSM security hooks
          - Throne tracker threaded mode
          - Tamper syscall table protection
          
          ### Security & Cgroups
          - Network security hooks
          - Full cgroup support (BPF, PIDS, Freezer, SCHED)
          - Inotify user support
          
          EOF
          
          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> $GITHUB_ENV
      - name: Apply Source Fixes
        run: |
          cd kernel
          rm -f android/abi_gki_protected_exports_* || true
          
          if [ -f "../kernel_patches/fix-clidr-uninitialized.patch" ]; then
            patch -p1 --forward < ../kernel_patches/fix-clidr-uninitialized.patch 2>/dev/null || true
          fi
          
          sed -i 's/next_path = strchr(s, ":")/next_path = (char *)strchr(s, ":")/' tools/lib/bpf/libbpf.c 2>/dev/null || true
          echo "Source fixes applied"
      - name: Inject Configuration (Fortress Deep Unlock) for Pixel 7
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          export CC="clang"
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out gki_defconfig
          
          cat >> out/.config << 'EOF'
          # --- Core System & FS ---
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOG_BUF_SHIFT=21
          
          # --- Pixel 7 Tensor G2 Optimizations ---
          CONFIG_ARM64_CORTEX_X1=y
          CONFIG_ARM64_CORTEX_A78=y
          CONFIG_ARM64_CORTEX_A55=y
          CONFIG_ARM64_VA_BITS=48
          CONFIG_ARM64_PA_BITS=48
          CONFIG_SCHED_MC=y
          CONFIG_SCHED_CORE=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          
          
          CONFIG_LOCALVERSION_AUTO=n
          
          # --- Pillar 1: atp4pixel / Advanced Networking ---
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          
          # --- Pillar 2: Google VPN (XFRM) Coexistence ---
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          
          # --- Pillar 3: IPSet Full Suite ---
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          
          # --- Pillar 4: TCP Congestion & BBR ---
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_BBR=y
          
          # --- Pillar 5: KernelSU (Hookless / LSM) ---
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          
          # --- Security & Cgroups ---
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          
          # --- Additional Optimizations ---
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_REDUCED=n
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_LTO_CLANG_FULL=n
          CONFIG_LTO_NONE=n
          CONFIG_WERROR=n
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          CONFIG_MODULE_SIG_ALL=n
          EOF
          
          # 像素级同步参考脚本：直接用 sed 物理干掉 setlocalversion 脚本中的加号自动追加
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld O=out olddefconfig
          
          # 安全校验层：检查 KSU 强开是否在中途被冲突底层剔除
          if ! grep -q "CONFIG_KSU=y" out/.config; then
            echo "Error: KSU setup mismatch in final configuration!"
            exit 1
          fi
          grep -E "CONFIG_KSU|CONFIG_IP_SET|CONFIG_TCP_CONG_BBR|CONFIG_XFRM_USER|CONFIG_LOCALVERSION" out/.config || true
      - name: Build Kernel
        run: |
          cd kernel
          
          # 完全同步参考脚本的环境变量与全局 KCFLAGS 策略
          export ARCH=arm64
          export CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}"
          export CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CC="ccache clang"
          export CXX="ccache clang++"
          
          export KCFLAGS="-w"
          
          MAKE_JOBS=$(nproc)
          
          if [ "${{ needs.setup.outputs.force_clean }}" = "true" ]; then
            make -j$MAKE_JOBS LLVM=1 LLVM_IAS=1 LD=ld.lld O=out clean
          fi
          
          make -j$MAKE_JOBS \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CC="$CC" \
            LD=ld.lld \
            HOSTLD=ld.lld \
            O=out
      - name: Package Kernel (AnyKernel3)
        run: |
          cd kernel
          KERNEL_VERSION=$(grep "^VERSION" Makefile | cut -d' ' -f3).$(grep "^PATCHLEVEL" Makefile | cut -d' ' -f3).$(grep "^SUBLEVEL" Makefile | cut -d' ' -f3)
          cd ..
          
          echo "Cloning AnyKernel3 from WildKernels (gki-2.0 branch)..."
          git clone --depth=1 --branch=gki-2.0 https://github.com/WildKernels/AnyKernel3.git AnyKernel3
          
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/
          
          cd AnyKernel3
          rm -rf .git .github
          ZIP_NAME="AK3-gs201-${KERNEL_VERSION}-xxksu-r${{ env.KSU_VERSION }}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..
          
          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-backslashxx-pixel7-${{ github.run_number }}
          path: |
            ${{ env.KERNEL_ZIP }}
            ${{ env.CHANGELOG_FILE }}
  create_release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    if: always() && needs.setup.outputs.create_release == 'true' && needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: kernel-backslashxx-pixel7-${{ github.run_number }}
          path: release-assets
      - name: Create GitHub Release for Pixel 7
        run: |
          cd release-assets
          if ! ls *.zip 1> /dev/null 2>&1; then
            echo "Error: No ZIP artifacts found! Skipping release."
            exit 1
          fi
          
          RELEASE_NOTES="**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Device:** Pixel 7, Pixel 7 Pro, Pixel 7a
          **KernelSU:** backslashxx (master branch)
          **Kernel Source:** android14-6.1-2026-03_r13 (pre-built archive)
          **AnyKernel3:** WildKernels/AnyKernel3 (gki-2.0 branch)
          **Applied Patches:** Sultan (mkcompile_h, setlocalversion, init Makefile)
          
          ### Fortress Deep Unlock - Feature Pillars
          
          **Tensor G2 Optimizations**
          - Cortex-X1, A78, A55 CPU optimizations
          - 48-bit VA/PA support
          - Energy Model and Schedutil governor
          
          **Pillar 1 - Advanced Networking (atp4pixel)**
          - Netfilter with TPROXY/REDIRECT support
          - BPF stream parser for high-performance filtering
          - Full packet matching (MAC, Owner, IP range, ConnTrack)
          
          **Pillar 2 - Google VPN Coexistence (XFRM)**
          - Full XFRM support for VPN compatibility
          - IP compression and ESP tunnels
          
          **Pillar 3 - Complete IPSet Suite**
          - All hash/bitmap/list set types enabled
          - Support for 65k+ entries
          
          **Pillar 4 - TCP Optimization**
          - BBR as default congestion control
          - FQ queue discipline
          
          **Pillar 5 - KernelSU (Hookless)**
          - LSM security hooks
          - Throne tracker threaded mode
          - Syscall table tamper protection
          
          **Security & System**
          - Full cgroup support (BPF, PIDS, Freezer)
          - BTF debug info for Android 14
          - ThinLTO optimizations
          
          ### Supported Devices
          - Pixel 7 (cheetah)
          - Pixel 7 Pro (panther)
          - Pixel 7a (lynx)
          
          Flash ZIP in Kernel Flasher or extract Image to patch boot.img manually."
          
          gh release create "build-pixel7-${{ github.run_number }}" \
            --title "Fortress Deep Unlock Kernel for Pixel 7 #${{ github.run_number }} (backslashxx)" \
            --notes "$RELEASE_NOTES" \
            --repo "${{ github.repository }}" \
            ./*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
