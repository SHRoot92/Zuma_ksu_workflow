name: Build GKI + xxKSU

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_DIR: common
  OUT_DIR: out

  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh

  KSU_REPO: backslashxx/KernelSU
  KSU_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Setup Clang 22
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang

          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

          CLANG_DIR=$(ls)
          echo "CLANG_PATH=$HOME/clang/$CLANG_DIR/bin" >> $GITHUB_ENV
          echo "$HOME/clang/$CLANG_DIR/bin" >> $GITHUB_PATH

      - name: Setup ARM64 Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains

          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz

          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Setup ARM32 Toolchain
        run: |
          cd $HOME/toolchains

          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz

          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV

      - name: Clone Source
        run: |
          aria2c -s16 -x16 -k1M \
            https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r11.tar.gz \
            -o common.tar.gz

          mkdir common
          tar -xzf common.tar.gz -C common

          git clone --depth=1 $ANYKERNEL_REPO -b gki-2.0 AK3
          git clone --depth=1 $PATCHES_REPO kernel_patches
          git clone --depth=1 $SCRIPTS_REPO sh

      - name: Apply KSU & patches
        working-directory: common
        run: |
          curl -LSs https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh | bash -s -- ${KSU_BRANCH}

          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch
          patch -p1 < ../kernel_patches/xxksu/scope_minimized_manual_hooks_v2_1_for_android14_6_1_2026_03_r11.patch

      - name: Inject Configuration
        working-directory: common
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$ARM64_TOOLCHAIN" \
            CROSS_COMPILE_COMPAT="$ARM32_TOOLCHAIN" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            gki_defconfig

          cat >> out/.config <<EOF
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_KSU=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          EOF

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE="$ARM64_TOOLCHAIN" \
            CROSS_COMPILE_COMPAT="$ARM32_TOOLCHAIN" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            olddefconfig

      - name: Build Kernel
        working-directory: common
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$ARM64_TOOLCHAIN" \
            CROSS_COMPILE_COMPAT="$ARM32_TOOLCHAIN" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            LD=ld.lld \
            HOSTLD=ld.lld \
            O=out

      - name: Package
        run: |
          cp common/out/arch/arm64/boot/Image AK3/Image
          cat common/out/google-devices/gs201/dts/*.dtb > AK3/dtb || true

          ZIP=gki-xxksu-$(date +%Y%m%d).zip
          (cd AK3 && zip -r9 ../$ZIP .)

          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: ${{ env.ZIP }}
