name: Build GKI + xxKSU

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_NAME: 'android14-11-gfa1d6308d1fe-ab14691759'
  KBUILD_BUILD_USER: "build-user"
  KBUILD_BUILD_HOST: "build-host"
  BUILD_TIMESTAMP: "Fri Jan 9 16:33:46 UTC 2026"
  SCRIPTS_REPO: "https://github.com/TheSillyOk/sh"
  KSU_BRANCH: "master"
  GCC_VERSION: "14.2.rel1"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies and initialize source repository
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update || true

          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            aria2 \
            zstd \
            unzip \
            wget \
            pahole \
            zip

          echo "Downloading GKI source..."
             aria2c -s16 -x16 -k1M \
            "https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r14.tar.gz" \
            -o common.tar.gz

          
          mkdir -p common
          tar -xzf common.tar.gz  -C common
          rm -f common.tar.gz
          
          # 从内核源码动态提取版本号
          echo "Extracting kernel version from source..."
          cd common
          
          KERNEL_V=$(grep -E '^VERSION =' Makefile | awk '{print $3}' | tr -d '\r')
          KERNEL_P=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}' | tr -d '\r')
          KERNEL_S=$(grep -E '^SUBLEVEL =' Makefile | awk '{print $3}' | tr -d '\r')
          
          if [ -z "$KERNEL_V" ] || [ -z "$KERNEL_P" ]; then
            echo "Error: Failed to extract kernel version from Makefile"
            cat Makefile | grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ='
            exit 1
          fi
          
          KERNEL_S=${KERNEL_S:-0}
          
          KERNEL_VERSION_FULL="${KERNEL_V}.${KERNEL_P}"
          KERNEL_VERSION_FULL_WITH_SUB="${KERNEL_V}.${KERNEL_P}.${KERNEL_S}"
          
          echo "KERNEL_VERSION=${KERNEL_VERSION_FULL}" >> $GITHUB_ENV
          echo "KERNEL_VERSION_FULL=${KERNEL_VERSION_FULL_WITH_SUB}" >> $GITHUB_ENV
          
          echo "Detected kernel version: ${KERNEL_VERSION_FULL_WITH_SUB}"
          
          cd ..

          echo "Downloading Clang..."
          mkdir -p clang
          aria2c -s16 -x16 -k1M \
            "https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          
          if [ -f "$PWD/clang/bin/clang" ]; then
            CLANG_BIN="$PWD/clang/bin"
          else
            CLANG_BIN=$(find "$PWD/clang" -type d -name "bin" | head -1)
            if [ -z "$CLANG_BIN" ]; then
              echo "Error: Cannot find bin directory in clang/"
              ls -la clang/
              exit 1
            fi
          fi
          
          if [ ! -f "$CLANG_BIN/clang" ]; then
            echo "Error: clang not found in $CLANG_BIN"
            ls -la "$CLANG_BIN"
            exit 1
          fi
          
          echo "Clang installed successfully:"
          $CLANG_BIN/clang --version
          $CLANG_BIN/clang -target aarch64-linux-gnu --version
          
          echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV

          echo "Downloading GCC toolchains..."
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${GCC_VERSION}/binrel/"
          
          ARCHIVE64="arm-gnu-toolchain-${GCC_VERSION}-x86_64-aarch64-none-linux-gnu.tar.xz"
          wget --tries=3 --retry-connrefused -q "${BASE_URL}/${ARCHIVE64}" -O gcc64.tar.xz
          if [ ! -f "gcc64.tar.xz" ] || [ ! -s "gcc64.tar.xz" ]; then
            echo "Error: Failed to download 64-bit GCC toolchain"
            exit 1
          fi
          tar -xf gcc64.tar.xz
          rm gcc64.tar.xz
          
          ARCHIVE32="arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf.tar.xz"
          wget --tries=3 --retry-connrefused -q "${BASE_URL}/${ARCHIVE32}" -O gcc32.tar.xz
          if [ ! -f "gcc32.tar.xz" ] || [ ! -s "gcc32.tar.xz" ]; then
            echo "Warning: Failed to download 32-bit GCC toolchain (optional for CONFIG_COMPAT)"
          else
            tar -xf gcc32.tar.xz
            rm gcc32.tar.xz
            GCC_ARM32_DIR="$PWD/arm-gnu-toolchain-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/bin"
            echo "GCC_ARM32_DIR=${GCC_ARM32_DIR}" >> $GITHUB_ENV
          fi
          
          TOOLCHAIN_DIR="$PWD/arm-gnu-toolchain-${GCC_VERSION}-x86_64-aarch64-none-linux-gnu"
          GCC_PATH="${TOOLCHAIN_DIR}/bin/aarch64-none-linux-gnu-"
          echo "GCC_PATH=${GCC_PATH}" >> $GITHUB_ENV
          
          echo "GCC toolchains installed successfully:"
          ${GCC_PATH}gcc --version || echo "GCC installed"
          
          echo "Downloading build tools..."
          mkdir -p build-tools
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip" \
            -o build-tools.zip
          unzip -q build-tools.zip -d build-tools
          rm -f build-tools.zip

          echo "Source and toolchain initialization completed."

          echo "Removing ABI protection and dirty suffix..."
          rm -f common/android/abi_gki_protected_exports_* || true

          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
            [ -f "$f" ] && sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "Current disk space:"
          df -h

          echo "Current kernel version: ${{ env.KERNEL_VERSION_FULL }}"

      - name: Setup xxKSU
        id: ksu_version
        run: |
          
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh
          chmod +x ./sh/*.sh 2>/dev/null || true

          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
          
          echo "ksuver=$K_VER" >> $GITHUB_OUTPUT
          echo "KSUVER=$K_VER" >> $GITHUB_ENV
          echo "xxKSU version: $K_VER"

          
          cd kernel_workspace/common
          echo "Cloning xxKSU..."
          git clone --depth=1 --branch=${{ env.KSU_BRANCH }} https://github.com/backslashxx/KernelSU.git KernelSU

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          KSU_MAKEFILE="drivers/kernelsu/Makefile"
          if [ -f "$KSU_MAKEFILE" ]; then
            echo "" >> "$KSU_MAKEFILE"
            echo "CFLAGS_ksu.o += -DKSU_VERSION=$K_VER" >> "$KSU_MAKEFILE"
          fi

      - name: Integrate xxKSU
        run: |
          cd kernel_workspace/common
          
          patch -p1 -l  < "${{ github.workspace }}/.github/patches/xxksu/scope-min-manual-hooks-v2.2.patch"

      - name: Inject Kernel configuration
        run: |
          cd kernel_workspace

          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          cat >> $DEFCONFIG <<-'EOF'
          # Core Bootability & Performance
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_ANDROID_BINDER_IPC_RUST=m
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # Networking Configuration
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y

          # IPSet & TProxy Suite
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
        
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          # CONFIG_KSU_KPROBES_KSUD is not set
          EOF

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add kernel version suffix
        run: |
          cd kernel_workspace

          echo "Replacing kernel version suffix..."
          
          echo "Kernel version: ${{ env.KERNEL_VERSION_FULL }}"
          
          SUFFIX="${{ env.KERNEL_NAME }}"
          
          echo "Current kernel version suffix: $SUFFIX"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
          done

      - name: Show build metadata
        run: |
         echo "╔══════════════════════════════════════════╗"
         echo "║         BUILD METADATA SUMMARY           ║"
         echo "╠══════════════════════════════════════════╣"
         echo "║ KERNEL:                                  ║"
         echo "║   Version: ${{ env.KERNEL_VERSION_FULL_WITH_SUB }}"
         echo "║   Suffix:  ${{ env.KERNEL_NAME }}"
         echo "╠══════════════════════════════════════════╣"
         echo "║ xxKSU:                                   ║"
         echo "║   Version: ${{ env.KSUVER }}"
         echo "║   Branch:  ${{ env.KSU_BRANCH }}"
         echo "╠══════════════════════════════════════════╣"
         echo "║ COMPILER:                                ║"
         $CLANG_BIN/clang --version | head -1 | sed 's/^/║   Clang:  /'
         ${GCC_PATH}gcc --version | head -1 | sed 's/^/║   GCC64:  /'
         echo "╠══════════════════════════════════════════╣"
         echo "║ ENVIRONMENT:                             ║"
         echo "║   User:   ${{ env.KBUILD_BUILD_USER }}"
         echo "║   Host:   ${{ env.KBUILD_BUILD_HOST }}"
         echo "║   Cores:  $(nproc)"
         echo "╚══════════════════════════════════════════╝"
         
      - name: Build kernel
        run: |
          WORKDIR="$(pwd)"
          
          if [ -z "$CLANG_BIN" ]; then
            echo "Error: CLANG_BIN environment variable not set"
            exit 1
          fi
          
          if [ ! -f "$CLANG_BIN/clang" ]; then
            echo "Error: clang not found at $CLANG_BIN/clang"
            exit 1
          fi
          
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$CLANG_BIN:$PATH"
          
          if [ -n "$GCC_PATH" ]; then
            export CROSS_COMPILE="${GCC_PATH}"
            echo "Using custom GCC toolchain: ${CROSS_COMPILE}"
            GCC_BIN_DIR=$(dirname "${GCC_PATH}")
            export PATH="${GCC_BIN_DIR}:$PATH"
          else
            echo "Warning: GCC_PATH not set, using system toolchain"
            export CROSS_COMPILE="aarch64-linux-gnu-"
          fi
          
          if [ -n "$GCC_ARM32_DIR" ] && [ -f "${GCC_ARM32_DIR}/arm-none-linux-gnueabihf-gcc" ]; then
            export CROSS_COMPILE_ARM32="${GCC_ARM32_DIR}/arm-none-linux-gnueabihf-"
            export PATH="${GCC_ARM32_DIR}:$PATH"
            echo "Using 32-bit toolchain: ${CROSS_COMPILE_ARM32}"
          fi
          
          echo "Using Clang from: $CLANG_BIN"
          clang --version
          
          cd kernel_workspace/common
          
          export KCFLAGS="-O2 -Wno-error"
          
          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
          
          export KBUILD_GENDWARFKSYMS_STABLE=1
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out gki_defconfig
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out Image
          
          echo "Kernel build completed."
          
          df -h

      - name: Clone AnyKernel3 and package kernel
        run: |
          cd kernel_workspace

          git clone https://github.com/yapixel/AnyKernel3 --depth=1

          rm -rf ./AnyKernel3/.git

          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          KSU_VER="$KSUVER"
          [ -z "$KSU_VER" ] && KSU_VER="${{ steps.ksu_version.outputs.ksuver }}"
          [ -z "$KSU_VER" ] && KSU_VER="unknown"

          ZIP_NAME="AK3_${{ env.KERNEL_VERSION_FULL }}_xxKSU+${KSU_VER}.zip"

          zip -r9 "../${ZIP_NAME}" ./*

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          echo "Packaging completed: ${ZIP_NAME}"

      - name: Upload AnyKernel3 flashable package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AK3_${{ env.KERNEL_VERSION }}_xxKSU
          path: kernel_workspace/AK3_*.zip
