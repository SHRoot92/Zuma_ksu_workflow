name: Build GKI + xxKSU with GCC

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '126'
  KERNEL_NAME: 'android14-11-gfa1d6308d1fe-ab14691759'

  KERNEL_ARCHIVE_URL: https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-03_r13/common-android14-6.1-2026-03_r13.tar.gz
  ARM64_GCC_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
  ARM32_GCC_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      - name: Install dependencies and initialize GCC toolchains
        run: |
          set -e

          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update || true

          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            aria2 \
            zstd \
            unzip \
            wget \
            curl \
            git \
            xz-utils \
            pahole \
            zip \
            bc \
            flex \
            bison \
            make \
            gcc \
            g++

          echo "Downloading ARM64 GCC toolchain..."
          mkdir -p toolchains
          curl -fsSL "${{ env.ARM64_GCC_URL }}" -o toolchains/arm64.tar.xz
          tar -xf toolchains/arm64.tar.xz -C toolchains

          ARM64_DIR="$(find toolchains -maxdepth 1 -type d -name 'arm-gnu-toolchain-*-aarch64-none-linux-gnu' | head -n 1)"
          if [ -z "$ARM64_DIR" ]; then
            echo "ARM64 GCC toolchain directory not found."
            exit 1
          fi

          echo "ARM64_TOOLCHAIN=${{ github.workspace }}/kernel_workspace/${ARM64_DIR}/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

          echo "Downloading ARM32 GCC toolchain..."
          curl -fsSL "${{ env.ARM32_GCC_URL }}" -o toolchains/arm32.tar.xz
          tar -xf toolchains/arm32.tar.xz -C toolchains

          ARM32_DIR="$(find toolchains -maxdepth 1 -type d -name 'arm-gnu-toolchain-*-arm-none-linux-gnueabihf' | head -n 1)"
          if [ -z "$ARM32_DIR" ]; then
            echo "ARM32 GCC toolchain directory not found."
            exit 1
          fi

          echo "ARM32_TOOLCHAIN=${{ github.workspace }}/kernel_workspace/${ARM32_DIR}/bin/arm-none-linux-gnueabihf-" >> "$GITHUB_ENV"

          echo "GCC toolchains are ready."

          echo "Current disk space:"
          df -h

      - name: Download and prepare GKI source
        run: |
          set -e

          cd kernel_workspace

          echo "Downloading GKI source..."
          aria2c -s16 -x16 -k1M "${{ env.KERNEL_ARCHIVE_URL }}" -o common.tar.gz

          mkdir -p common
          tar -xzf common.tar.gz -C common
          rm -f common.tar.gz

          echo "Removing ABI protection and dirty suffix..."
          rm -f common/android/abi_gki_protected_exports_* || true

          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
            [ -f "$f" ] && sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "Current kernel version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"

      - name: Setup xxKSU
        id: ksu_version
        run: |
          set -e

          cd kernel_workspace/common

          echo "Cloning xxKSU..."
          git clone --depth=1 --branch=master https://github.com/backslashxx/KernelSU.git KernelSU

          cd KernelSU
          git fetch --unshallow --quiet 2>/dev/null || true

          KSU_COUNT="$(git rev-list --count HEAD)"
          KSU_VERSION="$((KSU_COUNT + 30000))"

          echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"

          echo "xxKSU version: $KSU_VERSION"

          cd ..

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Patch kernel version suffix
        run: |
          set -e

          cd kernel_workspace

          echo "Replacing kernel version suffix..."

          SUFFIX="${{ env.KERNEL_NAME }}"

          echo "Current kernel version suffix: $SUFFIX"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
          done

      - name: Build kernel with GCC
        run: |
          set -euo pipefail

          cd kernel_workspace/common

          export ARCH=arm64
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"

          export PATH="$(dirname "${ARM64_TOOLCHAIN}"):$PATH"
          export PATH="$(dirname "${ARM32_TOOLCHAIN}"):$PATH"

          echo "Compiler information:"
          echo "ARM64 GCC: $(${CROSS_COMPILE}gcc --version | head -n 1)"
          echo "ARM32 GCC: $(${CROSS_COMPILE_COMPAT}gcc --version | head -n 1)"

          pahole_version="$(pahole --version 2>/dev/null | head -n1 || true)"
          [ -z "$pahole_version" ] && echo "pahole version: not installed" || echo "pahole version: $pahole_version"

          MAKE_JOBS="$(nproc --all)"
          echo "Building with ${MAKE_JOBS} jobs using ARM GNU GCC..."

          make O=out gki_defconfig

          cat <<EOF >> out/.config
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_HEADERS_INSTALL=n
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="-${{ env.KERNEL_NAME }}"
          CONFIG_LTO_NONE=y
          EOF

          make O=out olddefconfig

          make -j"${MAKE_JOBS}" O=out Image

          echo "Kernel build completed."

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "Kernel Image was not generated."
            exit 1
          fi

          df -h

      - name: Clone AnyKernel3 and package kernel
        run: |
          set -e

          cd kernel_workspace

          git clone https://github.com/cctv18/AnyKernel3 --depth=1

          rm -rf ./AnyKernel3/.git

          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [ ! -f ./Image ]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          KSU_VER="$KSUVER"
          [ -z "$KSU_VER" ] && KSU_VER="unknown"

          ZIP_NAME="AnyKernel3_xxKSU_${KSU_VER}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip"

          zip -r9 "../${ZIP_NAME}" ./*

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          echo "Packaging completed: ${ZIP_NAME}"

      - name: Upload AnyKernel3 flashable package
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3_${{ env.KERNEL_VERSION }}_xxKSU_GCC
          path: kernel_workspace/AnyKernel3_*.zip
