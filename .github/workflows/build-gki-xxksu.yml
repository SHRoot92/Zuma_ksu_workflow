name: Build GKI + xxKSU

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  SUB_VERSION: '126'
  KERNEL_NAME: 'android14-11-gfa1d6308d1fe-ab14691759'
  KBUILD_BUILD_USER: "build-user"
  KBUILD_BUILD_HOST: "build-host"
  BUILD_TIMESTAMP: "Fri Jan 9 16:33:46 UTC 2026"
  SCRIPTS_REPO: "https://github.com/TheSillyOk/sh"
  KSU_BRANCH: "master"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      
      - name: Checkout patch repository
        uses: actions/checkout@v6
        with:
          path: patch_source

      - name: Install dependencies and initialize source repository with LLVM-Clang20 toolchain
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update || true

          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            aria2 \
            zstd \
            unzip \
            wget \
            pahole \
            zip

          echo "Downloading GKI source..."
          aria2c -s16 -x16 -k1M \
            "https://github.com/yapixel/gki-build-assets/releases/download/kernel-archive-android14-6.1-2026-03_r13/common-android14-6.1-2026-03_r13.tar.gz" \
            -o common.tar.gz

          mkdir -p common
          tar -xzf common.tar.gz -C common
          rm -f common.tar.gz

          echo "Downloading LLVM-Clang20 toolchain..."
          mkdir -p clang20
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang20-r547379/clang-r547379.zip" \
            -o clang.zip
          unzip -q clang.zip -d clang20
          rm -f clang.zip

          echo "Downloading build tools..."
          mkdir -p build-tools
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip" \
            -o build-tools.zip
          unzip -q build-tools.zip -d build-tools
          rm -f build-tools.zip

          echo "Source and toolchain initialization completed."

          echo "Removing ABI protection and dirty suffix..."
          rm -f common/android/abi_gki_protected_exports_* || true

          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's/ -dirty//g' "$f"
            [ -f "$f" ] && sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

          echo "Current disk space:"
          df -h

          echo "Current kernel version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"

      - name: Setup xxKSU
        id: ksu_version
        run: |
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh
          chmod +x ./sh/*.sh 2>/dev/null || true

          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
          
          echo "ksuver=$K_VER" >> $GITHUB_OUTPUT
          echo "KSUVER=$K_VER" >> $GITHUB_ENV
          echo "xxKSU version: $K_VER"

          cd kernel_workspace/common
          echo "Cloning xxKSU..."
          git clone --depth=1 --branch=${{ env.KSU_BRANCH }} https://github.com/backslashxx/KernelSU.git KernelSU

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply Patches xxKSU (Security & Scope Hooks)
        run: |
          cd kernel_workspace/common
          
          #patch -p1 -l --fuzz=3 < "${{ github.workspace }}/patch_source/.github/patches/manual-security-hooks-v2.0.patch"
          patch -p1 -l --fuzz=3 < "${{ github.workspace }}/patch_source/.github/patches/scope-min-manual-hooks-v2.2.patch"

      - name: Add xxKSU base configuration
        run: |
          cd kernel_workspace

          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          echo "写入自定义内核配置到 $DEFCONFIG ..."

          # --- Core System & FS ---
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_LOG_BUF_SHIFT=21" >> "$DEFCONFIG"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG"
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"

          # --- Pillar 1: atp4pixel / Advanced Networking ---
          echo "CONFIG_NETFILTER_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_BPF_STREAM_PARSER=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_TARGET_TPROXY=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_TARGET_REDIRECT=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_SOCKET=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_MARK=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_IPRANGE=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_OWNER=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_MAC=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_MARK=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_CONNMARK=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_TARGET_CONNMARK=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_NAT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_REDIRECT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_MULTIPLE_TABLES=y" >> "$DEFCONFIG"
          echo "CONFIG_IPV6_MULTIPLE_TABLES=y" >> "$DEFCONFIG"

          # --- Pillar 2: Google VPN (XFRM) Coexistence ---
          echo "CONFIG_XFRM_ALGO=y" >> "$DEFCONFIG"
          echo "CONFIG_INET_IPCOMP=y" >> "$DEFCONFIG"
          echo "CONFIG_INET_XFRM_TUNNEL=y" >> "$DEFCONFIG"
          echo "CONFIG_INET_ESP=y" >> "$DEFCONFIG"
          echo "CONFIG_XFRM_USER=y" >> "$DEFCONFIG"
          echo "CONFIG_XFRM_SUB_POLICY=y" >> "$DEFCONFIG"
          echo "CONFIG_INET_XFRM_MODE_TUNNEL=y" >> "$DEFCONFIG"
          echo "CONFIG_XFRM_STATISTICS=y" >> "$DEFCONFIG"

          # --- Pillar 3: IPSet Full Suite ---
          echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
          echo "CONFIG_NETFILTER_XT_SET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_MAX=65534" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_MAC=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_SET_LIST_SET=y" >> "$DEFCONFIG"

          # --- Pillar 4: TCP Congestion & BBR ---
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"

          # --- Pillar 5: xxKSU (Hookless / LSM) ---
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_EXTRAS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_DEBUG=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$DEFCONFIG"

          echo "CONFIG_SECURITY_NETWORK=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUPS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_BPF=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_SCHED=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_PIDS=y" >> "$DEFCONFIG"
          echo "CONFIG_CGROUP_FREEZER=y" >> "$DEFCONFIG"
          echo "CONFIG_INOTIFY_USER=y" >> "$DEFCONFIG"

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Add kernel version suffix
        run: |
          cd kernel_workspace

          echo "Replacing kernel version suffix..."
          SUFFIX="${{ env.KERNEL_NAME }}"
          echo "Current kernel version suffix: $SUFFIX"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
          done

      - name: Build kernel
        run: |
          WORKDIR="$(pwd)"
          
          echo "Optimizing runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$WORKDIR/kernel_workspace/clang20/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang20/bin"

          echo "Compiler information:"
          echo "Clang version: $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD version: $($CLANG_DIR/ld.lld --version | head -n 1)"

          pahole_version=$(pahole --version 2>/dev/null | head -n1 || true)
          [ -z "$pahole_version" ] && echo "pahole version: not installed" || echo "pahole version: $pahole_version"

          cd kernel_workspace/common

          export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
          export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"

          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" \
            LD="ld.lld" \
            HOSTLD=ld.lld \
            O=out \
            KCFLAGS="-O2 -w" \
            gki_defconfig

          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="clang" \
            LD="ld.lld" \
            HOSTLD=ld.lld \
            O=out \
            KCFLAGS="-O2 -w" \
            Image

          echo "Kernel build completed."
          df -h

      - name: Clone AnyKernel3 and package kernel
        run: |
          cd kernel_workspace

          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "::error::Kernel image not found! The build has failed."
            exit 1
          fi

          KSU_VER="${{ env.KSUVER }}"
          [ -z "$KSU_VER" ] && KSU_VER="${{ steps.ksu_version.outputs.ksuver }}"
          [ -z "$KSU_VER" ] && KSU_VER="unknown"

          ZIP_NAME="AK3_xxKSU_${KSU_VER}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip"

          zip -r9 "../${ZIP_NAME}" ./*
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Packaging completed: ${ZIP_NAME}"

      - name: Upload AnyKernel3 flashable package
        uses: actions/upload-artifact@v4
        with:
          name: AK3_${{ env.KERNEL_VERSION }}_xxKSU
          path: kernel_workspace/AK3_*.zip
