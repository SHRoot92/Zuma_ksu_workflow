name: Build GKI Kernel with ReSukiSU

on:
  workflow_dispatch:
    inputs:
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean

      force_clean_build:
        description: 'Force clean build'
        required: false
        default: false
        type: boolean

      enable_telegram:
        description: 'Enable Telegram notifications'
        required: false
        default: true
        type: boolean

      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean

      make_jobs:
        description: 'Override make parallel jobs, auto or integer'
        required: false
        default: 'auto'
        type: string

      dry_run_only:
        description: 'Validate source sync and patch application only'
        required: false
        default: false
        type: boolean

      kernel_ref:
        description: 'Override kernel ref'
        required: false
        default: 'android14-6.1-2026-03'
        type: string

      susfs_ref:
        description: 'Override SuSFS ref'
        required: false
        default: 'gki-android14-6.1-dev'
        type: string

      resukisu_ref:
        description: 'Override ReSukiSU ref'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: kernel-build-resukisu-${{ github.ref_name }}
  cancel-in-progress: false

env:
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  RESUKISU_REPO_URL: https://github.com/ReSukiSU/ReSukiSU.git
  ANYKERNEL_REPO_URL: https://github.com/yapixel/AnyKernel3
  CLIDR_PATCH_URL: https://raw.githubusercontent.com/infectedmushi/kernel_patches/4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e/fix-clidr-uninitialized.patch
  WIFI_PATCH_URL: https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      dry_run: ${{ steps.config.outputs.dry_run }}
      create_release: ${{ steps.config.outputs.create_release }}

    steps:
      - name: Set Build Config
        id: config
        run: |
          echo "enable_susfs=${{ inputs.disable_susfs && 'false' || 'true' }}" >> $GITHUB_OUTPUT
          echo "force_clean=${{ inputs.force_clean_build }}" >> $GITHUB_OUTPUT
          echo "dry_run=${{ inputs.dry_run_only }}" >> $GITHUB_OUTPUT
          echo "create_release=${{ inputs.create_release && !inputs.dry_run_only && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          echo "make_jobs=${{ inputs.make_jobs }}" >> $GITHUB_OUTPUT

      - name: Checkout Workflow Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        run: |
          set -e

          echo "CPU cores: $(nproc)"
          df -h .

          mkdir -p /tmp/toolchains

          echo "Downloading ARM64 GNU Toolchain..."
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -o /tmp/toolchains/arm64.tar.xz

          tar -xf /tmp/toolchains/arm64.tar.xz -C /tmp/toolchains/

          ARM64_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-aarch64-none-linux-gnu" | head -1)
          echo "ARM64_TOOLCHAIN=${ARM64_DIR}/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

          echo "Downloading ARM32 GNU Toolchain..."
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz" \
            -o /tmp/toolchains/arm32.tar.xz

          tar -xf /tmp/toolchains/arm32.tar.xz -C /tmp/toolchains/

          ARM32_DIR=$(find /tmp/toolchains -maxdepth 1 -type d -name "arm-gnu-toolchain-*-arm-none-linux-gnueabihf" | head -1)
          echo "ARM32_TOOLCHAIN=${ARM32_DIR}/bin/arm-none-linux-gnueabihf-" >> $GITHUB_ENV

          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev pahole

      - name: Sync Kernel and SuSFS Sources
        run: |
          set -e

          echo "Syncing kernel..."
          git clone --depth=1 \
            --branch="${{ inputs.kernel_ref }}" \
            "${{ env.KERNEL_REPO_URL }}" \
            kernel

          echo "Syncing SuSFS..."
          git clone --depth=1 \
            --branch="${{ inputs.susfs_ref }}" \
            "${{ env.SUSFS_REPO_URL }}" \
            susfs4ksu

      - name: Setup ReSukiSU
        run: |
          set -e

          cd kernel
          rm -rf KernelSU drivers/kernelsu

          echo "Cloning ReSukiSU..."
          git clone --depth=1 \
            --branch="${{ inputs.resukisu_ref }}" \
            "${{ env.RESUKISU_REPO_URL }}" \
            KernelSU

          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SuSFS
        if: steps.config.outputs.enable_susfs == 'true'
        run: |
          set -e

          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h kernel/include/linux/

          cd kernel
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch || true

          cd KernelSU
          patch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true

      - name: Apply Fix Patches
        run: |
          set -e

          cd kernel

          rm -f android/abi_gki_protected_exports_* || true

          curl -fsSL "${{ env.CLIDR_PATCH_URL }}" -o /tmp/clidr.patch
          patch -p1 --forward < /tmp/clidr.patch || true

          curl -fsSL "${{ env.WIFI_PATCH_URL }}" -o /tmp/wifi.patch
          patch -p1 --forward < /tmp/wifi.patch || true

      - name: Build Kernel
        if: steps.config.outputs.dry_run != 'true'
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
          export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"

          MAKE_JOBS="${{ steps.config.outputs.make_jobs }}"
          [ "$MAKE_JOBS" = "auto" ] && MAKE_JOBS=$(nproc)

          echo "Building with $MAKE_JOBS jobs..."

          make O=out gki_defconfig

          cat <<EOF >> out/.config
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_IP_SET=y
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LOCALVERSION="-deepongi+"
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_LTO_NONE=y
          EOF

          if [ "${{ steps.config.outputs.enable_susfs }}" = "true" ]; then
            cat <<'SUSFS_EOF' >> out/.config
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
          fi

          make O=out olddefconfig

          if [ "${{ steps.config.outputs.force_clean }}" = "true" ]; then
            make -j"$MAKE_JOBS" O=out clean
          fi

          make -j"$MAKE_JOBS" O=out Image

      - name: Package Kernel
        if: steps.config.outputs.dry_run != 'true'
        run: |
          set -e

          cd kernel

          KERNEL_VERSION="$(grep '^VERSION' Makefile | cut -d' ' -f3).$(grep '^PATCHLEVEL' Makefile | cut -d' ' -f3).$(grep '^SUBLEVEL' Makefile | cut -d' ' -f3)"

          cd ..

          git clone --depth=1 "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3 2>/dev/null || \
            git clone --depth=1 --branch=main "${{ env.ANYKERNEL_REPO_URL }}" AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

          if [ -f kernel/out/arch/arm64/boot/dtb ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/
          fi

          cd AnyKernel3
          rm -rf .git .github

          ZIP_NAME="${KERNEL_VERSION}-resukisu.zip"

          zip -r9 "../$ZIP_NAME" .

          cd ..

          echo "KERNEL_ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel
        if: steps.config.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-resukisu
          path: ${{ env.KERNEL_ZIP }}

  create_release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.outputs.create_release == 'true' && needs.build.result != 'cancelled'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish Release
        run: |
          set -e

          cd release

          find . -name "*.zip" -exec mv {} . \; 2>/dev/null || true

          ls *.zip >/dev/null || {
            echo "No ZIPs found"
            exit 0
          }

          TAG="resukisu-build-${{ github.run_number }}"
          NOTES="ReSukiSU build #${{ github.run_number }} · $(date -u '+%Y-%m-%d %H:%M UTC')"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" ./*.zip \
              --title "$TAG" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  notify:
    needs:
      - build
      - create_release

    runs-on: ubuntu-latest
    if: always() && inputs.enable_telegram && needs.build.outputs.dry_run != 'true'

    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping."
            exit 0
          fi

          STATUS="${{ needs.build.result }}"

          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="⚠️"
          [ "$STATUS" = "failure" ] && ICON="❌"

          IS_SUSFS="${{ inputs.disable_susfs && 'Disabled' || 'Enabled' }}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${ICON} ReSukiSU Kernel Build *${STATUS^^}*%0A%0ASuSFS: ${IS_SUSFS}%0A%0AView: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d parse_mode="Markdown"
