name: Build GKI + xxKSU

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  KSU_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
         sudo apt-get update
         sudo apt-get install -y \
         aria2 \
         build-essential \
         libelf-dev \
         libssl-dev \
         dwarves \
         zlib1g-dev \
         zip
      - name: Download and setup Clang 23
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
          echo "$HOME/clang/bin" >> $GITHUB_PATH
      - name: Download ARM64 GNU Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O tc.tar.xz
          tar -xJf tc.tar.xz
          rm tc.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*)
          echo "$HOME/toolchains/$TC_DIR/bin" >> $GITHUB_PATH
          echo "ARM64_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV
      - name: Download ARM32 GNU Toolchain
        run: |
          cd $HOME/toolchains
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz -O tc-arm.tar.xz
          tar -xJf tc-arm.tar.xz
          rm tc-arm.tar.xz
          TC_DIR=$(ls -d arm-gnu-toolchain-*arm-none-eabi*)
          echo "$HOME/toolchains/$TC_DIR/bin" >> $GITHUB_PATH
          echo "ARM32_TOOLCHAIN=$HOME/toolchains/$TC_DIR/bin/arm-none-eabi-" >> $GITHUB_ENV
      - name: Clone Source
        run: |
          aria2c -s16 -x16 -k1M https://android.googlesource.com/kernel/common/+archive/refs/tags/android14-6.1-2026-03_r11.tar.gz -o common.tar.gz
          mkdir common
          tar -xzf common.tar.gz -C common
          git clone --depth=1 $ANYKERNEL_REPO -b gki-2.0 AK3
          git clone --depth=1 $PATCHES_REPO kernel_patches
          git clone --depth=1 $SCRIPTS_REPO sh
      - name: Apply KSU & patches
        working-directory: common
        run: |
          curl -LSs https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh | bash -s -- ${KSU_BRANCH}
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch
          patch -p1 < ../kernel_patches/xxksu/scope_minimized_manual_hooks_v2_1_for_android14_6_1_2026_03_r11.patch
      - name: Inject Configuration
        working-directory: common
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            gki_defconfig
          cat >> out/.config <<EOF
          # --- Core System & FS ---
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOG_BUF_SHIFT=21
          
          # --- Pillar 1: atp4pixel / Advanced Networking ---
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          # --- Pillar 2: Google VPN (XFRM) ---
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          # --- Pillar 3: IPSet ---
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_LIST_SET=y
          # --- Pillar 4: BBR ---
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          # --- Pillar 5: xxKSU ---
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_ALLOWLIST_WORKAROUND=n
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          EOF
          make O=out ARCH=arm64 \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            olddefconfig
      - name: Build Kernel
        working-directory: common
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE="${{ env.ARM64_TOOLCHAIN }}" \
            CROSS_COMPILE_COMPAT="${{ env.ARM32_TOOLCHAIN }}" \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++
      - name: Package
        run: |
         if [ -f common/out/arch/arm64/boot/Image.lz4 ]; then
         cp common/out/arch/arm64/boot/Image.lz4 AK3/
         else
         cp common/out/arch/arm64/boot/Image AK3/
         fi

         [ -f common/out/arch/arm64/boot/dtb ] && \
         cp common/out/arch/arm64/boot/dtb AK3/

         cd AK3 && rm -rf .git .github

         ZIP=gki-xxksu-$(date +%Y%m%d).zip
         zip -r9 "../$ZIP" .

         echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: ${{ env.ZIP }}
