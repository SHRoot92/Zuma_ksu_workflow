name: Build Sultan + xxKSU

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  KSU_BRANCH: master
  GCC_VERSION: "14.2.rel1"

jobs:
  build:
    name: Build gs201 Kernel
    runs-on: ubuntu-latest
    outputs:
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      s_tag: ${{ steps.meta.outputs.s_tag }}
      gcc_version: ${{ steps.meta.outputs.gcc_version }}
      
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GCC
        run: |
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/"${{ env.GCC_VERSION }}"/binrel/"
          ARCHIVE="arm-gnu-toolchain-"${{ env.GCC_VERSION }}"-x86_64-aarch64-none-linux-gnu.tar.xz"
          
          wget -q "${BASE_URL}/${ARCHIVE}" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          echo "GCC_PATH=$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

      - name: Clone Source
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
          
          # Get GCC version - extract just the version number
          GCC_VER_FULL=$(${GCC_PATH}gcc -v 2>&1 | grep "gcc version" | awk '{print $3}')
          GCC_VER=$(echo "$GCC_VER_FULL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "gcc_version=$GCC_VER" >> "$GITHUB_OUTPUT"
          
          # Display all metadata
          echo "================================"
          echo "📊 Build Metadata"
          echo "================================"
          echo "🏷️  Sultan Tag: $S_TAG"
          echo "🔧 xxKSU Version: r$K_VER"
          echo "⚙️  GCC Version: $GCC_VER"
          echo "================================"

      - name: KSU & Patches
        working-directory: sultan
        run: |
          curl -LSs "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/${{ env.KSU_BRANCH }}/kernel/setup.sh" | bash -s -- "${{ env.KSU_BRANCH }}"
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch

      - name: Global Defconfig Analysis
        working-directory: sultan
        run: |
          echo "=== Scanning All Relevant Defconfigs ==="
          TARGET_DEFS=("gs201_defconfig")
          CHECK_FLAGS=("CONFIG_NETFILTER_ADVANCED" "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE" "CONFIG_KSU")
          for def in "${TARGET_DEFS[@]}"; do
            CONF_PATH="arch/arm64/configs/$def"
            echo "[*] Checking $def..."
            for flag in "${CHECK_FLAGS[@]}"; do
              grep "$flag" "$CONF_PATH" || echo "  - $flag: missing"
            done
          done

      - name: Generate Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "sultan/out/.config"
          variant: "xxksu"
          enable_susfs: "false"

      - name: Finalize Defconfig
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-gs201-$(date +'%Y%m%d')-xxKSU-r${{ steps.meta.outputs.ksu_ver }}.zip"
          
          # Main flashable AnyKernel3 zip
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          
          echo "ZIP_PATH=$PWD/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Sultan-gs201
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
          
      - name: List artifacts (debug)
        run: |
          echo "=== artifacts directory contents ==="
          ls -la ./artifacts/
          echo "=== find zip files ==="
          find ./artifacts -name "*.zip" -type f
          
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_version }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          # Find the zip file
          ZIP_FILE=$(find ./artifacts -name "*.zip" -type f | head -1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          
          gh release create "$TAG" "$ZIP_FILE" \
            --title "Kernel Build — $TAG" \
            --notes "
            ### 🚀 Build Information
            | Component | Details |
            | :--- | :--- |
            | **Kernel Base** | Sultan ($S_TAG) |
            | **Manager** | [backslashxx/KernelSU](https://github.com/backslashxx/KernelSU) |
            | **xxKSU Ver** | \`r$KSU_VER\` |
            | **Compiler** | GCC $GCC_VER |
            
            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v1) + FQ
            - **Routing:** Policy Routing (Table 1066) + IPSet (64k)
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            
            > Built for Pixel 7 (gs201)."
