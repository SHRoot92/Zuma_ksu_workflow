name: Build and Release - Kernel 6.1

on:
  workflow_dispatch:
    inputs:
      source_mirror:
        description: 'Kernel Source'
        required: true
        default: 'midori'
        type: choice
        options:
          - google
          - midori
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - KOWSU
          - XXKSU
      kowsu_branch:
        description: 'KOWSU Source'
        required: true
        default: 'KOWX712/KernelSU:master'
        type: choice
        options:
          - 'KOWX712/KernelSU:master'
        
      xxksu_branch:
        description: 'XXKSU Source'
        required: true
        default: 'backslashxx/KernelSU:master'
        type: choice
        options:
          - 'backslashxx/KernelSU:master'
          - 'backslashxx/KernelSU:staging'
      use_ccache:
        description: 'Ccache Speedup'
        required: true
        default: true
        type: boolean
      enable_susfs:
        description: 'SUSFS'
        required: true
        default: true
        type: boolean
      susfs_commit:
        description: 'SUSFS Commit (Leave blank for latest)'
        required: false
        default: ''
        type: string
      hook_mode:
        description: "XXKSU Hook Mode"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - hookless
      kernel_localversion:
        description: 'Spoof Kernel Name'
        required: true
        default: '-gki-build'
        type: string
      build_timestamp:
        description: 'Spoof Build Time'
        required: true
        default: 'Mon Feb 02 02:02:02 JST 2026'
        type: string
      build_user:
        description: 'Spoof Build User'
        required: true
        default: 'build-user'
        type: string
      build_host:
        description: 'Spoof Build Host'
        required: true
        default: 'build-host'
        type: string
      build_epoch:
        description: 'SOURCE_DATE_EPOCH'
        required: true
        default: '1764155774'
        type: string
      release_type:
        description: 'Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - pre-release
          - no-release

permissions:
  contents: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.config.outputs.release_tag }}
      build_matrix: ${{ steps.config.outputs.build_matrix }}
      metadata: ${{ steps.config.outputs.metadata }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - id: config
        name: Prepare build matrix and metadata
        run: |
          echo "release_tag=$(TZ='Asia/Tokyo' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          config_file=".github/config/kernel_versions.json"

          kv="6.1"
          
          rm -f /tmp/metadata.json
          config=$(jq -c '.["6.1"]' "$config_file")
          android_version=$(echo "$config" | jq -r '.android_version')
          sub_level=$(echo "$config" | jq -r '.default_sub_level')
          revision=$(echo "$config" | jq -c '.revisions["'$sub_level'"]')
          asb_date=$(echo "$revision" | jq -r '.asb_date')
          r_version=$(echo "$revision" | jq -r '.default_r')
          r_suffix=$([ "$r_version" != "none" ] && echo "_$r_version" || echo '')
          clang_version=$(echo "$config" | jq -r '.default_clang')
          rust=$(echo "$config" | jq -r '.rust')
          [ "$rust" = "true" ] && rust_version=$(echo "$config" | jq -r '.default_rust') || rust_version=""
          mirror_tag=$(echo "$config" | jq -r '.mirror_tag')
          anykernel_branch=$(echo "$config" | jq -r '.anykernel_branch')
          google_ref=$([ "$r_version" = "none" ] && echo "heads" || echo "tags")
          if [ "${{ inputs.source_mirror }}" = "google" ]; then
            source_url="https://android.googlesource.com/kernel/common/+archive/refs/$google_ref"
            mirror_name="Google"
          else
            source_url="https://github.com/${{ github.repository }}/releases/download/$mirror_tag"
            mirror_name="GitHub"
          fi

          jq -n \
            --arg kv "$kv" \
            --arg android_version "$android_version" \
            --arg sub_level "$sub_level" \
            --arg asb_date "$asb_date" \
            --arg r_version "$r_version" \
            --arg r_suffix "$r_suffix" \
            --arg clang_version "$clang_version" \
            --arg rust_version "$rust_version" \
            --arg source_url "$source_url" \
            --arg mirror_name "$mirror_name" \
            --arg anykernel_branch "$anykernel_branch" \
            '{kernel_version:$kv,android_version:$android_version,sub_level:$sub_level,asb_date:$asb_date,r_version:$r_version,r_suffix:$r_suffix,clang_version:$clang_version,rust_version:$rust_version,source_base_url:$source_url,mirror_name:$mirror_name,anykernel_branch:$anykernel_branch}' > /tmp/metadata.json

          matrix='{"include":[]}'
          variant="${{ inputs.ksu_variant }}"
          
          add_variant() {
            local v=$1 has_susfs=$2
            local sus="false"
            [ "$has_susfs" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ] && sus="true"
            matrix=$(echo "$matrix" | jq -c --arg kv "$kv" --arg variant "$v" --argjson sus "$sus" '.include += [{"kernel_version":$kv,"variant":$variant,"susfs":$sus}]')
          }

          [[ "$variant" =~ ^(all|KOWSU)$ ]] && add_variant KOWSU true
          [[ "$variant" =~ ^(all|XXKSU)$ ]] && add_variant XXKSU true

          echo "metadata=$(jq -sc '.' /tmp/metadata.json)" >> $GITHUB_OUTPUT
          echo "build_matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    name: "Kernel ${{ matrix.kernel_version }} - ${{ matrix.variant }}${{ matrix.susfs && ' (SUSFS)' || '' }}"
    needs: setup
    if: needs.setup.outputs.build_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    env:
      SUSFS_SUFFIX: ${{ matrix.susfs && '-SUSFS' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-${{ matrix.variant }}${{ matrix.susfs && '-susfs' || '' }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Load Config
        id: cfg
        run: |
          config=$(jq -c '.["'${{ matrix.kernel_version }}'"]' .github/config/kernel_versions.json)
          echo "android_version=$(echo "$config" | jq -r '.android_version')" >> $GITHUB_OUTPUT
          sub_level=$(echo "$config" | jq -r '.default_sub_level')
          echo "sub_level=$sub_level" >> $GITHUB_OUTPUT
          revision=$(echo "$config" | jq -c '.revisions["'$sub_level'"]')
          echo "asb_date=$(echo "$revision" | jq -r '.asb_date')" >> $GITHUB_OUTPUT
          r_version=$(echo "$revision" | jq -r '.default_r')
          echo "r_version=$r_version" >> $GITHUB_OUTPUT
          echo "r_suffix=$([ "$r_version" != "none" ] && echo "_$r_version" || echo '')" >> $GITHUB_OUTPUT
          echo "clang_version=$(echo "$config" | jq -r '.default_clang')" >> $GITHUB_OUTPUT
          rust=$(echo "$config" | jq -r '.rust')
          echo "rust_enabled=$rust" >> $GITHUB_OUTPUT
          [ "$rust" = "true" ] && echo "rust_version=$(echo "$config" | jq -r '.default_rust')" >> $GITHUB_OUTPUT
          echo "mirror_tag=$(echo "$config" | jq -r '.mirror_tag')" >> $GITHUB_OUTPUT
          echo "anykernel_branch=$(echo "$config" | jq -r '.anykernel_branch')" >> $GITHUB_OUTPUT
          echo "kmi_version=$(echo "$config" | jq -r '.android_version')-${{ matrix.kernel_version }}" >> $GITHUB_OUTPUT

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true &
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bison flex bc aria2 ccache &

      - name: Restore Ccache
        if: inputs.use_ccache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache-${{ matrix.variant }}${{ matrix.susfs && '-susfs' || '' }}
          key: gki-${{ matrix.kernel_version }}-${{ steps.cfg.outputs.clang_version }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}-${{ matrix.variant }}${{ matrix.susfs && '-susfs' || '' }}-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: |
            gki-${{ matrix.kernel_version }}-${{ steps.cfg.outputs.clang_version }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}-${{ matrix.variant }}${{ matrix.susfs && '-susfs' || '' }}-

      - name: Setup Ccache Wrappers
        if: inputs.use_ccache
        run: |
          for i in $(seq 1 60); do which ccache && break; sleep 1; done
          which ccache || { echo "ccache not found after waiting"; exit 1; }
          CCACHE_PATH="${{ github.workspace }}/.ccache-bin"
          mkdir -p "$CCACHE_PATH" && rm -f "$CCACHE_PATH"/*
          for prog in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-size llvm-readelf llvm-strip; do
            ln -sf "$(which ccache)" "$CCACHE_PATH/$prog"
          done
          echo "$CCACHE_PATH" >> $GITHUB_PATH
          ccache -M 10G
          ccache -o hash_dir=false
          ccache -o compiler_check=content
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules
          ccache -o depend_mode=true
          ccache -o run_second_cpp=true
          ccache -z

      - name: Download Toolchains & Kernel Source
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          MIDORI_MIRROR="https://github.com/${{ github.repository }}/releases/download/${{ steps.cfg.outputs.mirror_tag }}"
          CLANG_TAR="clang-${{ steps.cfg.outputs.clang_version }}.tar.gz"
          KERNEL_TAR="${{ steps.cfg.outputs.android_version }}-${{ matrix.kernel_version }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}.tar.gz"
          if [ "${{ inputs.source_mirror }}" = "google" ]; then
            GOOGLE_REF=$([ "${{ steps.cfg.outputs.r_version }}" = "none" ] && echo "heads" || echo "tags")
            KERNEL_BASE_URL="https://android.googlesource.com/kernel/common/+archive/refs/$GOOGLE_REF"
          else
            KERNEL_BASE_URL="$MIDORI_MIRROR"
          fi
          aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/$CLANG_TAR" -o clang.tar.gz && mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz &
          aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/build-tools.tar.gz" -o build-tools.tar.gz && mkdir -p build-tools && tar -xzf build-tools.tar.gz -C build-tools && rm build-tools.tar.gz &
          if [ "${{ steps.cfg.outputs.rust_enabled }}" = "true" ]; then
            RUST_TAR="rust-${{ steps.cfg.outputs.rust_version }}.tar.gz"
            aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/clang-tools.tar.gz" -o clang-tools.tar.gz && mkdir -p clang-tools && tar -xzf clang-tools.tar.gz -C clang-tools && rm clang-tools.tar.gz &
            aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/$RUST_TAR" -o rust.tar.gz && mkdir -p rust && tar -xzf rust.tar.gz -C rust && rm rust.tar.gz &
          fi
          aria2c -s16 -x16 -k1M "$KERNEL_BASE_URL/$KERNEL_TAR" -o common.tar.gz && mkdir -p common && tar -xzf common.tar.gz -C common &
          wait
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      - name: Setup KernelSU
        working-directory: kernel_workspace/common
        run: |
          case "${{ matrix.variant }}" in
            KOWSU)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.kowsu_branch }}"
              git clone --branch="${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(srctree)/$(src) -I$(srctree)/$(src)/include -I$(src) -I$(src)/include|' KernelSU/kernel/Kbuild
              ;;
            XXKSU)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.xxksu_branch }}"
              git clone --branch="${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              if [ -f "${{ github.workspace }}/.github/scripts/setup_midorixx.sh" ]; then
                bash "${{ github.workspace }}/.github/scripts/setup_midorixx.sh"
              fi
              ;;
          esac
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SUSFS
        if: matrix.susfs
        working-directory: kernel_workspace/common
        run: |
          SUSFS_DIR="${{ github.workspace }}/susfs4ksu"
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu "$SUSFS_DIR"
            git -C "$SUSFS_DIR" checkout "${{ inputs.susfs_commit }}"
          else
            git clone --depth=1 --branch="gki-${{ steps.cfg.outputs.kmi_version }}" https://gitlab.com/simonpunk/susfs4ksu "$SUSFS_DIR"
          fi
          cp "$SUSFS_DIR"/kernel_patches/fs/* fs/
          cp "$SUSFS_DIR"/kernel_patches/include/linux/* include/linux/
          case "${{ matrix.variant }}" in
            KOWSU)
              if [ -f "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${{ steps.cfg.outputs.kmi_version }}.patch" ]; then
                patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${{ steps.cfg.outputs.kmi_version }}.patch"
              fi
              if [ -f "${{ github.workspace }}/.github/patches/10_enable_susfs_for_ksu.patch" ]; then
                patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/10_enable_susfs_for_ksu.patch"
              fi
              ;;
            XXKSU)
              if [ -f "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/51_deinlined_susfs_hooks_gki-${{ steps.cfg.outputs.kmi_version }}.patch" ]; then
                patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/51_deinlined_susfs_hooks_gki-${{ steps.cfg.outputs.kmi_version }}.patch"
              fi
              if [ -f "${{ github.workspace }}/.github/patches/11_enable_susfs_for_ksu.patch" ]; then
                patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/11_enable_susfs_for_ksu.patch"
              fi
              ;;
          esac

      - name: Setup Manual Hooks (XXKSU)
        if: matrix.variant == 'XXKSU' && inputs.hook_mode != 'hookless'
        working-directory: kernel_workspace/common
        run: |
          if [ -f "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/scope-min-manual-hooks-v2.2.patch" ]; then
            patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/scope-min-manual-hooks-v2.2.patch"
          fi

      - name: Inject Kernel Configs
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "kernel_workspace/common/arch/arm64/configs/gki_defconfig"
          build_config_path: "kernel_workspace/common/build.config.gki"
          variant: ${{ matrix.variant }}
          enable_susfs: ${{ matrix.susfs }}
          localversion: ${{ inputs.kernel_localversion }}
          use_droidspaces: false
          hook_mode: ${{ inputs.hook_mode }}

      - name: Save Commit Info
        working-directory: kernel_workspace/common
        run: |
          COMMIT_DIR="$(pwd)/commit_info"
          mkdir -p "$COMMIT_DIR"
          cd KernelSU
          save_ksu_commit() {
            git rev-parse HEAD > "$COMMIT_DIR/${1}_ksu_commit"
            git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/${1}_ksu_date"
          }
          save_susfs_commit() {
            if [ "${{ matrix.susfs }}" = "true" ] && [ -d "${{ github.workspace }}/susfs4ksu" ]; then
              pushd "${{ github.workspace }}/susfs4ksu" > /dev/null
              git rev-parse HEAD > "$COMMIT_DIR/susfs_commit"
              git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/susfs_date"
              popd > /dev/null
            fi
          }
          case "${{ matrix.variant }}" in
            KOWSU)
              git rev-list --count HEAD > "$COMMIT_DIR/ksu_commit_count"
              save_ksu_commit kowsu
              echo "${{ inputs.kowsu_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/kowsu_ksu_author"
              echo "${{ inputs.kowsu_branch }}" | cut -d: -f1 > "$COMMIT_DIR/kowsu_ksu_repo"
              save_susfs_commit
              ;;
            XXKSU)
              save_ksu_commit xxksu
              echo "${{ inputs.xxksu_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/xxksu_ksu_author"
              echo "${{ inputs.xxksu_branch }}" | cut -d: -f1 > "$COMMIT_DIR/xxksu_ksu_repo"
              save_susfs_commit
              ;;
          esac

      - name: Upload Commit Info
        uses: actions/upload-artifact@v7
        with:
          name: commit-info-${{ matrix.kernel_version }}-${{ matrix.variant }}${{ env.SUSFS_SUFFIX }}
          path: kernel_workspace/common/commit_info/
          retention-days: 1

      - name: Compile Kernel
        working-directory: kernel_workspace/common
        run: |
          WORK_DIR="${{ github.workspace }}/kernel_workspace"
          export PATH="${WORK_DIR}/clang/bin:${WORK_DIR}/build-tools/bin:${WORK_DIR}/clang-tools/bin:${WORK_DIR}/rust/bin:${PATH}"
          export LIBCLANG_PATH="${WORK_DIR}/clang/lib"
          if [ -d "${{ github.workspace }}/.ccache-bin" ]; then
            export PATH="${{ github.workspace }}/.ccache-bin:${PATH}"
          fi
          ROOT_REAL_PATH=$(dirname "$(readlink -f "$PWD")")
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export KCFLAGS="-fdebug-prefix-map=$ROOT_REAL_PATH=. -fmacro-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=. -no-canonical-prefixes -pipe -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          export SOURCE_DATE_EPOCH="${{ inputs.build_epoch }}"
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          export KBUILD_BUILD_HOST="${{ inputs.build_host }}"
          export KBUILD_BUILD_USER="${{ inputs.build_user }}"
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          [ "${{ inputs.use_ccache }}" = "true" ] && ccache -s

      - name: Package Kernel
        working-directory: kernel_workspace
        run: |
          IMAGE="common/out/arch/arm64/boot/Image"
          [ -f "$IMAGE" ] || { echo "Binary Missing!"; exit 1; }
          ZIP_NAME="${{ matrix.variant }}_Kernel-${{ matrix.kernel_version }}.${{ steps.cfg.outputs.sub_level }}${{ steps.cfg.outputs.r_suffix }}${{ env.SUSFS_SUFFIX }}.zip"
          git clone --depth=1 https://github.com/midori01/AnyKernel3 -b ${{ steps.cfg.outputs.anykernel_branch }} anykernel
          cp "$IMAGE" anykernel/
          cd anykernel && rm -rf .git && zip -r9 "../$ZIP_NAME" *
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save Ccache
        if: inputs.use_ccache
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache-${{ matrix.variant }}${{ matrix.susfs && '-susfs' || '' }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ matrix.kernel_version }}-${{ matrix.variant }}${{ env.SUSFS_SUFFIX }}${{ steps.cfg.outputs.r_suffix }}
          path: kernel_workspace/${{ env.ZIP_NAME }}

  release:
    needs: [setup, build]
    if: |
      always() &&
      inputs.release_type != 'no-release' &&
      needs.setup.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load metadata for 6.1
        id: meta
        run: |
          echo '${{ needs.setup.outputs.metadata }}' | jq -r '.[] | select(.kernel_version=="6.1")' > /tmp/meta.json
          while IFS='=' read -r key value; do echo "$key=$value" >> $GITHUB_OUTPUT; done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/meta.json)

      - uses: actions/download-artifact@v8
        with:
          pattern: 'commit-info-6.1-*'
          path: commit_info
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'Kernel-6.1-*'
          path: release_zips
          merge-multiple: true

      - name: Download KSU Toolkit Module
        run: |
          toolkit=""
          url=$(curl -sL "https://nightly.link/backslashxx/ksu_toolkit/workflows/module/master?preview" | grep -oP 'https://nightly\.link/backslashxx/ksu_toolkit/workflows/module/master/ksu_toolkit-\d+\.zip' | head -n 1)
          if [ -n "$url" ]; then
            toolkit=$(basename "$url")
            curl --fail -L -o "${{ github.workspace }}/release_zips/${toolkit}" "$url" || toolkit=""
          fi
          echo "TOOLKIT_FILE=$toolkit" >> $GITHUB_ENV

      - name: Download SUSFS Module
        if: inputs.enable_susfs == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sidex15/susfs4ksu-module --pattern "*.zip" --dir release_zips 2>/dev/null || true

      - name: Download KOWSU Manager APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo KOWX712/KernelSU --pattern "*.apk" --dir release_zips 2>/dev/null || true
          apk=$(ls release_zips/*.apk 2>/dev/null | head -n 1)
          echo "KOWSU_APK=$(basename "$apk" 2>/dev/null)" >> $GITHUB_ENV
          echo "KSUD_VERSION=$(echo "$apk" | grep -oP '\d+(?=-release\.apk$)' || echo "unknown")" >> $GITHUB_ENV

      - name: Read Commit Info
        id: ksu_info
        run: |
          variant="${{ inputs.ksu_variant }}"
          short_sha() { cut -c1-7 "$1"; }
          out() { echo "$1" >> $GITHUB_OUTPUT; }
          ksu_line() {
            local tag=$1 repo=$2 file=$3
            [ -f "$file" ] && [[ "$variant" =~ ^(all|$tag)$ ]] || return 0
            out "${tag,,}=- **$tag**: [\`$(short_sha "$file")\`](https://github.com/$repo/commit/$(cat "$file")) \`$(cat "${file%_commit}_date")\`"
          }
          if [ -f "commit_info/susfs_commit" ]; then
            sha=$(cat commit_info/susfs_commit)
            out "susfs_commit=\`$(short_sha commit_info/susfs_commit)\`"
            out "susfs_url=https://gitlab.com/simonpunk/susfs4ksu/-/commit/$sha"
            out "susfs_date=\`$(cat commit_info/susfs_date)\`"
          fi
          if [ -f "commit_info/kowsu_ksu_commit" ] && [ -f "commit_info/ksu_commit_count" ]; then
            out "driver_version=$((30000 + $(cat commit_info/ksu_commit_count)))"
          fi
          ksu_line KOWSU "$(cat commit_info/kowsu_ksu_repo 2>/dev/null)" commit_info/kowsu_ksu_commit
          ksu_line XXKSU "$(cat commit_info/xxksu_ksu_repo 2>/dev/null)" commit_info/xxksu_ksu_commit

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.setup.outputs.release_tag }}-6.1"
          name: "Kernel 6.1 (${{ needs.setup.outputs.release_tag }})"
          body: |
            - **Kernel Source**: [`${{ steps.meta.outputs.mirror_name }}`](${{ steps.meta.outputs.source_base_url }}/${{ steps.meta.outputs.android_version }}-6.1-${{ steps.meta.outputs.asb_date }}${{ steps.meta.outputs.r_suffix }}.tar.gz) `${{ steps.meta.outputs.android_version }}-6.1.${{ steps.meta.outputs.sub_level }}${{ steps.meta.outputs.r_suffix }}`
            ${{ steps.ksu_info.outputs.kowsu }}
            ${{ steps.ksu_info.outputs.xxksu }}
            ${{ steps.ksu_info.outputs.susfs_url && format('- **SUSFS**: [{0}]({1}) {2}', steps.ksu_info.outputs.susfs_commit, steps.ksu_info.outputs.susfs_url, steps.ksu_info.outputs.susfs_date) || '' }}
            - **KSU Driver**: `${{ steps.ksu_info.outputs.driver_version || env.KSUD_VERSION }}`　**KSUD Version**: `${{ env.KSUD_VERSION }}`
            - **Manager**: `${{ env.KOWSU_APK }}`
            - **Kernel Name (Spoofed)**: `6.1.${{ steps.meta.outputs.sub_level }}${{ inputs.kernel_localversion }}`
            - **Build Time (Spoofed)**: `${{ inputs.build_timestamp }}`
            - **Builder (Spoofed)**: `${{ inputs.build_user }}@${{ inputs.build_host }}`
            - **TMPFS**: ✅　**BBR**: ✅　**IPSET**: ✅
            - **KSU Toolkit**: ${{ env.TOOLKIT_FILE && format('✅ `({0})`', env.TOOLKIT_FILE) || '❌' }}
            - **Ccache**: ${{ inputs.use_ccache && '✅' || '❌' }}　**LLVM Clang**: `${{ steps.meta.outputs.clang_version }}`${{ steps.meta.outputs.rust_version && format('　**Rust**: `{0}`', steps.meta.outputs.rust_version) || '' }}
          files: |
            release_zips/*.zip
            release_zips/*.apk
          prerelease: ${{ inputs.release_type == 'pre-release' }}