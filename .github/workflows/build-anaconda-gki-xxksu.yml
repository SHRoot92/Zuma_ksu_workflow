name: Build anaconda GKI + xxKSU + SUSFS
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master
  GCC_VERSION: "14.2.rel1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      susfs_ver: ${{ steps.meta.outputs.susfs_ver }}
      gcc_ver: ${{ steps.meta.outputs.gcc_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          # 补充宿主机编译内核工具所需的依赖库，特别是 libmpc-dev
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libmpc-dev libmpfr-dev libgmp-dev libfdt-dev

      - name: Install GCC (Dynamic Toolchain)
        run: |
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/"${{ env.GCC_VERSION }}"/binrel/"
          ARCHIVE="arm-gnu-toolchain-"${{ env.GCC_VERSION }}"-x86_64-aarch64-none-linux-gnu.tar.xz"
          
          wget -q "${BASE_URL}/${ARCHIVE}" -O gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          git clone --depth=1 https://github.com/Trijal08/anaconda_kernel_google_tensynos -b anaconda-gki sultan
          cd sultan
          git submodule update --init --recursive
          cd ..
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply build-reproducibility patches
        working-directory: sultan
        run: |
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do
            [ -f "$p" ] && patch -p1 < "$p" || echo "Optional patch $p skipped."
          done

      - name: Collect build metadata
        id: meta
        run: |
          TC_PREFIX="$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-"
          
          S_TAG=$(git -C sultan rev-parse --short HEAD)
          chmod +x sh/get_ksuver.sh
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "integrated")
          SU_VER=$(grep -m1 'define SUSFS_VERSION' sultan/include/linux/susfs.h | grep -oP '".*?"' | tr -d '"' || echo "integrated")
          
          if [ -f "${TC_PREFIX}gcc" ]; then
            G_VER="${{ env.GCC_VERSION }}"
          else
            G_VER="Unknown-Error"
          fi
          
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=${SU_VER}" >> "$GITHUB_OUTPUT"
          echo "gcc_ver=${G_VER}" >> "$GITHUB_OUTPUT"

      - name: Integrate xxKSU Submodule
        run: |
          cd sultan
          if [ -d "drivers" ]; then DRIVER_DIR="drivers"; else DRIVER_DIR="common/drivers"; fi
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

      - name: Setup atp4pixel Config Pillars
        run: |
          cd sultan
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # 强力确保禁用 GCC 插件，防止 GCC 15.2 环境下出现兼容性导致的死循环报错
          sed -i 's/CONFIG_GCC_PLUGINS=y/CONFIG_GCC_PLUGINS=n/' "$DEFCONFIG"
          echo "CONFIG_GCC_PLUGINS=n" >> "$DEFCONFIG"

          echo "" >> "$DEFCONFIG"
          cat <<EOF >> "$DEFCONFIG"
          # KernelSU Core
          CONFIG_KSU=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # SUSFS Stealth Pillars
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # Networking & System Pillars (atpd)
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_IP_SET=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          EOF
          
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/' "$DEFCONFIG"
          echo "CONFIG_WERROR=n" >> "$DEFCONFIG"

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.TOOLCHAIN_PATH }}
          CC: ${{ env.TOOLCHAIN_PATH }}gcc
          HOSTCC: gcc
        run: |
          # 必须显式指定 ARCH=arm64 避免触发 x86 retpoline 检查
          # 必须保留系统 HOSTCC 以编译 scripts 目录
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" HOSTCC="$HOSTCC" gki_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" HOSTCC="$HOSTCC" -j"$(nproc --all)"

      - name: Package AnyKernel3
        id: package
        run: |
          if [ -f sultan/out/arch/arm64/boot/Image.lz4 ]; then
            cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          else
            cp sultan/out/arch/arm64/boot/Image AK3/Image
          fi
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          SU_VER="${{ steps.meta.outputs.susfs_ver }}"
          
          ZIP_NAME="anaconda-gki-gs201-${S_TAG}-xxKSU-r${K_VER}-SUSFS-${SU_VER}.zip"
          ( cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*" )
          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gs201-kernel
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          K_VER: ${{ needs.build.outputs.ksu_ver }}
          SU_VER: ${{ needs.build.outputs.susfs_ver }}
          S_TAG: ${{ needs.build.outputs.sultan_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_ver }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          gh release create "$TAG" artifacts/*.zip \
            --title "Kernel Build — $TAG" \
            --notes "
            ### 🚀 Build Information

          | Component | Details |
          | :--- | :--- |
          | **Kernel Base** | anaconda gki ($S_TAG) |
          | **xxKSU Ver** | \`r$K_VER\` |
          | **SUSFS Ver** | \`$SU_VER\` |
          | **Compiler** | GCC $GCC_VER |

            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v3) + FQ
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            
            > Built for Pixel 7 (gs201)."
