name: Build Sultan + KSUN

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSN_REPO: https://github.com/MirahSyakilla/KSUN
  KSN_BRANCH: susfs+nomount-hookless
  GCC_VERSION: "14.2.rel1"

jobs:
  build:
    name: Build gs201 Kernel
    runs-on: ubuntu-latest
    outputs:
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      s_tag: ${{ steps.meta.outputs.s_tag }}
      gcc_version: ${{ steps.meta.outputs.gcc_version }}
      
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GCC
        run: |
          BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/"${{ env.GCC_VERSION }}"/binrel/"
          ARCHIVE="arm-gnu-toolchain-"${{ env.GCC_VERSION }}"-x86_64-aarch64-none-linux-gnu.tar.xz"
          
          wget -q "${BASE_URL}/${ARCHIVE}" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          echo "GCC_PATH=$GITHUB_WORKSPACE/arm-gnu-toolchain-${{ env.GCC_VERSION }}-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

      - name: Clone Source
        run: |
          git clone --depth=1 https://github.com/kerneltoast/android_kernel_google_tensynos -b 16.0.0-sultan sultan
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Setup KSUN (Reference Integration Method)
        working-directory: sultan
        run: |
          echo "[+] Cloning KSUN repository..."
          git clone  --branch "${{ env.KSN_BRANCH }}" "${{ env.KSN_REPO }}.git" KernelSU
          
          echo "[+] Setting up symlink and driver configurations..."
          ln -sf ../KernelSU/kernel drivers/kernelsu
          
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "[+] Fixing uapi paths and include headers..."
          cp -r KernelSU/uapi KernelSU/kernel/uapi 2>/dev/null || true
          echo 'ccflags-y += -I$(srctree)/drivers/kernelsu' >> drivers/kernelsu/Makefile
          mkdir -p include/uapi
          cp -f KernelSU/kernel/policy/*.h include/uapi/ 2>/dev/null || true
          cp -f KernelSU/kernel/policy/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/include/*.h include/ 2>/dev/null || true
          cp -f KernelSU/kernel/uapi/*.h include/uapi/ 2>/dev/null || true


          echo "[+] Applying Sultan-specific patches..."
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch || true
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch || true
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch || true

      - name: Fix KernelSU icache flush macro
        working-directory: sultan
        run: |
         sed -i 's/#define ksu_flush_icache(start, end) caches_clean_inval_pou/#define ksu_flush_icache(start, end) caches_clean_inval_pou(start, end)/' KernelSU/drivers/kernelsu/hook/arm64/patch_memory.c
      
      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          
          # 直接使用 Makefile 的版本计算方法
          cd sultan/KernelSU
          if git rev-parse --git-dir > /dev/null 2>&1; then
            K_VER=$(git rev-list --count HEAD)
            KSU_VERSION=$((30000 + K_VER))
          else
            KSU_VERSION=1
          fi
          cd ../..
          
          GCC_VER_FULL=$(${GCC_PATH}gcc -v 2>&1 | grep "gcc version" | awk '{print $3}')
          GCC_VER=$(echo "$GCC_VER_FULL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "ksu_version=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"
          echo "gcc_version=$GCC_VER" >> "$GITHUB_OUTPUT"
          
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          
          echo "================================"
          echo "📊 Build Metadata"
          echo "================================"
          echo "🏷️  Sultan Tag: $S_TAG"
          echo "🔧 Raw KSUN version: $K_VER"
          echo "🔧 KSUN version (kernel): r$KSU_VERSION"
          echo "⚙️  GCC Version: $GCC_VER"
          echo "================================"
      # ===================================================================

      - name: Global Defconfig Analysis
        working-directory: sultan
        run: |
          echo "=== Scanning All Relevant Defconfigs ==="
          TARGET_DEFS=("gs201_defconfig")
          CHECK_FLAGS=("CONFIG_NETFILTER_ADVANCED" "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE" "CONFIG_KSU")
          for def in "${TARGET_DEFS[@]}"; do
            CONF_PATH="arch/arm64/configs/$def"
            echo "[*] Checking $def..."
            for flag in "${CHECK_FLAGS[@]}"; do
              grep "$flag" "$CONF_PATH" || echo "  - $flag: missing"
            done
          done

      - name: Inject Configuration (Fortress Deep Unlock)
        working-directory: sultan
        env:
         CROSS_COMPILE: ${{ env.GCC_PATH }}
         CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" gs201_defconfig
    
          cat >> out/.config << 'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          # CONFIG_TCP_CONG_BIC is not set
          # CONFIG_TCP_CONG_WESTWOOD is not set
          # CONFIG_TCP_CONG_HTCP is not set
          CONFIG_DEFAULT_BBR=y
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_KSU_KPROBES_HOOK=y
          # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_KPROBES_SUSFS=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          EOF
    
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/google-devices/gs201/dts/*.dtb > AK3/dtb
          
          ZIP_NAME="Sultan-gs201-$(date +'%Y%m%d')-KSUN-r${{ env.KSU_VERSION }}.zip"
          
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          
          echo "ZIP_PATH=$PWD/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Sultan-gs201
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true
          
      - name: List artifacts (debug)
        run: |
          echo "=== artifacts directory contents ==="
          ls -la ./artifacts/
          echo "=== find zip files ==="
          find ./artifacts -name "*.zip" -type f
          
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          GCC_VER: ${{ needs.build.outputs.gcc_version }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          KSU_VERSION: ${{ needs.build.outputs.ksu_version }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          ZIP_FILE=$(find ./artifacts -name "*.zip" -type f | head -1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          
          gh release create "$TAG" "$ZIP_FILE" \
            --title "Kernel Build — $TAG" \
            --notes "
            ### 🚀 Build Information
            | Component | Details |
            | :--- | :--- |
            | **Kernel Base** | Sultan ($S_TAG) |
            | **Manager** | [yapixel/KSUN](https://github.com/yapixel/KSUN) |
            | **KSUN Ver** | \`r$KSU_VERSION\` (raw: $KSU_VER) |
            | **Compiler** | GCC $GCC_VER |
            
            ### 🛠️ Networking Features (Fortress)
            - **TCP Congestion:** BBR (v1) + FQ
            - **Routing:** Policy Routing (Table 1066) + IPSet (64k)
            - **Fixes:** ADDRTYPE Match, Google VPN (XFRM), TTL 64 Share
            
            > Built for Pixel 7 (gs201)."
