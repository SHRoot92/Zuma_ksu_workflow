name: Generate & Verify Clean Git Patch

on:
  workflow_dispatch:

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Target Workspace
        run: |
          mkdir -p work_tree/security
          cd work_tree
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 获取 Sultan tensynos 目标 security.c
          curl -sSL "https://raw.githubusercontent.com/kerneltoast/android_kernel_google_tensynos/refs/heads/16.0.0-sultan/security/security.c" -o security/security.c

          # 2. 提交初始版本作为 Diff 基准
          git add security/security.c
          git commit -m "base: pristine security.c from 16.0.0-sultan"

      - name: Perform AST-Level Hook Injection
        working-directory: work_tree
        run: |
          python3 - << 'EOF'
          import re
          import sys

          file_path = "security/security.c"
          with open(file_path, "r", encoding="utf-8") as f:
              code = f.read()

          original_code = code

          # 1. 确保头部包含 manual hooks 依赖头文件 (若需要)
          if "#include <linux/security.h>" in code and "/* MANUAL_SECURITY_HOOKS */" not in code:
              code = code.replace(
                  "#include <linux/security.h>",
                  "#include <linux/security.h>\n/* MANUAL_SECURITY_HOOKS */"
              )

          # 2. 需要暴露与注入的 security hooks 列表
          target_hooks = [
              "security_task_fix_setuid",
              "security_task_prctl",
              "security_inode_create",
              "security_inode_unlink",
              "security_inode_link",
              "security_inode_symlink",
              "security_inode_mkdir",
              "security_inode_rmdir",
              "security_inode_mknod",
              "security_inode_rename",
              "security_inode_setattr",
              "security_inode_getattr",
              "security_path_truncate",
              "security_file_permission",
              "security_file_open",
              "security_bprm_check",
              "security_bprm_creds_for_exec"
          ]

          modified_count = 0

          # 3. 逐个定位函数体并在末尾补充 EXPORT_SYMBOL (如缺失)
          for hook in target_hooks:
              # 匹配形如 int security_xxx(...) { ... } 的完整函数块
              pattern = rf'((\nint\s+{hook}\s*\([^)]*\)\s*\{{)([\s\S]*?\n\}}))'
              match = re.search(pattern, code)
              if match:
                  full_func = match.group(1)
                  # 检查函数后是否已经存在 EXPORT_SYMBOL
                  export_pattern = rf'{hook}\s*\)\s*;\s*\nEXPORT_SYMBOL(?:_GPL)?\s*\(\s*{hook}\s*\);'
                  if not re.search(export_pattern, code):
                      new_func = full_func + f"\nEXPORT_SYMBOL({hook});"
                      code = code.replace(full_func, new_func, 1)
                      modified_count += 1
                      print(f"[OK] Patched and exported: {hook}")
              else:
                  print(f"[WARN] Function {hook} not matched via regex pattern", file=sys.stderr)

          if code == original_code:
              print("Error: No modifications were made to security.c!", file=sys.stderr)
              sys.exit(1)

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(code)

          print(f"Injection finished: {modified_count} hooks processed.")
          EOF

      - name: Generate Patch & Self-Test Verification
        working-directory: work_tree
        run: |
          mkdir -p ../artifacts

          # 生成标准 git diff 补丁
          git diff security/security.c > ../artifacts/manual-security-hooks-tensynos.patch

          # 校验 1: 补丁大小是否大于 0
          if [ ! -s ../artifacts/manual-security-hooks-tensynos.patch ]; then
            echo "::error ::Generated patch is empty!"
            exit 1
          fi

          echo "=== Patch Generation Successful ==="
          echo "Patch size: $(wc -c < ../artifacts/manual-security-hooks-tensynos.patch) bytes"

          # 校验 2: 回退代码，实测 git apply 能否 100% 顺利打入
          echo "=== Running Self-Verification Test (git apply --check) ==="
          git checkout security/security.c

          if git apply --check ../artifacts/manual-security-hooks-tensynos.patch; then
            echo "::notice ::Self-test PASSED: Patch applies cleanly without any rejects."
            # 实际打入并生成 format-patch
            git apply ../artifacts/manual-security-hooks-tensynos.patch
            git add security/security.c
            git commit -m "security: add manual security hooks exports for tensynos"
            git format-patch -1 HEAD -o ../artifacts/
          else
            echo "::error ::Self-test FAILED: Patch cannot be applied cleanly to pristine file!"
            exit 1
          fi

      - name: Upload Verified Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-clean-patch
          path: artifacts/
