name: Generate Git-Style Clean Patch

on:
  workflow_dispatch:
    inputs:
      target_file_url:
        description: 'Raw URL of the target file'
        required: true
        default: 'https://raw.githubusercontent.com/kerneltoast/android_kernel_google_tensynos/refs/heads/16.0.0-sultan/security/security.c'
      patch_url:
        description: 'Raw URL or local path of the original patch'
        required: true
        default: 'https://raw.githubusercontent.com/yapixel/cheetah_kernel_build/main/.github/patches/manual-security-hooks-v2.0.patch'

jobs:
  build-git-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git Workspace & Target Base
        run: |
          mkdir -p work_tree
          cd work_tree

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create directory structure and download target source
          mkdir -p security
          curl -sSL "${{ github.event.inputs.target_file_url }}" -o security/security.c

          # Commit target base state
          git add security/security.c
          git commit -m "base: pristine security.c from target tree"

      - name: Fetch and Apply Patch
        working-directory: work_tree
        run: |
          PATCH_SRC="${{ github.event.inputs.patch_url }}"
          if [[ "$PATCH_SRC" =~ ^https?:// ]]; then
            curl -sSL "$PATCH_SRC" -o input.patch
          else
            cp "../$PATCH_SRC" input.patch
          fi

          echo "=== Attempting git apply with 3way / reject fallback ==="
          if git apply --3way --verbose input.patch; then
            echo "Cleanly applied via git apply --3way."
          else
            echo "Direct apply had rejects. Falling back to fuzzy patch apply..."
            patch -p1 --fuzz=3 --merge < input.patch || true
          fi

      - name: Generate Standard Git Patch
        working-directory: work_tree
        run: |
          mkdir -p ../artifacts

          # Generate git-style unified diff
          git diff security/security.c > ../artifacts/manual-security-hooks-v2.0-clean.patch

          # Also generate commit-ready format-patch
          git add security/security.c
          git commit -m "security: apply manual security hooks v2.0" || true
          git format-patch -1 HEAD --output-directory ../artifacts/ || true

          # Collect any leftover reject files if hunk failed completely
          find . -name "*.rej" -exec cp {} ../artifacts/ \; 2>/dev/null || true

      - name: Upload Clean Git Patch
        uses: actions/upload-artifact@v4
        with:
          name: clean-git-patch
          path: artifacts/
