name: Apply & Regenerate KSU Security Patch (Final Fix)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '目标内核分支 (例如: 16.0.0-sultan)'
        required: true
        default: '16.0.0-sultan'
      original_patch_url:
        description: '原始补丁的URL'
        required: false
        default: 'https://raw.githubusercontent.com/yapixel/cheetah_kernel_build/main/.github/patches/6.12.manual-security-hooks-v2.0.patch'

jobs:
  patch-and-regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target kernel repository
        uses: actions/checkout@v4
        with:
          repository: kerneltoast/android_kernel_google_tensynos
          ref: ${{ github.event.inputs.target_branch }}
          path: kernel

      - name: Download original patch
        run: |
          echo "下载原始补丁..."
          curl -L -o original.patch ${{ github.event.inputs.original_patch_url }}
          echo "原始补丁内容预览:"
          head -n 30 original.patch

      - name: Prepare kernel source and attempt to apply patch
        working-directory: kernel
        run: |
          # 备份原始文件（确保路径正确）
          cp security/security.c security/security.c.orig
          ls -la security/security.c.orig  # 验证备份存在
          
          echo "尝试应用原始补丁..."
          # 尝试应用补丁，如果失败则生成 .rej 文件
          if ! git apply --check --whitespace=fix ../original.patch 2> apply_error.log; then
            echo "⚠️ 原始补丁无法干净应用，尝试生成 .rej 文件以分析冲突..."
            git apply --reject --whitespace=fix ../original.patch || true
            
            # 检查是否生成了 .rej 文件
            if ls security/*.rej 1> /dev/null 2>&1; then
              echo "❌ 补丁存在冲突，.rej 文件已生成。"
              echo "冲突详情:"
              cat security/*.rej
              
              # 恢复原始文件，准备重新生成
              cp security/security.c.orig security/security.c
              echo "NEED_REGENERATE=true" >> $GITHUB_ENV
            else
              echo "❌ 补丁应用失败，但未生成 .rej 文件。"
              cat apply_error.log
              exit 1
            fi
          else
            echo "✅ 原始补丁可以干净应用！"
            git apply --whitespace=fix ../original.patch
            echo "NEED_REGENERATE=false" >> $GITHUB_ENV
          fi

      - name: Regenerate patch from current source (if needed)
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          echo "基于当前内核源码重新生成 KSU 补丁..."
          
          python3 << 'EOF'
          import re
          import sys
          
          with open('security/security.c', 'r') as f:
              code = f.read()
          
          # 定义需要修改的函数和对应的调用
          hooks = {
              'security_bprm_check': 'ksu_bprm_check(bprm);',
              'security_inode_rename': 'ksu_inode_rename(old_dir, old_dentry, new_dir, new_dentry);',
              'security_file_permission': 'ksu_file_permission(file, mask);',
              'security_task_fix_setuid': 'ksu_task_fix_setuid(new, old, flags);',
              'security_setprocattr': 'ksu_hide_setprocattr(name, value, size);'
          }
          
          modified_code = code
          inserted_count = 0
          not_found = []
          
          for func_name, hook_call in hooks.items():
              ksu_func = func_name.replace('security_', 'ksu_')
              
              # 检查是否已存在 KSU 调用
              if ksu_func in modified_code:
                  print(f"⏭️  {func_name}: KSU hook 已存在，跳过。")
                  continue
              
              # 匹配函数定义：支持 int func_name(...) { 或 int __maybe_unused func_name(...) {
              pattern = rf'^(.*?\bint\s+(?:__maybe_unused\s+)?{func_name}\s*\([^)]*\)\s*\{{)'
              match = re.search(pattern, modified_code, re.MULTILINE)
              
              if not match:
                  not_found.append(func_name)
                  print(f"❌ {func_name}: 在当前内核中未找到函数定义。")
                  continue
              
              # 在函数体开头插入 KSU 调用
              func_start = match.end()
              pos = func_start
              while pos < len(modified_code) and modified_code[pos] in ' \t\n\r':
                  pos += 1
              
              insert_code = f'\n#ifdef CONFIG_KSU\n\t{hook_call}\n#endif\n'
              modified_code = modified_code[:pos] + insert_code + modified_code[pos:]
              inserted_count += 1
              print(f"✅ {func_name}: 已插入 KSU hook。")
          
          # 添加外部声明（如果不存在）
          if inserted_count > 0 and 'extern int ksu_bprm_check' not in modified_code:
              ksu_decls = '''
          #ifdef CONFIG_KSU
          extern int ksu_bprm_check(struct linux_binprm *bprm);
          extern int ksu_inode_rename(struct inode *old_dir, struct dentry *old_dentry, 
          \t\t\t\tstruct inode *new_dir, struct dentry *new_dentry);
          extern int ksu_task_fix_setuid(struct cred *new, const struct cred *old, int flags);
          extern int ksu_file_permission(struct file *file, int mask);
          extern int ksu_hide_setprocattr(const char *name, void *value, size_t size);
          #endif
          '''
              # 在最后一个 #include 后插入
              include_matches = list(re.finditer(r'^#include\s+[<"][^>"]+[>"]', modified_code, re.MULTILINE))
              if include_matches:
                  last_include_end = include_matches[-1].end()
                  modified_code = modified_code[:last_include_end] + '\n' + ksu_decls + modified_code[last_include_end:]
                  print("✅ 已添加 KSU 外部声明。")
              else:
                  modified_code = ksu_decls + modified_code
                  print("✅ 已在文件开头添加 KSU 外部声明。")
          
          # 写回修改
          if inserted_count > 0:
              with open('security/security.c', 'w') as f:
                  f.write(modified_code)
              print(f"\n🎉 成功重新生成补丁！共插入 {inserted_count} 个 KSU hook。")
              if not_found:
                  print(f"⚠️ 以下函数未找到: {', '.join(not_found)}")
          else:
              print("\n⚠️ 没有插入任何新的 KSU hook。")
              sys.exit(1)
          EOF

      - name: Generate final patch with minimal context
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          echo "生成最终补丁文件 (使用 -U3 减少上下文依赖)..."
          
          if ! diff -q security/security.c security/security.c.orig > /dev/null; then
              # 使用更少的上下文行 (-U3) 生成补丁，减少冲突可能
              git diff -U3 security/security.c > ../regenerated-security-hooks.patch
              # 清理尾随空格（patch 命令对尾随空格敏感）
              sed -i 's/[[:space:]]*$//' ../regenerated-security-hooks.patch
              echo "✅ 补丁已生成并清理了尾随空格: regenerated-security-hooks.patch"
              echo "补丁大小: $(wc -l < ../regenerated-security-hooks.patch) 行"
          else
              echo "ℹ️  security.c 无任何变化，补丁为空。"
              touch ../regenerated-security-hooks.patch
          fi

      - name: Verify final patch with multiple methods
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          if [ ! -s ../regenerated-security-hooks.patch ]; then
            echo "⚠️  没有生成新补丁，跳过验证。"
            exit 0
          fi
          
          echo "验证重新生成的补丁..."
          
          # 确保备份文件存在
          if [ ! -f security/security.c.orig ]; then
              echo "❌ 备份文件 security/security.c.orig 不存在！"
              cp security/security.c security/security.c.orig
          fi
          
          # 创建测试副本
          cp security/security.c.orig security/security.c.test
          
          # 方法1: 标准 git apply 检查
          echo "方法1: 尝试 git apply..."
          if git apply --check --whitespace=fix ../regenerated-security-hooks.patch 2> check_error.log; then
              echo "✅ 补丁验证通过 (git apply)！"
              # 实际应用补丁到测试文件
              cp security/security.c.orig security/security.c.test
              git apply --whitespace=fix ../regenerated-security-hooks.patch
              echo "✅ 补丁已成功应用到测试文件。"
              exit 0
          fi
          
          echo "⚠️  git apply 检查失败，尝试使用 patch 命令..."
          echo "错误详情:"
          cat check_error.log
          
          # 方法2: 使用 patch 命令（更宽容）
          echo "方法2: 尝试 patch 命令..."
          cd security
          # 使用 -p1 并指定文件路径，避免交互
          if patch -p1 --fuzz=3 --forward < ../../regenerated-security-hooks.patch 2> patch_error.log; then
              echo "✅ 补丁通过 patch 命令应用成功！"
              cd ..
              # 生成更宽松的补丁
              diff -u security/security.c.orig security/security.c > ../regenerated-security-hooks-fuzzy.patch
              # 清理尾随空格
              sed -i 's/[[:space:]]*$//' ../regenerated-security-hooks-fuzzy.patch
              echo "✅ 已生成宽松版本补丁: regenerated-security-hooks-fuzzy.patch"
              exit 0
          else
              echo "❌ patch 命令也失败了。"
              echo "patch 错误:"
              cat patch_error.log
              
              # 恢复原始文件
              cp security/security.c.orig security/security.c
              
              # 方法3: 尝试逐个 hunk 应用
              echo "方法3: 尝试逐个 hunk 应用..."
              cd security
              
              # 提取所有 hunk 并逐个尝试
              awk '/^@@ /{n++; f=sprintf("hunk_%03d.patch", n);} {print > f;}' ../../regenerated-security-hooks.patch
              
              success_count=0
              for hunk in hunk_*.patch; do
                  if [ -f "$hunk" ]; then
                      # 跳过文件头，只保留 hunk 内容
                      sed -n '/^@@ /,$p' "$hunk" > temp_hunk.patch
                      if patch -p1 --fuzz=2 --forward < temp_hunk.patch 2>/dev/null; then
                          echo "  ✅ Hunk 应用成功: $hunk"
                          success_count=$((success_count + 1))
                      else
                          echo "  ⚠️  Hunk 应用失败: $hunk"
                      fi
                  fi
              done
              
              echo "成功应用 $success_count 个 hunk"
              cd ..
              
              # 生成最终的补丁
              if ! diff -q security/security.c security/security.c.orig > /dev/null; then
                  diff -u security/security.c.orig security/security.c > ../regenerated-security-hooks-partial.patch
                  # 清理尾随空格
                  sed -i 's/[[:space:]]*$//' ../regenerated-security-hooks-partial.patch
                  echo "✅ 生成了部分应用的补丁: regenerated-security-hooks-partial.patch"
                  echo "⚠️  此补丁可能需要手动检查剩余冲突。"
                  
                  # 显示修改状态
                  echo "修改统计:"
                  diff --stat security/security.c security/security.c.orig || true
              else
                  echo "❌ 所有方法均失败，无法生成可用补丁。"
                  exit 1
              fi
          fi

      - name: Upload patches and modified file
        uses: actions/upload-artifact@v4
        with:
          name: ksu-patches-and-source
          path: |
            original.patch
            regenerated-security-hooks*.patch
            kernel/security/security.c
            kernel/security/security.c.orig
            kernel/security/*.rej 2>/dev/null || true
          retention-days: 30

      - name: Workflow Summary
        run: |
          echo "## ✅ 工作流执行完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的文件：" >> $GITHUB_STEP_SUMMARY
          echo "- **original.patch**: 原始补丁" >> $GITHUB_STEP_SUMMARY
          echo "- **regenerated-security-hooks.patch**: 标准补丁 (已清理尾随空格)" >> $GITHUB_STEP_SUMMARY
          echo "- **regenerated-security-hooks-fuzzy.patch**: 宽松版本补丁 (使用 patch --fuzz)" >> $GITHUB_STEP_SUMMARY
          echo "- **regenerated-security-hooks-partial.patch**: 部分应用的补丁 (如有冲突)" >> $GITHUB_STEP_SUMMARY
          echo "- **security.c**: 最终修改后的安全源文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 如何使用：" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 Artifact 并解压。" >> $GITHUB_STEP_SUMMARY
          echo "2. 优先尝试: \`git apply regenerated-security-hooks.patch\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 如果失败: \`patch -p1 < regenerated-security-hooks-fuzzy.patch\`" >> $GITHUB_STEP_SUMMARY
          echo "4. 如果仍有问题，手动检查 \`.rej\` 文件。" >> $GITHUB_STEP_SUMMARY