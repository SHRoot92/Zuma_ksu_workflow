name: Apply & Regenerate KSU Security Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '目标内核分支 (例如: 16.0.0-sultan)'
        required: true
        default: '16.0.0-sultan'
      original_patch_url:
        description: '原始补丁的URL'
        required: false
        default: 'https://raw.githubusercontent.com/yapixel/cheetah_kernel_build/main/.github/patches/6.12.manual-security-hooks-v2.0.patch'

jobs:
  patch-and-regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target kernel repository
        uses: actions/checkout@v4
        with:
          repository: kerneltoast/android_kernel_google_tensynos
          ref: ${{ github.event.inputs.target_branch }}
          path: kernel

      - name: Download original patch
        run: |
          echo "下载原始补丁..."
          curl -L -o original.patch ${{ github.event.inputs.original_patch_url }}
          echo "原始补丁内容预览:"
          head -n 20 original.patch

      - name: Prepare kernel source and attempt to apply patch
        working-directory: kernel
        run: |
          # 备份原始文件
          cp security/security.c security/security.c.orig
          
          echo "尝试应用原始补丁..."
          # 尝试应用补丁。如果失败，尝试更宽松的模式并生成.rej文件
          if ! git apply --check --whitespace=fix ../original.patch 2> apply_error.log; then
            echo "⚠️ 原始补丁无法干净应用，尝试生成.rej文件以分析冲突..."
            git apply --reject --whitespace=fix ../original.patch || true
            
            # 检查是否生成了.rej文件
            if ls security/*.rej 1> /dev/null 2>&1; then
              echo "❌ 补丁存在冲突，.rej文件已生成。工作流将尝试重新生成新补丁。"
              echo "冲突详情:"
              cat security/*.rej
              
              # 恢复原始文件，准备重新生成
              cp security/security.c.orig security/security.c
              echo "NEED_REGENERATE=true" >> $GITHUB_ENV
            else
              echo "❌ 补丁应用失败，但未生成.rej文件，原因未知。"
              cat apply_error.log
              exit 1
            fi
          else
            echo "✅ 原始补丁可以干净应用！"
            git apply --whitespace=fix ../original.patch
            echo "NEED_REGENERATE=false" >> $GITHUB_ENV
          fi

      - name: Regenerate patch from current source (if needed)
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          echo "基于当前内核源码重新生成KSU补丁..."
          
          # 这个Python脚本会读取原始补丁中要修改的函数列表，并在当前security.c中寻找并插入
          python3 << 'EOF'
          import re
          import sys
          
          # 读取当前内核的security.c
          with open('security/security.c', 'r') as f:
              code = f.read()
          
          # 从原始补丁中提取需要插入的KSU调用模式
          # 手动定义需要修改的函数和对应的调用 (基于你提供的补丁)
          hooks = {
              'security_bprm_check': 'ksu_bprm_check(bprm);',
              'security_inode_rename': 'ksu_inode_rename(old_dir, old_dentry, new_dir, new_dentry);',
              'security_file_permission': 'ksu_file_permission(file, mask);',
              'security_task_fix_setuid': 'ksu_task_fix_setuid(new, old, flags);',
              'security_setprocattr': 'ksu_hide_setprocattr(name, value, size);'
          }
          
          modified_code = code
          inserted_count = 0
          
          for func_name, hook_call in hooks.items():
              # 检查是否已存在KSU调用
              ksu_func = func_name.replace('security_', 'ksu_')
              if ksu_func in modified_code:
                  print(f"⏭️  {func_name}: KSU hook 已存在，跳过。")
                  continue
              
              # 查找函数定义 (匹配 int func_name(...) { )
              pattern = rf'^(.*?\bint\s+(?:__maybe_unused\s+)?{func_name}\s*\([^)]*\)\s*\{{)'
              match = re.search(pattern, modified_code, re.MULTILINE)
              
              if not match:
                  print(f"❌ {func_name}: 在当前内核中未找到函数定义。")
                  continue
              
              # 在函数体开头插入KSU调用
              # 找到函数体的起始位置（第一个 '{' 之后）
              func_start = match.end()
              # 跳过空白和换行，定位到函数体实际开始处
              pos = func_start
              while pos < len(modified_code) and modified_code[pos] in ' \t\n\r':
                  pos += 1
              
              insert_code = f'\n#ifdef CONFIG_KSU\n\t{hook_call}\n#endif\n'
              modified_code = modified_code[:pos] + insert_code + modified_code[pos:]
              inserted_count += 1
              print(f"✅ {func_name}: 已插入KSU hook。")
          
          # 检查并添加外部声明 (如果补丁应用后代码中没有)
          if inserted_count > 0 and '#ifdef CONFIG_KSU' not in modified_code:
              # 在合适的位置（例如 #include 块之后）插入声明
              ksu_decls = '''
          #ifdef CONFIG_KSU
          extern int ksu_bprm_check(struct linux_binprm *bprm);
          extern int ksu_inode_rename(struct inode *old_dir, struct dentry *old_dentry, 
          \t\t\t\tstruct inode *new_dir, struct dentry *new_dentry);
          extern int ksu_task_fix_setuid(struct cred *new, const struct cred *old, int flags);
          extern int ksu_file_permission(struct file *file, int mask);
          extern int ksu_hide_setprocattr(const char *name, void *value, size_t size);
          #endif
          '''
              # 寻找最后一个 #include 的位置
              include_matches = list(re.finditer(r'^#include\s+[<"][^>"]+[>"]', modified_code, re.MULTILINE))
              if include_matches:
                  last_include_end = include_matches[-1].end()
                  # 在最后一个 include 后面插入
                  modified_code = modified_code[:last_include_end] + '\n' + ksu_decls + modified_code[last_include_end:]
                  print("✅ 已添加KSU外部声明。")
              else:
                  # 保底：在文件开头插入
                  modified_code = ksu_decls + modified_code
                  print("✅ 已在文件开头添加KSU外部声明。")
          
          # 写回修改
          if inserted_count > 0:
              with open('security/security.c', 'w') as f:
                  f.write(modified_code)
              print(f"\n🎉 成功重新生成补丁！共插入 {inserted_count} 个KSU hook。")
          else:
              print("\n⚠️ 没有插入任何新的KSU hook，可能补丁已完全应用或函数未找到。")
              # 如果没有修改，但之前补丁打不上，这里可能有问题，但我们允许继续
          EOF

      - name: Generate final patch file
        working-directory: kernel
        run: |
          echo "生成最终补丁文件..."
          
          # 如果有修改，生成补丁
          if ! diff -q security/security.c security/security.c.orig > /dev/null; then
              git diff -U5 security/security.c > ../regenerated-security-hooks.patch
              echo "✅ 补丁已生成: regenerated-security-hooks.patch"
              echo "补丁大小: $(wc -l < ../regenerated-security-hooks.patch) 行"
          else
              echo "ℹ️  security.c 无任何变化，补丁为空。"
              # 创建一个空文件以保持artifact流程一致
              touch ../regenerated-security-hooks.patch
          fi

      - name: Verify final patch (if exists)
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          if [ -s ../regenerated-security-hooks.patch ]; then
            echo "验证重新生成的补丁..."
            # 恢复原始文件进行测试
            cp security/security.c.orig security/security.c.test
            
            # 尝试应用新补丁
            if git apply --check ../regenerated-security-hooks.patch; then
              echo "✅ 重新生成的补丁验证通过，可以干净应用！"
            else
              echo "❌ 重新生成的补丁仍然无法应用，请检查。"
              exit 1
            fi
          else
            echo "⚠️  没有生成新补丁，跳过验证。"
          fi

      - name: Upload patches and modified file
        uses: actions/upload-artifact@v4
        with:
          name: ksu-patches-and-source
          path: |
            original.patch
            regenerated-security-hooks.patch
            kernel/security/security.c
            kernel/security/security.c.orig
          retention-days: 30

      - name: Workflow Summary
        run: |
          echo "## ✅ 工作流执行完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的文件：" >> $GITHUB_STEP_SUMMARY
          echo "- **original.patch**: 你提供的原始补丁" >> $GITHUB_STEP_SUMMARY
          echo "- **regenerated-security-hooks.patch**: 基于最新内核源码重新生成的新补丁 (如果原始补丁冲突)" >> $GITHUB_STEP_SUMMARY
          echo "- **security.c**: 最终修改后的安全源文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 如何使用：" >> $GITHUB_STEP_SUMMARY
          echo "1. 从Actions运行的Artifacts区域下载 `ksu-patches-and-source.zip`。" >> $GITHUB_STEP_SUMMARY
          echo "2. 在目标内核目录执行: \`git apply regenerated-security-hooks.patch\`" >> $GITHUB_STEP_SUMMARY
