name: Apply & Regenerate KSU Security Patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '目标内核分支 (例如: 16.0.0-sultan)'
        required: true
        default: '16.0.0-sultan'
      original_patch_url:
        description: '原始补丁的URL'
        required: false
        default: 'https://raw.githubusercontent.com/yapixel/cheetah_kernel_build/main/.github/patches/6.12.manual-security-hooks-v2.0.patch'

jobs:
  patch-and-regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target kernel repository
        uses: actions/checkout@v4
        with:
          repository: kerneltoast/android_kernel_google_tensynos
          ref: ${{ github.event.inputs.target_branch }}
          path: kernel

      - name: Download original patch
        run: |
          echo "下载原始补丁..."
          curl -L -o original.patch ${{ github.event.inputs.original_patch_url }}
          echo "原始补丁内容预览:"
          head -n 30 original.patch

      - name: Prepare kernel source
        working-directory: kernel
        run: |
          pwd
          ls -la security/
          cp security/security.c security/security.c.orig
          echo "✅ 备份文件已创建: security/security.c.orig"
          ls -la security/security.c.orig

      - name: Try to apply original patch
        working-directory: kernel
        run: |
          echo "尝试应用原始补丁..."
          if git apply --check --whitespace=fix ../original.patch 2> apply_error.log; then
            echo "✅ 原始补丁可以干净应用！"
            git apply --whitespace=fix ../original.patch
            echo "NEED_REGENERATE=false" >> $GITHUB_ENV
          else
            echo "⚠️ 原始补丁无法干净应用，将重新生成。"
            cat apply_error.log
            cp security/security.c.orig security/security.c
            echo "NEED_REGENERATE=true" >> $GITHUB_ENV
          fi

      - name: Regenerate patch from current source
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          echo "基于当前内核源码重新生成 KSU 补丁..."
          
          python3 << 'PYTHON_SCRIPT'
          import re
          import sys
          import os
          
          if not os.path.exists('security/security.c'):
              print("❌ security/security.c 不存在！")
              sys.exit(1)
          
          with open('security/security.c', 'r') as f:
              code = f.read()
          
          hooks = {
              'security_bprm_check': 'ksu_bprm_check(bprm);',
              'security_inode_rename': 'ksu_inode_rename(old_dir, old_dentry, new_dir, new_dentry);',
              'security_file_permission': 'ksu_file_permission(file, mask);',
              'security_task_fix_setuid': 'ksu_task_fix_setuid(new, old, flags);',
              'security_setprocattr': 'ksu_hide_setprocattr(name, value, size);'
          }
          
          modified_code = code
          inserted_count = 0
          not_found = []
          
          for func_name, hook_call in hooks.items():
              ksu_func = func_name.replace('security_', 'ksu_')
              
              if ksu_func in modified_code:
                  print(f"⏭️  {func_name}: KSU hook 已存在，跳过。")
                  continue
              
              pattern = rf'^(.*?\bint\s+(?:__maybe_unused\s+)?{func_name}\s*\([^)]*\)\s*\{{)'
              match = re.search(pattern, modified_code, re.MULTILINE)
              
              if not match:
                  not_found.append(func_name)
                  print(f"❌ {func_name}: 在当前内核中未找到函数定义。")
                  continue
              
              func_start = match.end()
              pos = func_start
              while pos < len(modified_code) and modified_code[pos] in ' \t\n\r':
                  pos += 1
              
              insert_code = f'\n#ifdef CONFIG_KSU\n\t{hook_call}\n#endif\n'
              modified_code = modified_code[:pos] + insert_code + modified_code[pos:]
              inserted_count += 1
              print(f"✅ {func_name}: 已插入 KSU hook。")
          
          if inserted_count > 0 and 'extern int ksu_bprm_check' not in modified_code:
              ksu_decls = '''
          #ifdef CONFIG_KSU
          extern int ksu_bprm_check(struct linux_binprm *bprm);
          extern int ksu_inode_rename(struct inode *old_dir, struct dentry *old_dentry, 
          \t\t\t\tstruct inode *new_dir, struct dentry *new_dentry);
          extern int ksu_task_fix_setuid(struct cred *new, const struct cred *old, int flags);
          extern int ksu_file_permission(struct file *file, int mask);
          extern int ksu_hide_setprocattr(const char *name, void *value, size_t size);
          #endif
          '''
              include_matches = list(re.finditer(r'^#include\s+[<"][^>"]+[>"]', modified_code, re.MULTILINE))
              if include_matches:
                  last_include_end = include_matches[-1].end()
                  modified_code = modified_code[:last_include_end] + '\n' + ksu_decls + modified_code[last_include_end:]
                  print("✅ 已添加 KSU 外部声明。")
              else:
                  modified_code = ksu_decls + modified_code
                  print("✅ 已在文件开头添加 KSU 外部声明。")
          
          if inserted_count > 0:
              with open('security/security.c', 'w') as f:
                  f.write(modified_code)
              print(f"\n🎉 成功重新生成补丁！共插入 {inserted_count} 个 KSU hook。")
              if not_found:
                  print(f"⚠️ 以下函数未找到: {', '.join(not_found)}")
          else:
              print("\n⚠️ 没有插入任何新的 KSU hook。")
              sys.exit(1)
          PYTHON_SCRIPT

      - name: Generate clean patch
        if: env.NEED_REGENERATE == 'true'
        working-directory: kernel
        run: |
          echo "生成补丁文件..."
          git diff -U3 security/security.c > ../regenerated-security-hooks.patch
          sed -i 's/[[:space:]]*$//' ../regenerated-security-hooks.patch
          echo "✅ 补丁已生成: regenerated-security-hooks.patch"
          echo "补丁大小: $(wc -l < ../regenerated-security-hooks.patch) 行"
          head -n 10 ../regenerated-security-hooks.patch

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-patches-and-source
          path: |
            original.patch
            regenerated-security-hooks.patch
            kernel/security/security.c
            kernel/security/security.c.orig
          retention-days: 30

      - name: Workflow Summary
        run: |
          echo "## ✅ 工作流执行完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的文件：" >> $GITHUB_STEP_SUMMARY
          echo "- **original.patch**: 原始补丁" >> $GITHUB_STEP_SUMMARY
          echo "- **regenerated-security-hooks.patch**: 重新生成的补丁" >> $GITHUB_STEP_SUMMARY
          echo "- **security.c**: 最终修改后的文件" >> $GITHUB_STEP_SUMMARY
          echo "- **security.c.orig**: 原始备份文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 如何应用：" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 Artifact 并解压" >> $GITHUB_STEP_SUMMARY
          echo "2. 进入内核目录: \`cd kernel\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 应用补丁: \`git apply ../regenerated-security-hooks.patch\`" >> $GITHUB_STEP_SUMMARY
          echo "4. 如果失败: \`patch -p1 < ../regenerated-security-hooks.patch\`" >> $GITHUB_STEP_SUMMARY