name: Generate Git-Style Clean Patch

on:
  workflow_dispatch:

jobs:
  build-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Workspace & Target
        run: |
          mkdir -p work_tree/security
          cd work_tree

          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 下载目标 security.c
          curl -sSL "https://raw.githubusercontent.com/kerneltoast/android_kernel_google_tensynos/refs/heads/16.0.0-sultan/security/security.c" -o security/security.c

          # 2. 提交初始状态作为 git diff 基准
          git add security/security.c
          git commit -m "base: pristine security.c"

      - name: Patch Security Hooks via Python Injector
        working-directory: work_tree
        run: |
          python3 - << 'EOF'
          import re
          import sys

          path = "security/security.c"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          orig_content = content

          # 注入 EXPORT_SYMBOL / hook 声明与核心逻辑 (针对 manual-security-hooks 常见函数)
          hooks_to_export = [
              "security_task_fix_setuid",
              "security_task_prctl",
              "security_inode_create",
              "security_inode_unlink",
              "security_inode_link",
              "security_inode_symlink",
              "security_inode_mkdir",
              "security_inode_rmdir",
              "security_inode_mknod",
              "security_inode_rename",
              "security_inode_setattr",
              "security_inode_getattr",
              "security_path_truncate",
              "security_file_permission",
              "security_file_open",
              "security_bprm_check",
              "security_bprm_creds_for_exec",
          ]

          # 为每个 target hook 确保有 EXPORT_SYMBOL
          for hook in hooks_to_export:
              # 匹配函数体结束的大括号
              pattern = rf'(int\s+{hook}\s*\([^)]*\)\s*\{{.*?^\}})'
              match = re.search(pattern, content, flags=re.DOTALL | re.MULTILINE)
              if match:
                  func_block = match.group(1)
                  export_line = f"\nEXPORT_SYMBOL({hook});"
                  if export_line not in content:
                      content = content.replace(func_block, func_block + export_line)

          # 如果有自包含的 manual security hook 替换宏/函数，确保写入
          if content == orig_content:
              print("Warning: No regex matches found, using fallback search & replace", file=sys.stderr)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Patch injection completed.")
          EOF

      - name: Generate & Verify Git Patch
        working-directory: work_tree
        run: |
          mkdir -p ../artifacts

          # 生成标准 Git diff 补丁
          git diff security/security.c > ../artifacts/manual-security-hooks-clean.patch

          # 检查补丁是否为空
          if [ ! -s ../artifacts/manual-security-hooks-clean.patch ]; then
            echo "::error ::Patch file is still empty! Target functions not matched."
            exit 1
          fi

          # 生成可直接用于 git am 的提交补丁
          git add security/security.c
          git commit -m "security: apply manual security hooks"
          git format-patch -1 HEAD -o ../artifacts/

          echo "Clean git patch generated successfully."

      - name: Upload Clean Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-git-patch
          path: artifacts/
