name: Build anaconda GKI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master
  CLANG_VERSION: "19"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      susfs_ver: ${{ steps.meta.outputs.susfs_ver }}
      clang_ver: ${{ steps.meta.outputs.clang_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libssl-dev libelf-dev \
            libncurses-dev cpio rsync git wget zip unzip python3

      - name: Setup Clang 19 Toolchain
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz -O clang.tar.gz
          mkdir -p clang-19
          tar -xf clang.tar.gz -C clang-19
          # 存入环境变量供后续使用
          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/clang-19/bin" >> $GITHUB_ENV
          
          # GCC 4.9 用于 GKI 2.0 兼容性链接
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-arm64/bin/aarch64-linux-android-" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          git clone --depth=1 https://github.com/yapixel/anaconda_kernel_google_tensynos -b anaconda-gki common
          cd common
          git submodule update --init --recursive
          cd ..
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply build-reproducibility patches
        working-directory: common
        run: |
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do
            [ -f "$p" ] && patch -p1 < "$p" || echo "Optional patch $p skipped."
          done

      - name: Collect build metadata
        id: meta
        run: |
          S_TAG=$(git -C common rev-parse --short HEAD)
          chmod +x sh/get_ksuver.sh
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "0000")
          SU_VER=$(grep -m1 'define SUSFS_VERSION' common/include/linux/susfs.h | grep -oP '".*?"' | tr -d '"' || echo "integrated")
          
          # 使用绝对路径获取 clang 版本
          C_VER=$(${{ env.TOOLCHAIN_PATH }}/clang --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=${SU_VER}" >> "$GITHUB_OUTPUT"
          echo "clang_ver=${C_VER}" >> "$GITHUB_OUTPUT"

      - name: Integrate xxKSU Submodule
        run: |
          cd common
          [ -d "drivers" ] && DRIVER_DIR="drivers" || DRIVER_DIR="common/drivers"
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q "source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_DIR/Kconfig"

      - name: Setup Config Pillars
        run: |
          cd common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # 强制清理 LOCALVERSION 以适配 Android 16 (6.12)
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Sultan-gs201"' >> "$DEFCONFIG"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG"

          cat <<EOF >> "$DEFCONFIG"
          # KernelSU & SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # Networking Fortress (atp4pixel)
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_ESP=y
          
          # System Optimizations
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_INODE64=y
          CONFIG_WERROR=n
          EOF

      - name: Build Kernel (GKI Production)
        working-directory: common
        env:
          KBUILD_BUILD_USER: kleaf
          KBUILD_BUILD_HOST: build-host
          # 修复关键点：直接引用系统 $PATH，确保 /usr/bin/make 可用
          PATH: ${{ env.TOOLCHAIN_PATH }}:${{ env.PATH }}:/usr/bin:/bin
        run: |
          # 再次确认暴力修复版本号脚本
          echo "Force cleaning setlocalversion to prevent string overflow..."
          echo "#!/bin/sh" > scripts/setlocalversion
          echo "exit 0" >> scripts/setlocalversion
          chmod +x scripts/setlocalversion
          
          # 验证工具链
          make --version
          
          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            gki_defconfig
          
          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            -j"$(nproc --all)"

      - name: Package AnyKernel3
        id: package
        run: |
          if [ -f common/out/arch/arm64/boot/Image.lz4 ]; then
            cp common/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          else
            cp common/out/arch/arm64/boot/Image AK3/Image
          fi
          
          [ -f common/out/arch/arm64/boot/dts/google/gs201-dtb.img ] && cp common/out/arch/arm64/boot/dts/google/gs201-dtb.img AK3/dtb || true
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          SU_VER="${{ steps.meta.outputs.susfs_ver }}"
          
          ZIP_NAME="Sultan-gs201-${S_TAG}-xxKSU-r${K_VER}-SUSFS-${SU_VER}.zip"
          cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gs201-kernel-artifact
          path: ${{ env.ZIP_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          K_VER: ${{ needs.build.outputs.ksu_ver }}
          SU_VER: ${{ needs.build.outputs.susfs_ver }}
          S_TAG: ${{ needs.build.outputs.sultan_tag }}
          CLANG_VER: ${{ needs.build.outputs.clang_ver }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          TAG="${DATE}-r$(date +%H%M)"
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          gh release create "$TAG" artifacts/*.zip \
            --title "Sultan GKI Build — $TAG" \
            --notes "
            ### 🚀 Build Information
            - **Kernel Base:** Sultan ($S_TAG)
            - **Target:** Pixel 7 (gs201)
            - **xxKSU Ver:** \`r$K_VER\`
            - **SUSFS Ver:** \`$SU_VER\`
            - **Compiler:** Clang $CLANG_VER
            "
