name: Build anaconda GKI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      susfs_ver: ${{ steps.meta.outputs.susfs_ver }}
      clang_ver: ${{ steps.meta.outputs.clang_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libssl-dev libelf-dev \
            libncurses-dev cpio rsync git wget zip unzip python3 python-is-python3

      - name: Setup Clang 19 Toolchain
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz -O clang.tar.gz
          mkdir -p clang-19 && tar -xf clang.tar.gz -C clang-19
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-19" >> $GITHUB_ENV
          echo "GCC_DIR=$GITHUB_WORKSPACE/gcc-arm64" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          # 克隆主源码
          git clone --depth=1 https://github.com/yapixel/anaconda_kernel_google_tensynos -b anaconda-gki common
          cd common
          # 核心修改：拉取内置的子模块 (xxKSU 等)
          git submodule update --init --recursive
          cd ..
          
          # 克隆配套工具
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Apply Sultan reproducibility patches
        working-directory: common
        run: |
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do
            [ -f "$p" ] && patch -p1 < "$p" || echo "Optional patch $p skipped."
          done

      - name: Collect build metadata
        id: meta
        run: |
          cd common
          S_TAG=$(git rev-parse --short HEAD)
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          
          chmod +x ../sh/get_ksuver.sh
          # 如果 submodule 已拉取，尝试从源码获取版本
          K_VER=$(../sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "0000")
          SU_VER=$(grep -m1 'define SUSFS_VERSION' include/linux/susfs.h | grep -oP '".*?"' | tr -d '"' || echo "integrated")
          C_VER=$(${{ env.CLANG_DIR }}/bin/clang --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          
          echo "ksu_ver=${K_VER}" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=${SU_VER}" >> "$GITHUB_OUTPUT"
          echo "clang_ver=${C_VER}" >> "$GITHUB_OUTPUT"

      - name: Setup Config Pillars (atp4pixel & SUSFS Flags)
        run: |
          cd common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # 1. 暴力截断 LOCALVERSION (UTS_RELEASE 64字节限制)
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG"
          echo 'CONFIG_LOCALVERSION="-Sultan-gs201"' >> "$DEFCONFIG"
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG"

          # 2. 注入开启 Flag (由于代码已集成，只需在配置中开启)
          cat <<EOF >> "$DEFCONFIG"
          # KernelSU & SUSFS Enabled
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y

          # Networking Fortress (ATPd support)
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_ESP=y
          
          # System Stability
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_INODE64=y
          CONFIG_WERROR=n
          EOF

          # 禁用 KPROBES 以保持稳定
          sed -i '/CONFIG_KPROBES/d' "$DEFCONFIG"
          echo "# CONFIG_KPROBES is not set" >> "$DEFCONFIG"

      - name: Build Kernel (GKI Production)
        working-directory: common
        run: |
          # 1. 局部导出 PATH 确保 make/clang 绝对可用
          export PATH="${{ env.CLANG_DIR }}/bin:${{ env.GCC_DIR }}/bin:/usr/bin:/bin:$PATH"
          
          # 2. 暴力修复版本号后缀溢出
          echo "#!/bin/sh" > scripts/setlocalversion
          echo "exit 0" >> scripts/setlocalversion
          chmod +x scripts/setlocalversion
          export LOCALVERSION_AUTO=none

          # 3. 注入编译器兼容性参数 (屏蔽 Clang 19 的报错)
          export KCFLAGS="-Wno-unknown-warning-option -Wno-error -O2 -pipe -fno-stack-protector"
          
          # 4. 导出完整 LLVM 工具链变量
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          # 5. 执行编译
          make O=out gki_defconfig
          
          # 二次同步 LOCALVERSION 确保不被覆盖
          sed -i '/CONFIG_LOCALVERSION/d' out/.config
          echo 'CONFIG_LOCALVERSION="-Sultan-gs201"' >> out/.config
          
          make O=out -j$(nproc --all)

      - name: Package AnyKernel3
        run: |
          [ -f common/out/arch/arm64/boot/Image ] || exit 1
          cp common/out/arch/arm64/boot/Image AK3/
          if [ -f common/out/arch/arm64/boot/dts/google/gs201-dtb.img ]; then
            cp common/out/arch/arm64/boot/dts/google/gs201-dtb.img AK3/dtb
          fi
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          ZIP_NAME="Sultan-anaconda-gs201-${S_TAG}-xxKSU-r${K_VER}.zip"
          cd AK3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gs201-kernel-artifact
          path: ${{ env.ZIP_PATH }}
