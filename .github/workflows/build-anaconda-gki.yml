name: Build anaconda GKI

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sultan_tag: ${{ steps.meta.outputs.sultan_tag }}
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      susfs_ver: ${{ steps.meta.outputs.susfs_ver }}
      clang_ver: ${{ steps.meta.outputs.clang_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc libssl-dev libelf-dev \
            libncurses-dev cpio rsync git wget zip unzip python3 python-is-python3

      - name: Setup Clang 19 Toolchain
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz -O clang.tar.gz
          mkdir -p clang-19 && tar -xf clang.tar.gz -C clang-19
          
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          
          # 存入 Workdir 变量方便下步引用
          echo "CLANG_DIR=$GITHUB_WORKSPACE/clang-19" >> $GITHUB_ENV
          echo "GCC_DIR=$GITHUB_WORKSPACE/gcc-arm64" >> $GITHUB_ENV

      - name: Clone source and dependencies
        run: |
          git clone --depth=1 https://github.com/yapixel/anaconda_kernel_google_tensynos -b anaconda-gki common
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b sultan-gs201 AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" -b dev kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Collect metadata & Apply sultans
        id: meta
        run: |
          cd common
          S_TAG=$(git rev-parse --short HEAD)
          echo "sultan_tag=${S_TAG}" >> "$GITHUB_OUTPUT"
          
          # Patch setlocalversion 等
          PATCHES=(
            "../kernel_patches/sultan/60_scripts_mkcompile_h.patch"
            "../kernel_patches/sultan/61_scripts_setlocalversion.patch"
            "../kernel_patches/sultan/62_init_Makefile.patch"
          )
          for p in "${PATCHES[@]}"; do [ -f "$p" ] && patch -p1 < "$p" || true; done
          
          # Version info
          C_VER=$(${{ env.CLANG_DIR }}/bin/clang --version | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "clang_ver=${C_VER}" >> "$GITHUB_OUTPUT"
          echo "ksu_ver=0000" >> "$GITHUB_OUTPUT" # 简化占位
          echo "susfs_ver=integrated" >> "$GITHUB_OUTPUT"

      - name: Build Kernel (GKI Production)
        working-directory: common
        run: |
          # 1. 强制修复 PATH
          export PATH="${{ env.CLANG_DIR }}/bin:${{ env.GCC_DIR }}/bin:/usr/bin:/bin:$PATH"
          
          # 2. 暴力修复版本号超标
          echo "#!/bin/sh" > scripts/setlocalversion
          echo "exit 0" >> scripts/setlocalversion
          chmod +x scripts/setlocalversion
          export LOCALVERSION_AUTO=none

          # 3. 注入编译器兼容性参数 (解决 uninitialized-const-pointer 报错)
          export KCFLAGS="-Wno-unknown-warning-option -Wno-error -O2 -pipe -fno-stack-protector"
          
          # 4. 编译器变量完整导出
          export LLVM=1
          export LLVM_IAS=1
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          # 5. 执行编译
          make O=out gki_defconfig
          
          # 再次在 .config 中强制注入防止被 Makefile 覆盖
          sed -i '/CONFIG_LOCALVERSION/d' out/.config
          echo 'CONFIG_LOCALVERSION="-Sultan-gs201"' >> out/.config
          
          make O=out -j$(nproc --all)

      - name: Package & Release
        run: |
          # 检查编译产物
          [ -f common/out/arch/arm64/boot/Image ] || exit 1
          cp common/out/arch/arm64/boot/Image AK3/
          
          S_TAG="${{ steps.meta.outputs.sultan_tag }}"
          ZIP_NAME="Sultan-anaconda-gs201-${S_TAG}.zip"
          
          cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: anaconda-kernel
          path: ${{ env.ZIP_PATH }}
