name: Build Google KSU

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "KernelSU Branch"
        required: true
        type: choice
        options:
          - "master"
          - "staging"
        default: "master"
      hook_mode:
        description: "Hook Mode to Build"
        required: true
        type: choice
        options:
          - "manual"
          - "lsm"
          - "all"
        default: "manual"
      enable_susfs:
        description: "SuSFS Integration"
        required: true
        type: choice
        options:
          - "true"
          - "false"
          - "all"
        default: "true"
      use_ccache:
        description: "Enable Ccache Acceleration"
        required: true
        type: boolean
        default: true
      upload_debug_symbols:
        description: "Upload Debug Symbols (vmlinux & System.map)"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.ksu_branch }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: "android14"
  KERNEL_NAME: "android14-11-gfa1d6308d1fe-ab14691759"
  PANTAH_SOURCE_URL: "https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz"
  KBUILD_BUILD_USER: "build-user"
  KBUILD_BUILD_HOST: "build-host"
  BUILD_TIMESTAMP: "Fri Jan 9 16:33:46 UTC 2026"
  ANYKERNEL_REPO: https://github.com/yapixel/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  SUSFS_REPO_BRANCH: gki-android14-6.1
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  CLANG_VERSION: 17.0.6
  ARM_TOOLCHAIN_VERSION: 14.2.rel1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_TEMPDIR: /dev/shm/ccache-temp
  USE_CCACHE: 1
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules,system_headers
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSTYPE: zstd
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  # =========================================================================
  # STAGE 1: Download & Prepare Clean Pantah Kernel Source ONCE
  # =========================================================================
  prepare_source:
    name: Prepare Pantah Source
    runs-on: ubuntu-latest
    outputs:
      hook_matrix: ${{ steps.matrix_calc.outputs.hook_matrix }}
      susfs_matrix: ${{ steps.matrix_calc.outputs.susfs_matrix }}
    steps:
      - name: Calculate Dynamic Matrix
        id: matrix_calc
        run: |
          HOOK_INPUT="${{ github.event.inputs.hook_mode || 'manual' }}"
          SUSFS_INPUT="${{ github.event.inputs.enable_susfs || 'true' }}"

          if [ "$HOOK_INPUT" = "all" ]; then
            echo 'hook_matrix=["manual", "lsm"]' >> "$GITHUB_OUTPUT"
          else
            echo "hook_matrix=[\"$HOOK_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

          if [ "$SUSFS_INPUT" = "all" ]; then
            echo 'susfs_matrix=["true", "false"]' >> "$GITHUB_OUTPUT"
          else
            echo "susfs_matrix=[\"$SUSFS_INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Source Cache
        id: source_cache
        uses: ./.github/actions/restore-cache-retry
        with:
          path: common
          key: pantah-kernel-v3-15260412

      - name: Download & Prepare Source (on cache miss)
        if: steps.source_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update && sudo apt install -y aria2 tar xz-utils curl wget
          mkdir -p common
          echo "⬇️ Downloading official Google Pantah (Pixel 7/Pro) kernel source (15260412)..."

          aria2c -s 16 -x 16 -k 1M "${{ env.PANTAH_SOURCE_URL }}" -o pantah.tar.xz
          mkdir -p temp_pantah
          tar -xf pantah.tar.xz -C temp_pantah
          rm -f pantah.tar.xz

          if [ -d "temp_pantah/kernel-pantah-15260412/common/ack" ]; then
            cp -a temp_pantah/kernel-pantah-15260412/common/ack/. common/
          elif [ -d "temp_pantah/kernel-pantah-15260412/common/gki" ]; then
            cp -a temp_pantah/kernel-pantah-15260412/common/gki/. common/
          elif [ -d "temp_pantah/common/ack" ]; then
            cp -a temp_pantah/common/ack/. common/
          elif [ -f "temp_pantah/Makefile" ]; then
            cp -a temp_pantah/. common/
          fi
          rm -rf temp_pantah

          if [ ! -f "common/Makefile" ] || [ ! -d "common/arch/arm64" ] || [ ! -d "common/drivers" ]; then
            echo "❌ ERROR: Kernel source tree invalid in common/:"
            ls -la common
            exit 1
          fi

          # Clean dirty suffix & remove ABI limitations
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' common/scripts/setlocalversion 2>/dev/null || true
          sed -i 's/-dirty//g' common/scripts/setlocalversion 2>/dev/null || true
          sed -i 's/check_defconfig//' common/build.config.gki 2>/dev/null || true

          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i 's|echo "$res"|echo "-${{ env.KERNEL_NAME }}"|' "$f" || true
          done

          echo "✅ Pantah kernel source prepared successfully:"
          head -n 6 common/Makefile
          ls -la common/arch/arm64/configs/gki_defconfig

      - name: Save Clean Kernel Source Cache
        if: steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: common
          key: pantah-kernel-v3-15260412

      - name: Check Toolchains Cache
        id: toolchain_cache
        uses: ./.github/actions/restore-cache-retry
        with:
          path: toolchains
          key: gki-toolchains-${{ env.CLANG_VERSION }}-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download & Prepare Toolchains (on cache miss)
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          # 1. LLVM Clang
          CLANG_DIR="${{ github.workspace }}/toolchains/clang-${{ env.CLANG_VERSION }}"
          if [ ! -f "$CLANG_DIR/bin/clang" ]; then
            echo "⚡ Downloading LLVM Clang ${{ env.CLANG_VERSION }}..."
            mkdir -p "$CLANG_DIR"
            CLANG_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/clang+llvm-${{ env.CLANG_VERSION }}-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
            aria2c -s 16 -x 16 -k 1M "$CLANG_URL" -o clang.tar.xz
            tar -xJf clang.tar.xz -C "$CLANG_DIR" --strip-components=1
            rm -f clang.tar.xz
          fi

          # 2. GCC 64-bit
          GCC64_DIR="${{ github.workspace }}/toolchains/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ ! -d "$GCC64_DIR/bin" ]; then
            echo "⚡ Downloading GCC 64-bit ${{ env.ARM_TOOLCHAIN_VERSION }}..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE64="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE64}" -o gcc64.tar.xz
            tar -xf gcc64.tar.xz -C toolchains
            rm -f gcc64.tar.xz
          fi

          # 3. GCC 32-bit
          GCC32_DIR="${{ github.workspace }}/toolchains/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-arm-none-linux-gnueabihf"
          if [ ! -d "$GCC32_DIR/bin" ]; then
            echo "⚡ Downloading GCC 32-bit ${{ env.ARM_TOOLCHAIN_VERSION }}..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE32="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-arm-none-linux-gnueabihf.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE32}" -o gcc32.tar.xz || true
            if [ -f "gcc32.tar.xz" ]; then
              tar -xf gcc32.tar.xz -C toolchains || true
              rm -f gcc32.tar.xz
            fi
          fi

      - name: Save Toolchains Cache
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: toolchains
          key: gki-toolchains-${{ env.CLANG_VERSION }}-${{ env.ARM_TOOLCHAIN_VERSION }}

  # =========================================================================
  # STAGE 2: Parallel Matrix Build (4 jobs, 0 downloads, instant source restore)
  # =========================================================================
  build:
    name: ${{ matrix.hook_mode == 'manual' && 'Manual' || 'LSM' }} Hook (SUSFS=${{ matrix.enable_susfs }})
    needs: prepare_source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook_mode: ${{ fromJson(needs.prepare_source.outputs.hook_matrix) }}
        enable_susfs: ${{ fromJson(needs.prepare_source.outputs.susfs_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up build environment and ccache
        run: |
          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update || true
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ccache zstd aria2 libssl-dev libelf-dev bc bison flex make \
            gcc g++ pahole zip unzip tar xz-utils curl wget

          sudo mkdir -p /dev/shm/ccache-temp
          sudo chmod 1777 /dev/shm/ccache-temp
          mkdir -p "${{ env.CCACHE_DIR }}"
          mkdir -p output_artifacts

      - name: Restore Ccache
        if: github.event.inputs.use_ccache != 'false'
        uses: ./.github/actions/restore-cache-retry
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gki-ccache-${{ matrix.hook_mode }}-${{ matrix.enable_susfs }}-${{ github.run_id }}
          restore-keys: |
            gki-ccache-${{ matrix.hook_mode }}-${{ matrix.enable_susfs }}-
            gki-ccache-

      - name: Restore Toolchains from Cache
        uses: ./.github/actions/restore-cache-retry
        with:
          path: toolchains
          key: gki-toolchains-${{ env.CLANG_VERSION }}-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Configure Toolchains
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang-${{ env.CLANG_VERSION }}"
          if [ ! -f "$CLANG_DIR/bin/clang" ]; then
            echo "⚡ Fallback downloading Clang..."
            mkdir -p "$CLANG_DIR"
            CLANG_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/clang+llvm-${{ env.CLANG_VERSION }}-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
            aria2c -s 16 -x 16 -k 1M "$CLANG_URL" -o clang.tar.xz
            tar -xJf clang.tar.xz -C "$CLANG_DIR" --strip-components=1
            rm -f clang.tar.xz
          fi

          GCC64_DIR="${{ github.workspace }}/toolchains/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu"
          if [ ! -d "$GCC64_DIR/bin" ]; then
            echo "⚡ Fallback downloading GCC 64-bit..."
            BASE_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/"
            ARCHIVE64="arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz"
            aria2c -s 16 -x 16 -k 1M "${BASE_URL}/${ARCHIVE64}" -o gcc64.tar.xz
            tar -xf gcc64.tar.xz -C toolchains
            rm -f gcc64.tar.xz
          fi

          GCC32_DIR="${{ github.workspace }}/toolchains/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-arm-none-linux-gnueabihf"

          echo "CLANG_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_PATH=$GCC64_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
          if [ -d "$GCC32_DIR/bin" ]; then
            echo "GCC_ARM32_DIR=$GCC32_DIR/bin" >> "$GITHUB_ENV"
            echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"
          fi

          if [ "${{ github.event.inputs.use_ccache }}" != "false" ]; then
            ccache -M 15G
            CCACHE_BIN="${{ github.workspace }}/.ccache-bin"
            mkdir -p "$CCACHE_BIN"
            ln -sf $(which ccache) "$CCACHE_BIN/clang"
            ln -sf $(which ccache) "$CCACHE_BIN/clang++"
            ln -sf $(which ccache) "$CCACHE_BIN/gcc"
            ln -sf $(which ccache) "$CCACHE_BIN/g++"
            ln -sf $(which ccache) "$CCACHE_BIN/aarch64-none-linux-gnu-gcc"
            echo "$CCACHE_BIN" >> "$GITHUB_PATH"
            echo "CCACHE_BIN_DIR=$CCACHE_BIN" >> "$GITHUB_ENV"
          fi

      - name: Restore Clean Kernel Source from Cache
        uses: ./.github/actions/restore-cache-retry
        with:
          path: common
          key: pantah-kernel-v3-15260412

      - name: Ensure Kernel Source Present
        run: |
          if [ ! -f "common/Makefile" ] || [ ! -f "common/arch/arm64/configs/gki_defconfig" ]; then
            echo "⚡ Cache miss fallback: Downloading and extracting Pantah kernel source..."
            mkdir -p common
            aria2c -s 16 -x 16 -k 1M "${{ env.PANTAH_SOURCE_URL }}" -o pantah.tar.xz
            mkdir -p temp_pantah
            tar -xf pantah.tar.xz -C temp_pantah
            rm -f pantah.tar.xz

            if [ -d "temp_pantah/kernel-pantah-15260412/common/ack" ]; then
              cp -a temp_pantah/kernel-pantah-15260412/common/ack/. common/
            elif [ -d "temp_pantah/kernel-pantah-15260412/common/gki" ]; then
              cp -a temp_pantah/kernel-pantah-15260412/common/gki/. common/
            elif [ -d "temp_pantah/common/ack" ]; then
              cp -a temp_pantah/common/ack/. common/
            elif [ -f "temp_pantah/Makefile" ]; then
              cp -a temp_pantah/. common/
            fi
            rm -rf temp_pantah

            # Clean dirty suffix & remove ABI limitations
            rm -f common/android/abi_gki_protected_exports_* || true
            sed -i 's/ -dirty//g' common/scripts/setlocalversion 2>/dev/null || true
            sed -i 's/-dirty//g' common/scripts/setlocalversion 2>/dev/null || true
            sed -i 's/check_defconfig//' common/build.config.gki 2>/dev/null || true
          fi

          if [ ! -f "common/Makefile" ] || [ ! -f "common/arch/arm64/configs/gki_defconfig" ] || [ ! -d "common/drivers" ]; then
            echo "❌ ERROR: Kernel source tree invalid in common/:"
            ls -la common
            exit 1
          fi
          echo "✅ Pantah kernel source verified in common/:"
          head -n 6 common/Makefile
          ls -la common/arch/arm64/configs/gki_defconfig

      - name: Clone Aux Repos
        run: |
          git clone --depth=1 --single-branch --no-tags "${{ env.ANYKERNEL_REPO }}" AK3 &
          git clone --depth=1 --single-branch --no-tags "${{ env.PATCHES_REPO }}" kernel_patches &
          git clone --depth=1 --single-branch --no-tags "${{ env.SCRIPTS_REPO }}" sh &
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            git clone --depth=1 --single-branch --no-tags --branch="${{ env.SUSFS_REPO_BRANCH }}" "${{ env.SUSFS_REPO_URL }}" susfs4ksu &
          fi
          wait

      - name: Metadata & Sanitization
        id: meta
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "$KSU_BRANCH" || echo "unknown")

          RAW_CLANG_STR=$("${CLANG_PATH}/clang" --version 2>&1 | head -n1 || echo "Clang 17.0.6")
          TOOLCHAIN_DISPLAY="$RAW_CLANG_STR"

          # Dynamically determine kernel version from kernel source
          KERNEL_VER_FULL=$(make -C common -s kernelversion 2>/dev/null || true)
          if [ -z "$KERNEL_VER_FULL" ]; then
            V_MAJOR=$(grep -E '^VERSION =' common/Makefile | awk '{print $3}' | tr -d '\r')
            V_PATCH=$(grep -E '^PATCHLEVEL =' common/Makefile | awk '{print $3}' | tr -d '\r')
            V_SUB=$(grep -E '^SUBLEVEL =' common/Makefile | awk '{print $3}' | tr -d '\r')
            KERNEL_VER_FULL="${V_MAJOR}.${V_PATCH}.${V_SUB:-0}"
          fi
          V_MAJOR=$(echo "$KERNEL_VER_FULL" | cut -d. -f1)
          V_PATCH=$(echo "$KERNEL_VER_FULL" | cut -d. -f2)
          KERNEL_VER="${V_MAJOR}.${V_PATCH}"

          SUSFS_VER="unknown"
          if [ -f "susfs4ksu/kernel_patches/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep -E '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | awk -F '"' '{print $2}')
          fi

          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "toolchain_display=$TOOLCHAIN_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "kernel_ver=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "kernel_ver_full=$KERNEL_VER_FULL" >> "$GITHUB_OUTPUT"
          echo "susfs_ver=$SUSFS_VER" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "🐧 Kernel Base: Linux $KERNEL_VER_FULL (GKI)"
          echo "🔧 KSU Branch: $KSU_BRANCH (+$K_VER)"
          echo "🪝 Hook Mode: ${{ matrix.hook_mode }}"
          echo "🛡️ SUSFS: ${{ matrix.enable_susfs }} ($SUSFS_VER)"
          echo "⚙️ Compiler: $TOOLCHAIN_DISPLAY"
          echo "⚡ Ccache: ${{ github.event.inputs.use_ccache != 'false' && 'Enabled' || 'Disabled' }}"
          echo "======================================"

      - name: Integrate KernelSU
        run: |
          cd common
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          echo "Integrating KernelSU ($KSU_BRANCH)..."
          git clone --depth=1 --branch="$KSU_BRANCH" https://github.com/${{ env.KSU_REPO }}.git KernelSU
          ln -sf ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KSU_MAKEFILE="drivers/kernelsu/Makefile"
          if [ -f "$KSU_MAKEFILE" ]; then
            echo "" >> "$KSU_MAKEFILE"
            echo "CFLAGS_ksu.o += -DKSU_VERSION=$K_VER" >> "$KSU_MAKEFILE"
          fi

      - name: Apply Hook Patches
        if: matrix.hook_mode == 'manual'
        run: |
          cd common
          echo "Applying manual security hooks patches for GKI..."
          patch -p1 -l < "${{ github.workspace }}/.github/patches/manual-security-hooks-v2.0.patch" || true
          patch -p1 -l < "${{ github.workspace }}/.github/patches/scope-min-manual-hooks-v2.3.patch" || patch -p1 -l < "${{ github.workspace }}/.github/patches/xxksu/scope-min-manual-hooks-v2.2.patch" || true

      - name: Apply SuSFS Patches
        if: matrix.enable_susfs == 'true'
        run: |
          cd common
          echo "Applying SuSFS patches (GKI Android 14 6.1)..."
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch -p1 < "${{ github.workspace }}/.github/patches/xxksu/51_deinlined_susfs_hooks_gki-android14-6.1.patch" || true

          echo "Applying SuSFS patch to KernelSU..."
          ( cd KernelSU && patch -p1 -l --fuzz=3 < "${{ github.workspace }}/.github/patches/xxksu/11_enable_susfs_for_ksu.patch" )

      - name: Generate Defconfig
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          export KCFLAGS="-O2 -Wno-error"
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          export KBUILD_BUILD_TIMESTAMP="Fri Jan 9 16:33:46 UTC 2026"
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          export CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}"

          echo "⚙️ Generating GKI defconfig..."
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out gki_defconfig
          if [ ! -f "out/.config" ]; then
            echo "❌ ERROR: Defconfig generation failed - out/.config not found"
            exit 1
          fi
          echo "✅ GKI defconfig generated successfully"

      - name: Inject Defconfig Flags
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "common/out/.config"
          hook_mode: "${{ matrix.hook_mode }}"
          enable_susfs: "${{ matrix.enable_susfs }}"

      - name: Finalize Defconfig
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          export KCFLAGS="-O2 -Wno-error"
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          export KBUILD_BUILD_TIMESTAMP="Fri Jan 9 16:33:46 UTC 2026"
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          export CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}"

          echo "Finalizing defconfig..."
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out olddefconfig 2>&1 | grep -v "warning: override" || true

      - name: Build Kernel (Production)
        run: |
          cd common
          if [ -n "$CCACHE_BIN_DIR" ]; then
            export PATH="${CCACHE_BIN_DIR}:${CLANG_PATH}:${PATH}"
          else
            export PATH="${CLANG_PATH}:${PATH}"
          fi
          export KCFLAGS="-O2 -Wno-error"
          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"
          export KBUILD_BUILD_TIMESTAMP="Fri Jan 9 16:33:46 UTC 2026"
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC=clang
          export CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}"

          echo "Compiling GKI kernel..."
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out Image

      - name: Ccache Performance Stats
        if: github.event.inputs.use_ccache != 'false'
        run: |
          echo "=== Ccache Performance Stats (GKI ${{ matrix.hook_mode }}, SUSFS=${{ matrix.enable_susfs }}) ==="
          ccache -s

      - name: Package
        run: |
          cp common/out/arch/arm64/boot/Image AK3/Image

          DATE=$(date +"%y%m%d")
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"
          K_VER="${{ steps.meta.outputs.ksu_ver }}"
          KERNEL_VER="${{ steps.meta.outputs.kernel_ver_full }}"
          SUSFS_VER="${{ steps.meta.outputs.susfs_ver }}"

          if [ "$KSU_BRANCH" = "staging" ]; then
            BRANCH_TAG="-staging"
          else
            BRANCH_TAG=""
          fi
          
          if [ "${{ matrix.enable_susfs }}" = "true" ]; then
            SUSFS_TAG="-SUSFS_${SUSFS_VER}"
          else
            SUSFS_TAG=""
          fi

          BASE_NAME="KSU_Pantah_${KERNEL_VER}+${K_VER}${BRANCH_TAG}-${{ matrix.hook_mode }}${SUSFS_TAG}-${DATE}"
          ZIP_NAME="${BASE_NAME}.zip"

          echo "Packaging AnyKernel3: $ZIP_NAME"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )

          mkdir -p ./output_artifacts
          mv "$ZIP_NAME" ./output_artifacts/

          TOOLCHAIN_DISPLAY="${{ steps.meta.outputs.toolchain_display }}"
          echo "KERNEL_VER='${KERNEL_VER}'" > ./output_artifacts/build_metadata.env
          echo "KERNEL_VER_FULL='${KERNEL_VER}'" >> ./output_artifacts/build_metadata.env
          echo "KSU_VER='${K_VER}'" >> ./output_artifacts/build_metadata.env
          echo "TOOLCHAIN_DISPLAY='${TOOLCHAIN_DISPLAY}'" >> ./output_artifacts/build_metadata.env
          if [ "${{ matrix.enable_susfs }}" = "true" ] && [ -n "$SUSFS_VER" ] && [ "$SUSFS_VER" != "unknown" ]; then
            echo "SUSFS_VER='${SUSFS_VER}'" >> ./output_artifacts/build_metadata.env
          fi

          if [ "${{ github.event.inputs.upload_debug_symbols }}" = "true" ]; then
            echo "Packaging debug symbols..."
            VMLINUX_ZIP_NAME="vmlinux-${BASE_NAME}.zip"
            SYSMAP_ZIP_NAME="System.map-${BASE_NAME}.zip"

            if [ -f "common/out/vmlinux" ]; then
              cp common/out/vmlinux ./vmlinux
            elif [ -f "common/out/arch/arm64/boot/vmlinux" ]; then
              cp common/out/arch/arm64/boot/vmlinux ./vmlinux
            else
              find common/out -name "vmlinux" -type f -exec cp {} ./vmlinux \; || true
            fi
            if [ -f "./vmlinux" ]; then
              zip -9 "$VMLINUX_ZIP_NAME" vmlinux
              mv "$VMLINUX_ZIP_NAME" ./output_artifacts/
            fi

            if [ -f "common/out/System.map" ]; then
              cp common/out/System.map ./System.map
              zip -9 "$SYSMAP_ZIP_NAME" System.map
              mv "$SYSMAP_ZIP_NAME" ./output_artifacts/
            fi
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GKI-${{ matrix.hook_mode }}-SUSFS_${{ matrix.enable_susfs }}
          path: ./output_artifacts/*
          retention-days: 7

      - name: Save Ccache
        if: always() && github.event.inputs.use_ccache != 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gki-ccache-${{ matrix.hook_mode }}-${{ matrix.enable_susfs }}-${{ github.run_id }}

  # =========================================================================
  # STAGE 3: Unified Release Publisher
  # =========================================================================
  release:
    name: Publish Release
    needs: build
    if: ${{ github.event.inputs.create_release != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release_artifacts

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_files
          find release_artifacts -type f -name "*.zip" -exec cp {} release_files/ \;
          echo "📦 Files to release:"
          ls -lh release_files/

          # Load metadata from first available env file
          META_FILE=$(find release_artifacts -name "build_metadata.env" | head -n1)
          if [ -f "$META_FILE" ]; then
            source "$META_FILE"
            echo "KERNEL_VER=${KERNEL_VER}" >> "$GITHUB_ENV"
            echo "KERNEL_VER_FULL=${KERNEL_VER_FULL}" >> "$GITHUB_ENV"
            echo "KSU_VER=${KSU_VER}" >> "$GITHUB_ENV"
            echo "TOOLCHAIN_DISPLAY=${TOOLCHAIN_DISPLAY}" >> "$GITHUB_ENV"
            echo "SUSFS_VER=${SUSFS_VER}" >> "$GITHUB_ENV"
          fi

      - name: Generate Release Notes
        id: release_notes
        run: |
          DATE=$(date +"%Y-%m-%d")
          TIME=$(date +"%H:%M:%S")
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'master' }}"

          cat << "EOF" > release_note.md
          # 🚀 Google Pixel 7 Series (Pantah) • KernelSU & SuSFS Production Release

          > **Official Google ACK GS201 Source (Build 15260412)** • High-Performance Stealth Kernel Build

          ---

          ### 📱 Compatible Device Matrix (Tensor G2 / GS201)

          | Device Model | Codename | SoC Platform | Compatibility |
          | :--- | :--- | :--- | :---: |
          | **Google Pixel 7** | `cheetah` | Tensor G2 (`gs201`) | 🌟 **Full Native** |
          | **Google Pixel 7 Pro** | `panther` | Tensor G2 (`gs201`) | 🌟 **Full Native** |
          | **Google Pixel 7a** | `lynx` | Tensor G2 (`gs201`) | 🌟 **Full Native** |
          | **Google Pixel Fold** | `felix` | Tensor G2 (`gs201`) | ✅ **Compatible** |
          | **Google Pixel Tablet** | `tangorpro` | Tensor G2 (`gs201`) | ✅ **Compatible** |

          > **Supported OS**: Google Stock Android 14 / Android 15 (All QPRs), GrapheneOS, CalyxOS, LineageOS 21/22, and all GKI-compliant ROMs.

          ---

          ### 📦 Build & Toolchain Metadata

          EOF

          echo "- 📅 **Build Timestamp**: \`${DATE} ${TIME} (UTC)\`" >> release_note.md
          echo "- 🐧 **Kernel Base**: \`Linux ${KERNEL_VER_FULL} (Pantah 15260412)\`" >> release_note.md
          echo "- 🔧 **KernelSU**: \`${KSU_BRANCH}\` (v\`${KSU_VER:-latest}\`)" >> release_note.md
          if [ -n "${SUSFS_VER}" ] && [ "${SUSFS_VER}" != "unknown" ]; then
            echo "- 🛡️ **SuSFS Engine**: \`v${SUSFS_VER}\` (GKI android14-6.1)" >> release_note.md
          fi
          echo "- ⚙️ **Compiler Toolchain**: \`${TOOLCHAIN_DISPLAY:-Clang 17.0.6 + GCC 14.2}\`" >> release_note.md
          echo "- 🏷️ **Kernel Suffix**: \`${{ env.KERNEL_NAME }}\`" >> release_note.md

          cat << "EOF" >> release_note.md

          ---

          ### 🚀 Flashable Packages Included

          | Package Name Pattern | Hook Mechanism | SuSFS Stealth | Recommended Scenario |
          | :--- | :---: | :---: | :--- |
          | `*manual-SUSFS_true*.zip` | **Manual Hook** | ✅ **Enabled** | 🏆 **(Recommended)** Maximum root hiding & banking app bypass |
          | `*lsm-SUSFS_true*.zip` | **LSM Hook** | ✅ **Enabled** | ARM64 Hookless non-invasive isolation |
          | `*manual-SUSFS_false*.zip` | **Manual Hook** | ❌ None | Clean KernelSU experience |
          | `*lsm-SUSFS_false*.zip` | **LSM Hook** | ❌ None | Clean LSM KernelSU experience |

          ---

          ### ⚡ Performance & Kernel Enhancements
          - **Google Tensor G2 Sultan Optimization**: Custom task scheduling and thermal responsiveness.
          - **Advanced Networking**: TCP BBR v1 + FQ pacing algorithms for lower latency.
          - **Full Policy Routing**: IPSet (64k entries) & TProxy match extensions enabled.
          - **Universal AnyKernel3 Delivery**: Dynamic ramdisk patching; non-destructive to stock vendor modules.

          ---

          ### 📲 Installation Guide
          1. Download the recommended zip package (e.g. `*manual-SUSFS_true*.zip`);
          2. Flash via **KernelFlasher**, **Franco Kernel Manager**, or custom recovery (TWRP);
          3. Reboot system and install the latest **KernelSU Manager** APK & **SuSFS** module.
          EOF

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(date +"%y%m%d")
          TITLE="Pixel 7/Pro (Pantah) Kernel ${KERNEL_VER_FULL} - KernelSU"

          echo "🚀 Publishing/Updating release for tag: $TAG_NAME"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating title/notes and replacing assets..."
            gh release edit "$TAG_NAME" --title "$TITLE" --notes-file release_note.md
            gh release upload "$TAG_NAME" release_files/*.zip --clobber
          else
            echo "Creating new release for tag $TAG_NAME..."
            gh release create "$TAG_NAME" release_files/*.zip --target "${{ github.sha }}" --title "$TITLE" --notes-file release_note.md
          fi
